<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta name="krf-build" content="v12-last-rift">
<title>Kingdom Rush Frontiers — V12 The Last Rift</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}#menu{position:fixed;z-index:10;right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));width:42px;height:42px;border:1px solid rgba(255,255,255,.25);border-radius:12px;background:#171717;color:#fff;font-size:24px;touch-action:manipulation;contain:layout paint style}#panel{position:fixed;z-index:9;right:max(8px,env(safe-area-inset-right));top:calc(max(8px,env(safe-area-inset-top)) + 48px);display:none;gap:8px;width:270px;padding:10px;border:1px solid rgba(255,255,255,.2);border-radius:14px;background:#111;contain:layout paint style}#panel.open{display:grid}.btn{appearance:none;border:0;border-radius:10px;padding:11px 12px;background:#d7a94d;color:#1f1708;font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center;text-decoration:none}.secondary{background:#2d2d2d;color:#fff;border:1px solid #4b4b4b}#hint{position:fixed;z-index:8;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:7px 10px;border-radius:9px;background:#111;color:#ddd;font-size:11px;pointer-events:none;opacity:.82;white-space:nowrap}
</style>
</head>
<body>
<iframe id="game" src="/mod/fast.html?v=12-last-rift" allow="fullscreen; autoplay; clipboard-read; clipboard-write" allowfullscreen title="Kingdom Rush Frontiers V12"></iframe>
<button id="menu" aria-label="Game controls">⋯</button>
<div id="panel">
<a class="btn" href="/mod/fast.html?v=12-last-rift">Play V12 — The Last Rift</a>
<a class="btn secondary" href="/mod/">V12 details / native desktop</a>
<a class="btn secondary" href="https://github.com/recordswiper1t/recordswiper1t.github.io">Download native laptop build</a>
<button class="btn secondary" id="reload">Reload V12</button>
<button class="btn secondary" id="full">Full screen</button>
</div>
<div id="hint">V12 THE LAST RIFT • Browser mode • Native desktop recommended for huge waves</div>
<script>
const panel=document.getElementById('panel'),game=document.getElementById('game');
document.getElementById('menu').onclick=()=>panel.classList.toggle('open');
document.getElementById('reload').onclick=()=>{panel.classList.remove('open');const u=new URL('/mod/fast.html',location.origin);u.searchParams.set('v','12-last-rift-'+Date.now());game.src=u.toString()};
document.getElementById('full').onclick=()=>{panel.classList.remove('open');if(game.requestFullscreen)game.requestFullscreen().catch(()=>{})};
setTimeout(()=>{const h=document.getElementById('hint');if(h)h.style.display='none'},6500);
</script>
</body>
</html>
