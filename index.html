<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Kingdom Rush Frontiers</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#player,#archive{position:fixed;inset:0;width:100%;height:100%;background:#000}#archive{display:none}#archive iframe{width:100%;height:100%;border:0}ruffle-player{display:block;width:100%!important;height:100%!important}.loading{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#000}.loading.hide{display:none}.loadingBox{text-align:center;padding:24px}.spinner{width:42px;height:42px;margin:0 auto 14px;border:4px solid #333;border-top-color:#d7a94d;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}#menuToggle{position:fixed;z-index:80;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));width:42px;height:42px;border:1px solid rgba(255,255,255,.22);border-radius:12px;background:rgba(20,20,20,.72);color:#fff;font-size:23px;backdrop-filter:blur(10px)}#panel{position:fixed;z-index:79;top:calc(max(8px,env(safe-area-inset-top)) + 48px);right:max(8px,env(safe-area-inset-right));display:none;gap:8px;width:190px;padding:10px;border:1px solid rgba(255,255,255,.2);border-radius:14px;background:rgba(15,15,15,.9);backdrop-filter:blur(12px)}#panel.open{display:grid}button{appearance:none;border:0;border-radius:10px;padding:11px 12px;background:#d7a94d;color:#1e1608;font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button.secondary{background:#2e2e2e;color:#fff;border:1px solid #4b4b4b}#notice{position:fixed;z-index:90;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);display:none;max-width:min(92vw,520px);padding:12px 14px;border-radius:12px;background:rgba(20,20,20,.92);border:1px solid rgba(255,255,255,.18);font-size:14px;line-height:1.35;text-align:center}#notice.show{display:block}#fileInput{display:none}
</style>
</head>
<body>
<div id="player"></div>
<div id="archive"><iframe id="archiveFrame" allow="fullscreen; autoplay" allowfullscreen title="Kingdom Rush Frontiers"></iframe></div>
<div id="loading" class="loading"><div class="loadingBox"><div class="spinner"></div><div id="loadingText">Starting Kingdom Rush Frontiers…</div></div></div>
<button id="menuToggle" aria-label="Open controls">⋯</button>
<div id="panel">
  <button id="savesBtn">Saves / Mods</button>
  <button id="fullBtn" class="secondary">Full screen</button>
  <button id="reloadBtn" class="secondary">Reload game</button>
  <button id="archiveBtn" class="secondary">Archive fallback</button>
  <button id="localBtn" class="secondary">Use local SWF</button>
</div>
<input id="fileInput" type="file" accept=".swf,application/x-shockwave-flash">
<div id="notice"></div>
<script src="https://unpkg.com/@ruffle-rs/ruffle@0.4.1"></script>
<script>
(() => {
  'use strict';
  const GAME_URL='https://cache.armorgames.com/files/games/kingdom-rush-frontiers-15717.swf';
  const GAME_BASE='https://cache.armorgames.com/files/games/';
  const ARCHIVE_URL='https://archive.org/embed/kingdom-rush-frontie-15717';
  const playerHost=document.getElementById('player');
  const archive=document.getElementById('archive');
  const archiveFrame=document.getElementById('archiveFrame');
  const loading=document.getElementById('loading');
  const loadingText=document.getElementById('loadingText');
  const menuToggle=document.getElementById('menuToggle');
  const panel=document.getElementById('panel');
  const notice=document.getElementById('notice');
  const fileInput=document.getElementById('fileInput');
  let player=null;
  let noticeTimer=null;

  function toast(msg,ms=3600){clearTimeout(noticeTimer);notice.textContent=msg;notice.classList.add('show');noticeTimer=setTimeout(()=>notice.classList.remove('show'),ms)}
  function hideLoading(){loading.classList.add('hide')}
  function showLoading(msg){loadingText.textContent=msg;loading.classList.remove('hide')}
  async function persistStorage(){try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(_){} }
  function playerOptions(extra={}){return Object.assign({autoplay:'on',unmuteOverlay:'visible',contextMenu:'on',menu:true,allowFullscreen:true,fullScreenAspectRatio:'landscape',scale:'showAll',quality:'high',allowScriptAccess:false,openUrlMode:'confirm',allowNetworking:'all',upgradeToHttps:true,compatibilityRules:true,warnOnUnsupportedContent:false},extra)}
  function makePlayer(){
    const source=window.RufflePlayer&&window.RufflePlayer.newest&&window.RufflePlayer.newest();
    if(!source)throw new Error('Ruffle did not load');
    player=source.createPlayer();
    player.id='krf';
    playerHost.replaceChildren(player);
    return player;
  }
  async function loadDirect(){
    showLoading('Starting Kingdom Rush Frontiers…');
    archive.style.display='none';playerHost.style.display='block';archiveFrame.src='about:blank';
    if(!player)makePlayer();
    await persistStorage();
    await player.ruffle().load(playerOptions({url:GAME_URL,base:GAME_BASE}));
    hideLoading();
  }
  function loadArchive(){
    showLoading('Opening fallback player…');
    playerHost.style.display='none';archive.style.display='block';
    archiveFrame.onload=()=>hideLoading();
    archiveFrame.src=ARCHIVE_URL;
  }
  async function loadLocal(file){
    showLoading('Opening local game…');
    archive.style.display='none';playerHost.style.display='block';archiveFrame.src='about:blank';
    if(!player)makePlayer();
    await persistStorage();
    const data=await file.arrayBuffer();
    const b=new Uint8Array(data,0,Math.min(3,data.byteLength));
    const sig=String.fromCharCode(...b);
    if(!['FWS','CWS','ZWS'].includes(sig))throw new Error('Not a valid SWF');
    await player.ruffle().load(playerOptions({data,swfFileName:'kingdom-rush-frontiers.swf',base:GAME_BASE}));
    hideLoading();
  }
  function openRuffleMenu(){
    if(!player){toast('The fallback player is open. Press and hold inside the game for its Ruffle menu.');return}
    try{
      const rect=player.getBoundingClientRect();
      const ev=new MouseEvent('contextmenu',{bubbles:true,cancelable:true,clientX:rect.left+Math.min(100,rect.width/2),clientY:rect.top+Math.min(100,rect.height/2),button:2,buttons:2,view:window});
      player.dispatchEvent(ev);
      toast('If the menu did not open, press and hold inside the game. Choose Save Manager to export/import the save.');
    }catch(_){toast('Press and hold inside the game, then choose Save Manager.');}
  }
  menuToggle.onclick=()=>panel.classList.toggle('open');
  document.getElementById('savesBtn').onclick=()=>{panel.classList.remove('open');openRuffleMenu()};
  document.getElementById('fullBtn').onclick=()=>{panel.classList.remove('open');try{if(player&&player.ruffle().fullscreenEnabled)player.ruffle().requestFullscreen();else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}catch(_){}};
  document.getElementById('reloadBtn').onclick=()=>{panel.classList.remove('open');if(archive.style.display==='block'){archiveFrame.src=ARCHIVE_URL}else{loadDirect().catch(()=>loadArchive())}};
  document.getElementById('archiveBtn').onclick=()=>{panel.classList.remove('open');loadArchive()};
  document.getElementById('localBtn').onclick=()=>{panel.classList.remove('open');fileInput.click()};
  fileInput.onchange=()=>{const f=fileInput.files&&fileInput.files[0];fileInput.value='';if(f)loadLocal(f).catch(e=>{hideLoading();toast(e.message||String(e))})};
  window.addEventListener('load',()=>{
    loadDirect().catch(err=>{
      console.warn('Direct player failed; using archive fallback',err);
      loadArchive();
      toast('Direct player was blocked, so the archive fallback opened.');
    });
  });
})();
</script>
</body>
</html>
