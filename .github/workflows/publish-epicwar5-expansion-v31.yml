name: Publish Epic War 5 Expansion V3.1

on:
  push:
    branches:
      - epicwar5-expansion-v31-polish
    paths:
      - '.github/workflows/publish-epicwar5-expansion-v31.yml'
      - 'tools/epicwar5/expansion/**'
      - 'epicwar5-expansion/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: epicwar5-expansion-v31-polish
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download exact Epic War 5 and FFDec
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/ew5 /tmp/ffdec
          curl -fL --retry 3 --connect-timeout 20 'https://cache.armorgames.com/files/games/epic-war-5-12518.swf' -o /tmp/ew5/original.swf
          test "$(sha256sum /tmp/ew5/original.swf | cut -d' ' -f1)" = '848d173b5cba7ebc321ba6dc374389e038924e32cb4a42b0d1b31f51c0b71bb8'
          curl -fL --retry 3 'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          unzip -q /tmp/ffdec.zip -d /tmp/ffdec
      - name: Export and apply Expansion V3.1 stack
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/ew5/export /tmp/ew5/out /tmp/ew5/verify
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 -export script /tmp/ew5/export /tmp/ew5/original.swf > /tmp/ew5/export.log 2>&1 || true
          python3 tools/epicwar5/expansion/build_expansion_storage_v3.py /tmp/ew5/export
          python3 tools/epicwar5/expansion/patch_progression_curve_v3.py /tmp/ew5/export
          python3 tools/epicwar5/expansion/patch_formation_army_pages_v3.py /tmp/ew5/export
          python3 tools/epicwar5/expansion/patch_equipment_slots_v3.py /tmp/ew5/export
          python3 tools/epicwar5/expansion/patch_catalog_compat_v3.py /tmp/ew5/export
          python3 tools/epicwar5/expansion/patch_expansion_equipment_catalog_v3.py /tmp/ew5/export
          python3 tools/epicwar5/expansion/patch_advanced_upgrades_v3.py /tmp/ew5/export
          python3 tools/epicwar5/expansion/patch_battle_rewards_v3.py /tmp/ew5/export
          python3 tools/epicwar5/expansion/patch_battle_12_units_v3.py /tmp/ew5/export
          python3 tools/epicwar5/expansion/patch_progression_enforcement_v3.py /tmp/ew5/export
          python3 tools/epicwar5/expansion/patch_expansion_campaign_v3.py /tmp/ew5/export
          python3 tools/epicwar5/expansion/patch_campaign_newline_compat_v3.py /tmp/ew5/export
          python3 tools/epicwar5/expansion/patch_polish_compat_v31.py /tmp/ew5/export
          python3 tools/epicwar5/expansion/patch_polish_v31.py /tmp/ew5/export
      - name: Rebuild Expansion V3.1 SWF
        shell: bash
        run: |
          set -euxo pipefail
          if ! java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror abort -importScript /tmp/ew5/original.swf /tmp/ew5/out/epic-war-5-expansion-v31.swf /tmp/ew5/export > /tmp/ew5/import.log 2>&1; then
            echo '===== FFDec import diagnostics ====='
            cat /tmp/ew5/import.log
            exit 1
          fi
          test -s /tmp/ew5/out/epic-war-5-expansion-v31.swf
      - name: Re-decompile and verify release
        shell: bash
        run: |
          set -euxo pipefail
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 -export script /tmp/ew5/verify /tmp/ew5/out/epic-war-5-expansion-v31.swf > /tmp/ew5/verify.log 2>&1 || true
          d=/tmp/ew5/verify/scripts/Game/Manager/DataManager.as
          f=/tmp/ew5/verify/scripts/Game/Interface/WorldMapFormation.as
          s=/tmp/ew5/verify/scripts/Game/Interface/WorldMapFormationSkill.as
          c=/tmp/ew5/verify/scripts/Game/System/StatDef/CharTotalStat.as
          r=/tmp/ew5/verify/scripts/Game/Interface/BattleResult.as
          w=/tmp/ew5/verify/scripts/Game/Interface/WorldMap.as
          p=/tmp/ew5/verify/scripts/Game/System/Battle/PlayerUnit.as
          e=/tmp/ew5/verify/scripts/Game/System/Battle/EnemyWave.as
          grep -F 'getStageNormalClear() >= 12 && this.getStageExtraClear() >= 8' "$d"
          grep -F 'dat_stage_expansion_stat.length < 25' "$d"
          grep -F 'MATCH_NUM >= 10 ? 18 : 15' "$s"
          grep -F 'expansionHasAnyEquipment' "$f"
          grep -F 'Math.min(Math.max(this.pop,1),16)' "$c"
          grep -F 'Math.min(Math.max(this.reduce_damage,0),0.8)' "$c"
          grep -F 'Advanced upgrades unlocked!' "$r"
          grep -F 'this.mGF.datMgr.saveData()' "$r"
          grep -F '12 story and 8 extra' "$w"
          grep -F '_count_refresh:int' "$p"
          grep -F '_cached_total:int' "$e"
      - name: Stage verified V3.1 release files
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p assets
          cp /tmp/ew5/out/epic-war-5-expansion-v31.swf assets/epic-war-5-expansion-v31.swf
          HASH="$(sha256sum assets/epic-war-5-expansion-v31.swf | cut -d' ' -f1)"
          printf '%s  assets/epic-war-5-expansion-v31.swf\n' "$HASH" > assets/EPICWAR5-EXPANSION-V31-SHA256SUMS.txt
          cat > assets/EPICWAR5-EXPANSION-V31-BUILD.txt <<EOF
          Epic War 5 — Expansion V3.1 Polish
          Source: canonical Armor Games SWF SHA-256 848d173b5cba7ebc321ba6dc374389e038924e32cb4a42b0d1b31f51c0b71bb8
          Toolchain: FFDec 26.2.1
          Release SWF SHA-256: $HASH

          V3.1 polish changes:
          - Expansion campaign opens after 12 story + 8 extra clears; trials remain parallel challenges.
          - Advanced upgrade costs reduced from 45x rank to 18x rank.
          - Formation upgrade indicators understand all 18 upgrade slots.
          - Equipment indicators understand all three gear slots.
          - General damage reduction capped at 80% to prevent immunity stacking.
          - Per-unit population capped at 16 to control runaway 12-slot swarms.
          - Battle results announce progression unlocks and flush saves immediately.
          - Expansion save arrays self-repair to the expected length on load.
          - World-map expansion panel shows overall progress, army slots, and equipment slots.
          - Player-unit and enemy-wave population scans are throttled to reduce battlefield overhead.

          Scope unchanged:
          - 25 Expansion stages.
          - 55 total equipment entries.
          - 12 maximum army slots.
          - 18 upgrade slots per unit/hero.

          Verification:
          - Full V3 + V3.1 patch stack applied to the exact clean SWF.
          - FFDec import/rebuild succeeded.
          - Re-decompiled release contains all required V3.1 polish markers.
          EOF
      - name: Commit verified V3.1 release to polish branch
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/epic-war-5-expansion-v31.swf assets/EPICWAR5-EXPANSION-V31-BUILD.txt assets/EPICWAR5-EXPANSION-V31-SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo 'Verified V3.1 release files already current.'
            exit 0
          fi
          git commit -m 'Publish Epic War 5 Expansion V3.1 [skip ci]'
          git push origin HEAD:epicwar5-expansion-v31-polish
