name: Build Epic War 5 Expansion V3.4

on:
  push:
    branches:
      - epicwar5-expansion-runtime-sandbox
    paths:
      - '.github/workflows/build-epicwar5-expansion-v34.yml'
      - 'tools/epicwar5/expansion/patch_runtime_sandbox_v34.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: epicwar5-expansion-runtime-sandbox
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Freeze V3.3.1 baseline and download FFDec
        shell: bash
        run: |
          set -euxo pipefail
          EXPECTED='40712cc3685861ee93a97ad49cd4ff71c2ebc55c9959a1d9f160fcf39e8d6577'
          test -s assets/epic-war-5-expansion-v331.swf
          test "$(sha256sum assets/epic-war-5-expansion-v331.swf | cut -d' ' -f1)" = "$EXPECTED"
          mkdir -p /tmp/ffdec /tmp/v34/src /tmp/v34/out /tmp/v34/verify
          curl -fL --retry 3 'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          unzip -q /tmp/ffdec.zip -d /tmp/ffdec
          test -f /tmp/ffdec/ffdec.jar
      - name: Decompile V3.3.1 and apply V3.4 runtime/sandbox patch
        shell: bash
        run: |
          set -euxo pipefail
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 -export script /tmp/v34/src assets/epic-war-5-expansion-v331.swf > /tmp/v34/export.log 2>&1 || true
          test -f /tmp/v34/src/scripts/Game/Interface/WorldMap.as
          test -f /tmp/v34/src/scripts/Game/System/Battle/BattleSystem.as
          python3 tools/epicwar5/expansion/patch_runtime_sandbox_v34.py /tmp/v34/src
      - name: Rebuild V3.4 SWF
        shell: bash
        run: |
          set -euxo pipefail
          if ! java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror abort -importScript assets/epic-war-5-expansion-v331.swf /tmp/v34/out/epic-war-5-expansion-v34.swf /tmp/v34/src > /tmp/v34/import.log 2>&1; then
            echo '===== FFDec V3.4 import diagnostics ====='
            cat /tmp/v34/import.log
            exit 1
          fi
          test -s /tmp/v34/out/epic-war-5-expansion-v34.swf
          head -c 3 /tmp/v34/out/epic-war-5-expansion-v34.swf | grep -Eq 'FWS|CWS|ZWS'
      - name: Re-decompile and verify V3.4
        shell: bash
        run: |
          set -euxo pipefail
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 -export script /tmp/v34/verify /tmp/v34/out/epic-war-5-expansion-v34.swf > /tmp/v34/verify.log 2>&1 || true
          game=/tmp/v34/verify/scripts/Game
          wm=$game/Interface/WorldMap.as
          bs=$game/System/Battle/BattleSystem.as
          bp=$game/System/Battle/BattleControlPlayer.as
          ps=$game/System/Battle/PlayerSpell.as
          pu=$game/System/Battle/PlayerUnit.as
          hm=$game/Manager/HostManager.as
          dm=$game/Manager/DataManager.as
          be=$game/System/Battle/BattleControlEnemy.as
          cb=$game/System/GameObject/Character/CharacterBase.as

          # Runtime transition: selection is queued during CLICK and scene swap
          # occurs from WorldMap ENTER_FRAME, matching the stock area lifecycle.
          grep -F 'expansionPendingStage:int = 0' "$wm"
          grep -F 'this.expansionPendingStage = 100 + id' "$wm"
          grep -F 'if(this.expansionPendingStage > 0)' "$wm"
          python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path('/tmp/v34/verify/scripts/Game/Interface/WorldMap.as').read_text(encoding='utf-8-sig')
          m=re.search(r'(?ms)private function expansionStageClick.*?(?=private function expansionCloseClick)',t)
          if not m: raise SystemExit('missing expansionStageClick after rebuild')
          body=m.group(0)
          if 'new battle_mc' in body or 'this.destroy();' in body:
              raise SystemExit('V3.4 regression: expansionStageClick still swaps scenes synchronously')
          PY

          # Sandbox master and all gameplay-affecting toggles default OFF.
          grep -F 'sandboxMaster:Boolean = false' "$bs"
          grep -F 'sandboxFreeSpells:Boolean = false' "$bs"
          grep -F 'sandboxUnlimitedBuildings:Boolean = false' "$bs"
          grep -F 'sandboxFastUnits:Boolean = false' "$bs"
          grep -F 'sandboxPopBoost:Boolean = false' "$bs"
          grep -F 'if(!sandboxMaster)' "$bs"
          grep -F 'EXPANSION SANDBOX' "$bs"
          grep -F 'sandboxAddMana' "$bp"
          grep -F 'sandboxMaster && BattleSystem.sandboxFreeSpells' "$ps"
          grep -F 'sandboxUnlimitedBuildings ? 999 : 4' "$ps"
          grep -F 'sandboxMaster && BattleSystem.sandboxPopBoost' "$pu"
          grep -F 'sandboxMaster && BattleSystem.sandboxFastUnits' "$pu"

          # Preserve the V3.3.1 host, expansion, progression and performance stack.
          grep -F 'recordswiper1t.github.io' "$hm"
          grep -F 'this._block_site = false' "$hm"
          grep -F 'if(CLEARS >= 45)' "$dm"
          grep -F 'dat_item_inv.length < 57' "$dm"
          grep -F 'public function initExpansion(ID:int)' "$be"
          grep -F 'var waveCap:int = Math.min(22,16 + int(tier / 4))' "$be"
          grep -F 'Math.abs(myClip.x - child.x) <= 900' "$cb"
          grep -F 'var myDepth:int = this.getZDepth()' "$cb"
          if grep -Fq 'children.sort(this.zSorting)' "$cb"; then
            echo 'V3.4 performance regression: full battlefield sort returned' >&2
            exit 1
          fi
          grep -F 'load >= 175' "$bs"

          # Run the frozen V3.3 RC invariant suite against the rebuilt output.
          python3 tools/epicwar5/expansion/validate_v33_rc.py /tmp/v34/verify
      - name: Stage V3.4 release
        shell: bash
        run: |
          set -euxo pipefail
          cp /tmp/v34/out/epic-war-5-expansion-v34.swf assets/epic-war-5-expansion-v34.swf
          HASH="$(sha256sum assets/epic-war-5-expansion-v34.swf | cut -d' ' -f1)"
          printf '%s  assets/epic-war-5-expansion-v34.swf\n' "$HASH" > assets/EPICWAR5-EXPANSION-V34-SHA256SUMS.txt
          cat > assets/EPICWAR5-EXPANSION-V34-BUILD.txt <<EOF
          Epic War 5 — Expansion V3.4 — Runtime Repair + Optional Sandbox
          Baseline V3.3.1 SHA-256: 40712cc3685861ee93a97ad49cd4ff71c2ebc55c9959a1d9f160fcf39e8d6577
          Toolchain: FFDec 26.2.1
          Release SWF SHA-256: $HASH

          Runtime repair:
          - Expansion stage selection no longer constructs/destroys the battle scene inside MouseEvent.CLICK.
          - The selected Expansion stage is queued and the actual battle transition runs on WorldMap ENTER_FRAME, matching the original EW5 area transition lifecycle.
          - The V3.3.1 GitHub Pages HostManager fix remains intact.

          Optional sandbox:
          - Sandbox master starts OFF and changes no normal Expansion gameplay until explicitly enabled with the backtick key.
          - F1 mana; F2/F3 unit; F4 ally; F5 enemy; F6 batch; F7 speed; F8 wipe; F9 win; F10 heal; F11 free spells; F12 fast production.
          - U toggles building cap, O toggles population boost, [ / ] changes mana amount, H toggles the sandbox HUD.
          - B and P remain reserved for Epic War 5's native battle controls.
          - No max-all/save rewrite helper is added by V3.4.

          Verification:
          - Exact V3.3.1 release decompiled, patched and rebuilt.
          - Re-decompiled V3.4 contains the deferred transition and default-OFF sandbox markers.
          - V3.3 expansion/progression/performance/HostManager invariants revalidated.
          EOF
          sed -i 's/^          //' assets/EPICWAR5-EXPANSION-V34-BUILD.txt
      - name: Upload verified V3.4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: epicwar5-expansion-v34-verified
          retention-days: 7
          path: |
            assets/epic-war-5-expansion-v34.swf
            assets/EPICWAR5-EXPANSION-V34-BUILD.txt
            assets/EPICWAR5-EXPANSION-V34-SHA256SUMS.txt
            /tmp/v34/import.log
            /tmp/v34/verify.log
      - name: Commit verified V3.4 to branch
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/epic-war-5-expansion-v34.swf assets/EPICWAR5-EXPANSION-V34-BUILD.txt assets/EPICWAR5-EXPANSION-V34-SHA256SUMS.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish Epic War 5 Expansion V3.4 runtime sandbox [skip ci]'
          git push origin HEAD:epicwar5-expansion-runtime-sandbox
