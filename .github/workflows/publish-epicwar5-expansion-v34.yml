name: Publish Epic War 5 Expansion V3.4

on:
  push:
    branches: [epicwar5-expansion-runtime-sandbox]
    paths:
      - '.github/workflows/publish-epicwar5-expansion-v34.yml'
      - 'tools/epicwar5/expansion/patch_runtime_sandbox_v34.py'
      - 'tools/epicwar5/expansion/validate_v34_invariants.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-v34:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: epicwar5-expansion-runtime-sandbox
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Freeze V3.3.1 baseline and download FFDec
        shell: bash
        run: |
          set -euxo pipefail
          EXPECTED='40712cc3685861ee93a97ad49cd4ff71c2ebc55c9959a1d9f160fcf39e8d6577'
          test "$(sha256sum assets/epic-war-5-expansion-v331.swf | cut -d' ' -f1)" = "$EXPECTED"
          mkdir -p /tmp/ffdec /tmp/v34/src /tmp/v34/out /tmp/v34/verify
          curl -fL --retry 3 'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          unzip -q /tmp/ffdec.zip -d /tmp/ffdec
      - name: Rebuild exact V3.4 candidate
        shell: bash
        run: |
          set -euxo pipefail
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 -export script /tmp/v34/src assets/epic-war-5-expansion-v331.swf >/tmp/v34/export.log 2>&1 || true
          python3 tools/epicwar5/expansion/patch_runtime_sandbox_v34.py /tmp/v34/src
          if ! java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror abort -importScript assets/epic-war-5-expansion-v331.swf /tmp/v34/out/epic-war-5-expansion-v34.swf /tmp/v34/src >/tmp/v34/import.log 2>&1; then
            cat /tmp/v34/import.log
            exit 1
          fi
          test -s /tmp/v34/out/epic-war-5-expansion-v34.swf
      - name: Re-decompile and verify before publish
        shell: bash
        run: |
          set -euxo pipefail
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 -export script /tmp/v34/verify /tmp/v34/out/epic-war-5-expansion-v34.swf >/tmp/v34/verify.log 2>&1 || true
          game=/tmp/v34/verify/scripts/Game
          wm=$game/Interface/WorldMap.as
          bs=$game/System/Battle/BattleSystem.as
          bp=$game/System/Battle/BattleControlPlayer.as
          ps=$game/System/Battle/PlayerSpell.as
          pu=$game/System/Battle/PlayerUnit.as
          hm=$game/Manager/HostManager.as
          be=$game/System/Battle/BattleControlEnemy.as

          grep -F 'expansionPendingStage:int = 0' "$wm"
          grep -F 'this.expansionPendingStage = 100 + id' "$wm"
          grep -F 'if(this.expansionPendingStage > 0)' "$wm"
          python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path('/tmp/v34/verify/scripts/Game/Interface/WorldMap.as').read_text(encoding='utf-8-sig')
          m=re.search(r'(?ms)private function expansionStageClick.*?(?=private function expansionCloseClick)',t)
          if not m: raise SystemExit('missing expansionStageClick')
          if 'new battle_mc' in m.group(0) or 'this.destroy();' in m.group(0):
              raise SystemExit('synchronous expansion scene swap survived rebuild')
          PY
          grep -F 'sandboxMaster:Boolean = false' "$bs"
          grep -F 'sandboxFreeSpells:Boolean = false' "$bs"
          grep -F 'sandboxUnlimitedBuildings:Boolean = false' "$bs"
          grep -F 'sandboxFastUnits:Boolean = false' "$bs"
          grep -F 'sandboxPopBoost:Boolean = false' "$bs"
          grep -F 'EXPANSION SANDBOX' "$bs"
          grep -F 'sandboxAddMana' "$bp"
          grep -F 'sandboxMaster && BattleSystem.sandboxFreeSpells' "$ps"
          grep -F 'sandboxMaster && BattleSystem.sandboxPopBoost' "$pu"
          grep -F 'sandboxMaster && BattleSystem.sandboxFastUnits' "$pu"
          grep -F 'recordswiper1t.github.io' "$hm"
          grep -F 'public function initExpansion(ID:int)' "$be"
          python3 tools/epicwar5/expansion/validate_v34_invariants.py /tmp/v34/verify
      - name: Stage release files
        shell: bash
        run: |
          set -euxo pipefail
          cp /tmp/v34/out/epic-war-5-expansion-v34.swf assets/epic-war-5-expansion-v34.swf
          HASH="$(sha256sum assets/epic-war-5-expansion-v34.swf | cut -d' ' -f1)"
          printf '%s  assets/epic-war-5-expansion-v34.swf\n' "$HASH" > assets/EPICWAR5-EXPANSION-V34-SHA256SUMS.txt
          cat > assets/EPICWAR5-EXPANSION-V34-BUILD.txt <<EOF
          Epic War 5 — Expansion V3.4 — Runtime Repair + Optional Sandbox
          Baseline V3.3.1 SHA-256: 40712cc3685861ee93a97ad49cd4ff71c2ebc55c9959a1d9f160fcf39e8d6577
          Toolchain: FFDec 26.2.1
          Release SWF SHA-256: $HASH

          Runtime repair:
          - Custom Expansion stage clicks queue the selected battle and transition on WorldMap ENTER_FRAME, matching the original game's display-list lifecycle.
          - No battle scene is constructed or WorldMap destroyed inside MouseEvent.CLICK.
          - V3.3.1 GitHub Pages HostManager authorization remains intact.

          Optional sandbox (OFF by default):
          - Backtick toggles the sandbox master.
          - F1 mana; F2/F3 unit; F4 ally; F5 enemy; F6 batch; F7 speed; F8 wipe; F9 win; F10 heal; F11 free spells; F12 fast units.
          - U building cap; O population boost; [ / ] mana amount; H HUD.
          - Native B and P controls remain untouched.
          - No max-all/save rewrite helper is added by V3.4.

          Verification:
          - Exact V3.3.1 release decompiled, patched, FFDec-rebuilt and re-decompiled.
          - Deferred transition and default-OFF sandbox survived rebuild.
          - Frozen V3.3 gameplay/save/stage/reward/balance/performance invariant suite passed with only its obsolete V3.3 HTML filename freeze excluded.
          EOF
          sed -i 's/^          //' assets/EPICWAR5-EXPANSION-V34-BUILD.txt
      - name: Upload exact verified release
        uses: actions/upload-artifact@v4
        with:
          name: epicwar5-expansion-v34-release
          retention-days: 7
          path: |
            assets/epic-war-5-expansion-v34.swf
            assets/EPICWAR5-EXPANSION-V34-BUILD.txt
            assets/EPICWAR5-EXPANSION-V34-SHA256SUMS.txt
            /tmp/v34/import.log
            /tmp/v34/verify.log
      - name: Commit exact verified release to branch
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/epic-war-5-expansion-v34.swf assets/EPICWAR5-EXPANSION-V34-BUILD.txt assets/EPICWAR5-EXPANSION-V34-SHA256SUMS.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish Epic War 5 Expansion V3.4 runtime sandbox [skip ci]'
          git push origin HEAD:epicwar5-expansion-runtime-sandbox
