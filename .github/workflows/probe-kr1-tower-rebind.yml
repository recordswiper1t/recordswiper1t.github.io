name: Probe KR1 tier-4 towers on Frontiers core

on:
  push:
    branches: [agent/v13-kingdom-rush-ultimate-clean]
    paths:
      - 'tools/ultimate/tower_registry.py'
      - 'tools/ultimate/rebind_namespaced_scripts.py'
      - 'tools/ultimate/merge_swf_xml.py'
      - 'tools/ultimate/port_plan.py'
      - '.github/workflows/probe-kr1-tower-rebind.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/ultimate/tower_registry.py'
      - 'tools/ultimate/rebind_namespaced_scripts.py'
      - 'tools/ultimate/merge_swf_xml.py'
      - 'tools/ultimate/port_plan.py'
      - '.github/workflows/probe-kr1-tower-rebind.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tower-rebind:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch publisher KR1 source and FFDec
        run: |
          set -euo pipefail
          mkdir -p /tmp/u /tmp/ffdec
          curl -fL --retry 4 --retry-all-errors \
            'https://cache.armorgames.com/files/games/kingdom-rush-12141.swf' -o /tmp/u/kr1.swf
          curl -fL --retry 4 \
            'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          unzip -q /tmp/ffdec.zip -d /tmp/ffdec
          if [ -s assets/kingdom-rush-frontiers-v12-1.swf ]; then
            echo 'KRF_BASE=assets/kingdom-rush-frontiers-v12-1.swf' >> "$GITHUB_ENV"
            echo 'HAS_V121=1' >> "$GITHUB_ENV"
          elif [ -s assets/kingdom-rush-frontiers-v12.swf ]; then
            echo 'KRF_BASE=assets/kingdom-rush-frontiers-v12.swf' >> "$GITHUB_ENV"
            echo 'HAS_V121=0' >> "$GITHUB_ENV"
          else
            echo 'KRF_BASE=assets/kingdom-rush-frontiers-v11.swf' >> "$GITHUB_ENV"
            echo 'HAS_V121=0' >> "$GITHUB_ENV"
          fi

      - name: Export sources and derive exact tower/runtime policy
        run: |
          set -euo pipefail
          mkdir -p /tmp/u/kr1-src /tmp/u/krf-src /tmp/u/report
          java -Xmx5g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 \
            -export script /tmp/u/kr1-src /tmp/u/kr1.swf >/tmp/u/export-kr1.log 2>&1 || true
          java -Xmx5g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 \
            -export script /tmp/u/krf-src "$KRF_BASE" >/tmp/u/export-krf.log 2>&1 || true
          python3 tools/ultimate/port_plan.py \
            --kr1 /tmp/u/kr1-src/scripts --krf /tmp/u/krf-src/scripts \
            --output /tmp/u/port-plan.json
          python3 tools/ultimate/extract_class_names.py /tmp/u/kr1-src/scripts \
            --prefix 'KR1__' --output /tmp/u/class-map.json
          python3 tools/ultimate/tower_registry.py --json >/tmp/u/report/tower-registry.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/u/report/tower-registry.json',encoding='utf-8'))
          rows=[x for x in d['routes'] if x['game']=='kr1']
          assert len(rows)==8
          for x in rows:
              print(x['id'], x['source_class'], '->', x['runtime_class'])
          PY

      - name: Build fully namespaced binary coexistence SWF
        run: |
          set -euo pipefail
          java -Xmx6g -jar /tmp/ffdec/ffdec.jar -swf2xml /tmp/u/kr1.swf /tmp/u/kr1.xml
          java -Xmx6g -jar /tmp/ffdec/ffdec.jar -swf2xml "$KRF_BASE" /tmp/u/krf.xml
          python3 tools/ultimate/merge_swf_xml.py \
            --base /tmp/u/krf.xml --source /tmp/u/kr1.xml \
            --class-map /tmp/u/class-map.json \
            --output /tmp/u/merged.xml --report /tmp/u/report/merge-report.json
          java -Xmx8g -jar /tmp/ffdec/ffdec.jar -xml2swf /tmp/u/merged.xml /tmp/u/merged.swf
          head -c 3 /tmp/u/merged.swf | grep -Eq 'FWS|CWS|ZWS'

      - name: Export and rebind namespaced KR1 content to Frontiers shared classes
        run: |
          set -euo pipefail
          mkdir -p /tmp/u/merged-export
          java -Xmx6g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 \
            -export script /tmp/u/merged-export /tmp/u/merged.swf >/tmp/u/export-merged.log 2>&1 || true
          python3 tools/ultimate/rebind_namespaced_scripts.py \
            --scripts /tmp/u/merged-export/scripts \
            --plan /tmp/u/port-plan.json \
            --output /tmp/u/rebind \
            --report /tmp/u/report/rebind-report.json

      - name: Prepare exactly the eight KR1 tier-4 tower replacements
        run: |
          set -euo pipefail
          mkdir -p /tmp/u/import/scripts
          python3 - <<'PY'
          import json, pathlib, re, shutil
          reg=json.load(open('/tmp/u/report/tower-registry.json',encoding='utf-8'))
          root=pathlib.Path('/tmp/u/rebind/scripts')
          out=pathlib.Path('/tmp/u/import/scripts')
          copied=[]
          inheritance={}
          for row in reg['routes']:
              if row['game']!='kr1': continue
              name=row['runtime_class']+'.as'
              hits=list(root.rglob(name))
              if len(hits)!=1:
                  raise SystemExit(f'{name}: expected one rebound source, got {len(hits)}')
              text=hits[0].read_text(encoding='utf-8-sig',errors='replace')
              m=re.search(r'\bclass\s+[^\s{]+(?:\s+extends\s+([^\s{]+))?',text)
              inheritance[row['runtime_class']]=m.group(1) if m and m.group(1) else None
              shutil.copy2(hits[0], out/name)
              copied.append(row['runtime_class'])
          if len(copied)!=8: raise SystemExit(f'expected 8 towers, got {len(copied)}')
          pathlib.Path('/tmp/u/report/tower-compile-classes.json').write_text(json.dumps(copied,indent=2),encoding='utf-8')
          pathlib.Path('/tmp/u/report/tower-inheritance.json').write_text(json.dumps(inheritance,indent=2),encoding='utf-8')
          print(json.dumps(inheritance,indent=2))
          PY

      - name: Compile all eight tower classes into merged SWF
        id: compile
        shell: bash
        run: |
          set +e
          java -Xmx10g -jar /tmp/ffdec/ffdec.jar -onerror abort \
            -importScript /tmp/u/merged.swf /tmp/u/towers-rebound.swf /tmp/u/import \
            >/tmp/u/import-towers.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "$code" >/tmp/u/import.exit
          tail -200 /tmp/u/import-towers.log || true
          exit 0

      - name: Verify tower inheritance after successful compile
        if: steps.compile.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          test -s /tmp/u/towers-rebound.swf
          mkdir -p /tmp/u/verify
          java -Xmx6g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 \
            -export script /tmp/u/verify /tmp/u/towers-rebound.swf >/tmp/u/verify.log 2>&1 || true
          python3 - <<'PY'
          import json, pathlib, os
          classes=json.load(open('/tmp/u/report/tower-compile-classes.json',encoding='utf-8'))
          root=pathlib.Path('/tmp/u/verify/scripts')
          for cls in classes:
              p=root/(cls+'.as')
              if not p.is_file(): raise SystemExit(f'missing re-exported {cls}')
          level=(root/'Level.as').read_text(encoding='utf-8-sig',errors='replace')
          if 'qolTowerClipboard' not in level:
              raise SystemExit('lost Frontiers clipboard marker')
          if os.environ.get('HAS_V121') == '1' and 'qolPopupsEnabled' not in level:
              raise SystemExit('lost Frontiers V12.1 pop-up preference marker')
          out={
              'compile_success': True,
              'frontiers_base': os.environ.get('KRF_BASE'),
              'kr1_tier4_classes_compiled': classes,
              'count': len(classes),
              'frontiers_mod_markers_preserved': True,
              'v12_1_polish_preserved': os.environ.get('HAS_V121') == '1',
              'next_gate': 'runtime-test KR1 ability ranks and V11/V12 clipboard behavior',
          }
          pathlib.Path('/tmp/u/report/tower-rebind-result.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps(out,indent=2))
          PY

      - name: Record tower compile failure
        if: steps.compile.outputs.exit_code != '0'
        run: |
          python3 - <<'PY'
          import json, pathlib
          log=pathlib.Path('/tmp/u/import-towers.log').read_text(encoding='utf-8',errors='replace')
          inheritance=json.loads(pathlib.Path('/tmp/u/report/tower-inheritance.json').read_text())
          out={
              'compile_success': False,
              'exit_code': int(pathlib.Path('/tmp/u/import.exit').read_text().strip()),
              'inheritance_after_rebind': inheritance,
              'meaning': 'FFDec reached the real compile gate; use the compiler errors plus inheritance map to implement only the adapters actually required.',
              'log_tail': '\n'.join(log.splitlines()[-200:]),
          }
          pathlib.Path('/tmp/u/report/tower-rebind-result.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          PY

      - name: Upload structural reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kr1-tier4-frontiers-core-probe
          path: |
            /tmp/u/report/tower-registry.json
            /tmp/u/report/tower-compile-classes.json
            /tmp/u/report/tower-inheritance.json
            /tmp/u/report/rebind-report.json
            /tmp/u/report/tower-rebind-result.json
            /tmp/u/import-towers.log
          retention-days: 30

      - name: Require all eight KR1 tier-4 classes to compile
        run: test '${{ steps.compile.outputs.exit_code }}' = '0'
