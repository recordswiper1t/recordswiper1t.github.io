name: Probe Ultimate KR1 tower menu on V12.1

on:
  push:
    branches: [agent/v13-kingdom-rush-ultimate-clean]
    paths:
      - 'tools/ultimate/build_ultimate_tower_menu.py'
      - '.github/workflows/probe-ultimate-tower-menu.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/ultimate/build_ultimate_tower_menu.py'
      - '.github/workflows/probe-ultimate-tower-menu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tower-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Select enhanced Frontiers base and download FFDec
        run: |
          set -euo pipefail
          python3 -m py_compile tools/ultimate/build_ultimate_tower_menu.py
          mkdir -p /tmp/u /tmp/ffdec
          if [ -s assets/kingdom-rush-frontiers-v12-1.swf ]; then
            echo 'KRF_BASE=assets/kingdom-rush-frontiers-v12-1.swf' >> "$GITHUB_ENV"
            echo 'HAS_V121=1' >> "$GITHUB_ENV"
          elif [ -s assets/kingdom-rush-frontiers-v12.swf ]; then
            echo 'KRF_BASE=assets/kingdom-rush-frontiers-v12.swf' >> "$GITHUB_ENV"
            echo 'HAS_V121=0' >> "$GITHUB_ENV"
          else
            echo 'KRF_BASE=assets/kingdom-rush-frontiers-v11.swf' >> "$GITHUB_ENV"
            echo 'HAS_V121=0' >> "$GITHUB_ENV"
          fi
          curl -fL --retry 4 \
            'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          unzip -q /tmp/ffdec.zip -d /tmp/ffdec

      - name: Export enhanced runtime and apply Ultimate tower UI patch
        run: |
          set -euo pipefail
          mkdir -p /tmp/u/export /tmp/u/import/scripts /tmp/u/report
          java -Xmx5g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 \
            -export script /tmp/u/export "$KRF_BASE" >/tmp/u/export.log 2>&1 || true
          test -f /tmp/u/export/scripts/Level.as
          test -f /tmp/u/export/scripts/TowerHolder.as
          python3 tools/ultimate/build_ultimate_tower_menu.py /tmp/u/export/scripts \
            --report /tmp/u/report/tower-menu-patch.json
          cp /tmp/u/export/scripts/Level.as /tmp/u/import/scripts/Level.as
          cp /tmp/u/export/scripts/TowerHolder.as /tmp/u/import/scripts/TowerHolder.as

      - name: Import patched current-release classes
        run: |
          set -euo pipefail
          java -Xmx7g -jar /tmp/ffdec/ffdec.jar -onerror abort \
            -importScript "$KRF_BASE" /tmp/u/tower-menu.swf /tmp/u/import \
            >/tmp/u/import.log 2>&1
          test -s /tmp/u/tower-menu.swf
          head -c 3 /tmp/u/tower-menu.swf | grep -Eq 'FWS|CWS|ZWS'

      - name: Re-export and verify all Ultimate routes plus existing enhancements
        run: |
          set -euo pipefail
          mkdir -p /tmp/u/verify
          java -Xmx5g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 \
            -export script /tmp/u/verify /tmp/u/tower-menu.swf >/tmp/u/verify.log 2>&1 || true
          level=/tmp/u/verify/scripts/Level.as
          holder=/tmp/u/verify/scripts/TowerHolder.as
          test -f "$level" && test -f "$holder"
          grep -F 'qolTowerClipboard' "$level"
          grep -F 'KR1__TowerArcherRanger' "$level"
          grep -F 'Kingdom Rush towers' "$holder"
          grep -F 'ultimatePlaceKR1Tower' "$holder"
          for action in \
            ultimate_kr1_rangers_hideout \
            ultimate_kr1_musketeer_garrison \
            ultimate_kr1_holy_order \
            ultimate_kr1_barbarian_mead_hall \
            ultimate_kr1_arcane_wizard \
            ultimate_kr1_sorcerer_mage \
            ultimate_kr1_tesla_x104 \
            ultimate_kr1_big_bertha; do
            grep -F "$action" "$holder"
            grep -F "$action" "$level"
          done
          if [ "$KRF_BASE" != 'assets/kingdom-rush-frontiers-v11.swf' ]; then
            grep -F 'THE LAST RIFT' /tmp/u/verify/scripts/Level15.as
          fi
          if [ "$HAS_V121" = 1 ]; then
            grep -F 'qolPopupsEnabled' "$level"
          fi
          sha256sum /tmp/u/tower-menu.swf >/tmp/u/report/tower-menu-SHA256.txt

      - name: Upload structural verification only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultimate-kr1-tower-menu-probe
          path: |
            /tmp/u/report/tower-menu-patch.json
            /tmp/u/report/tower-menu-SHA256.txt
            /tmp/u/import.log
            /tmp/u/verify.log
          retention-days: 30
