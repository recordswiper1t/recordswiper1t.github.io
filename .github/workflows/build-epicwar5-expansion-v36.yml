name: Build and verify Epic War 5 Expansion V3.6

on:
  push:
    branches: [codex/epicwar5-expansion-v36]
    paths:
      - '.github/workflows/build-epicwar5-expansion-v36.yml'
      - 'tools/epicwar5/expansion/patch_expansion_map_cleanup_v36.py'
      - 'assets/epic-war-5-expansion-v35.swf'
      - 'epicwar5-expansion/index.html'
      - 'iphone/epicwar5.html'
      - 'desktop/**'
      - 'index.html'
      - 'README.md'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-epicwar5-expansion-v36.yml'
      - 'tools/epicwar5/expansion/patch_expansion_map_cleanup_v36.py'
      - 'assets/epic-war-5-expansion-v36.swf'
      - 'assets/EPICWAR5-EXPANSION-V36-BUILD.txt'
      - 'assets/EPICWAR5-EXPANSION-V36-SHA256SUMS.txt'
      - 'epicwar5-expansion/index.html'
      - 'iphone/epicwar5.html'
      - 'desktop/**'
      - 'index.html'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Freeze V3.5 and download FFDec
        shell: bash
        run: |
          set -euxo pipefail
          test "$(sha256sum assets/epic-war-5-expansion-v35.swf | cut -d' ' -f1)" = 'ecf871992b20105c3c0ef4404035d2f1036088190237ad636b5cd866b04d8e22'
          mkdir -p /tmp/ffdec /tmp/v36/src /tmp/v36/out /tmp/v36/verify
          curl -fL --retry 4 'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          unzip -q /tmp/ffdec.zip -d /tmp/ffdec
      - name: Patch exact V3.5 and rebuild V3.6
        shell: bash
        run: |
          set -euxo pipefail
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 -export script /tmp/v36/src assets/epic-war-5-expansion-v35.swf >/tmp/v36/export.log 2>&1 || true
          test -f /tmp/v36/src/scripts/Game/Interface/WorldMap.as
          python3 tools/epicwar5/expansion/patch_expansion_map_cleanup_v36.py /tmp/v36/src
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror abort -importScript assets/epic-war-5-expansion-v35.swf /tmp/v36/out/epic-war-5-expansion-v36.swf /tmp/v36/src >/tmp/v36/import.log 2>&1
          test -s /tmp/v36/out/epic-war-5-expansion-v36.swf
          head -c 3 /tmp/v36/out/epic-war-5-expansion-v36.swf | grep -Eq 'FWS|CWS|ZWS'
      - name: Re-decompile and verify map cleanup plus frozen gameplay
        shell: bash
        run: |
          set -euxo pipefail
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 -export script /tmp/v36/verify /tmp/v36/out/epic-war-5-expansion-v36.swf >/tmp/v36/verify.log 2>&1 || true
          game=/tmp/v36/verify/scripts/Game
          wm=$game/Interface/WorldMap.as
          grep -F 'parameters.ew5ExpansionDirect' "$wm"
          grep -F 'var expansionGame:* = this.mGF' "$wm"
          grep -F 'clip.init(expansionGame,expansionStageId)' "$wm"
          grep -F 'sandboxMaster:Boolean = false' "$game/System/Battle/BattleSystem.as"
          python3 tools/epicwar5/expansion/validate_v34_invariants.py /tmp/v36/verify
          python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path('/tmp/v36/verify/scripts/Game/Interface/WorldMap.as').read_text(encoding='utf-8-sig')
          block=re.search(r'(?ms)if\(this\.expansionPendingStage > 0\).*?return;',t)
          assert block
          b=block.group(0)
          assert b.index('this.destroy();') < b.index('clip = new battle_mc();') < b.index('clip.init(expansionGame,expansionStageId)')
          helper=re.search(r'(?ms)private function expansionDirectAvailable.*?(?=private function expansionInstallButton)',t)
          assert helper and 'stageSetValue' not in helper.group(0) and 'saveData' not in helper.group(0)
          assert t.count('this.expansionDirectAvailable()') == 3
          PY
      - name: Verify archived V3.6 integrity
        shell: bash
        run: |
          set -euxo pipefail
          sha256sum -c assets/EPICWAR5-EXPANSION-V36-SHA256SUMS.txt
          test "$(sha256sum assets/epic-war-5-expansion-v36.swf | cut -d' ' -f1)" = 'cfc5424232b81693b42187242c2e93bb867b36636ba266ffc01595c687a74563'
          grep -F 'Expansion V3.6' assets/EPICWAR5-EXPANSION-V36-BUILD.txt
          python3 -m py_compile tools/epicwar5/expansion/patch_expansion_map_cleanup_v36.py
      - name: Stage build record and checksum
        shell: bash
        run: |
          set -euxo pipefail
          hash=$(sha256sum /tmp/v36/out/epic-war-5-expansion-v36.swf | cut -d' ' -f1)
          printf '%s  assets/epic-war-5-expansion-v36.swf\n' "$hash" > /tmp/v36/out/EPICWAR5-EXPANSION-V36-SHA256SUMS.txt
          cat > /tmp/v36/out/EPICWAR5-EXPANSION-V36-BUILD.txt <<EOF
          Epic War 5 — Expansion V3.6 — Battle Layer Cleanup
          Baseline V3.5 SHA-256: ecf871992b20105c3c0ef4404035d2f1036088190237ad636b5cd866b04d8e22
          Release SWF SHA-256: $hash
          Toolchain: FFDec 26.2.1

          - Expansion stage selection remains deferred to the world-map frame lifecycle.
          - The world map is destroyed before the queued battle is initialized, preventing the map layer from covering active combat in Ruffle.
          - Dedicated browser and iPhone launchers still expose only stage 26 without modifying campaign progress.
          - Expansion stages 27-50 remain sequentially gated by genuine victories.
          - V3.5 direct entry, V3.4 sandbox, progression and large-battle performance remain intact.
          - Rebuilt from exact V3.5, freshly re-decompiled, invariant-checked and release-surface verified.
          EOF
          sed -i 's/^          //' /tmp/v36/out/EPICWAR5-EXPANSION-V36-BUILD.txt
      - name: Match committed release on pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euxo pipefail
          sha256sum -c assets/EPICWAR5-EXPANSION-V36-SHA256SUMS.txt
          cmp /tmp/v36/out/epic-war-5-expansion-v36.swf assets/epic-war-5-expansion-v36.swf
          cmp /tmp/v36/out/EPICWAR5-EXPANSION-V36-SHA256SUMS.txt assets/EPICWAR5-EXPANSION-V36-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: epicwar5-expansion-v36-verified
          retention-days: 7
          path: /tmp/v36/out
      - name: Publish verified V3.6 to the branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euxo pipefail
          cp /tmp/v36/out/epic-war-5-expansion-v36.swf assets/
          cp /tmp/v36/out/EPICWAR5-EXPANSION-V36-SHA256SUMS.txt assets/
          cp /tmp/v36/out/EPICWAR5-EXPANSION-V36-BUILD.txt assets/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/epic-war-5-expansion-v36.swf assets/EPICWAR5-EXPANSION-V36-SHA256SUMS.txt assets/EPICWAR5-EXPANSION-V36-BUILD.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Epic War 5 Expansion V3.6 battle cleanup'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

