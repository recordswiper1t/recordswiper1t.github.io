name: PR Cleanup Frontiers v4

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'agent/v4-frontiers-fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Remove temporary reverse-engineering and build scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git rm -rf --ignore-unmatch \
            analysis/v4-selected.txt \
            analysis/v4-inventory.txt \
            analysis/v4-snippets.txt \
            analysis/v4-candidates.txt \
            analysis/v4-extra-summary.txt \
            analysis/v4-core \
            analysis/v4-extra \
            tools/build-v4.py \
            tools/patch-v4-index.py \
            tools/patch-v4-index-regex.py \
            .github/workflows/pr-analyze-v4.yml \
            .github/workflows/pr-analyze-v4-candidates.yml \
            .github/workflows/pr-analyze-v4-extra.yml \
            .github/workflows/pr-build-v4.yml \
            .github/workflows/pr-patch-v4-index.yml \
            .github/workflows/pr-cleanup-v4.yml

      - name: Commit clean V4 product diff
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Clean temporary Frontiers v4 build scaffolding [skip ci]' || exit 0
          git pull --rebase origin "${TARGET_BRANCH}"
          git push origin HEAD:"${TARGET_BRANCH}"
