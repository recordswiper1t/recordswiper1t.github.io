name: Audit Epic War 5 Expansion Battle Entry

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-epicwar5-expansion-entry.yml'
      - 'tools/epicwar5/expansion/**'

permissions:
  contents: read

jobs:
  audit-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Decompile original and current expansion
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/ffdec /tmp/ew5/original /tmp/ew5/exp
          curl -fL --retry 3 'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          unzip -q /tmp/ffdec.zip -d /tmp/ffdec
          curl -fL --retry 3 'https://cache.armorgames.com/files/games/epic-war-5-12518.swf' -o /tmp/ew5/original.swf
          test "$(sha256sum /tmp/ew5/original.swf | cut -d' ' -f1)" = '848d173b5cba7ebc321ba6dc374389e038924e32cb4a42b0d1b31f51c0b71bb8'
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 -export script /tmp/ew5/original /tmp/ew5/original.swf >/dev/null 2>&1 || true
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 -export script /tmp/ew5/exp assets/epic-war-5-expansion-v331.swf >/dev/null 2>&1 || true
      - name: Compare native and expansion entry lifecycle
        shell: bash
        run: |
          set -euo pipefail
          echo '=== ORIGINAL battle_mc.as ==='
          cat /tmp/ew5/original/scripts/battle_mc.as
          echo '=== EXPANSION battle_mc.as ==='
          cat /tmp/ew5/exp/scripts/battle_mc.as
          for f in WorldMapArea1.as WorldMapArea2.as WorldMapArea3.as WorldMapArea4.as; do
            echo "=== ORIGINAL $f around new battle_mc ==="
            grep -n -B18 -A24 'new battle_mc' "/tmp/ew5/original/scripts/Game/Interface/$f" || true
          done
          echo '=== EXPANSION custom stage entry ==='
          grep -n -B18 -A26 'new battle_mc' /tmp/ew5/exp/scripts/Game/Interface/WorldMap.as || true
      - name: Compare Battle wrapper lifecycle
        shell: bash
        run: |
          set -euo pipefail
          echo '=== ORIGINAL Battle.as ==='
          cat /tmp/ew5/original/scripts/Game/Interface/Battle.as
          echo '=== EXPANSION Battle.as ==='
          cat /tmp/ew5/exp/scripts/Game/Interface/Battle.as
      - name: Upload entry audit
        uses: actions/upload-artifact@v4
        with:
          name: epicwar5-expansion-entry-audit
          retention-days: 7
          path: |
            /tmp/ew5/original/scripts/battle_mc.as
            /tmp/ew5/exp/scripts/battle_mc.as
            /tmp/ew5/original/scripts/Game/Interface/WorldMapArea1.as
            /tmp/ew5/original/scripts/Game/Interface/WorldMapArea2.as
            /tmp/ew5/original/scripts/Game/Interface/WorldMapArea3.as
            /tmp/ew5/original/scripts/Game/Interface/WorldMapArea4.as
            /tmp/ew5/exp/scripts/Game/Interface/WorldMap.as
            /tmp/ew5/original/scripts/Game/Interface/Battle.as
            /tmp/ew5/exp/scripts/Game/Interface/Battle.as
