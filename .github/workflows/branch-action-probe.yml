name: Branch Action Probe

on:
  push:
    branches:
      - agent/iphone-performance-selector-completeness

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/iphone-performance-selector-completeness
          fetch-depth: 0
      - name: Record probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p analysis
          echo "Actions probe $(date -u +'%Y-%m-%dT%H:%M:%SZ')" > analysis/action-probe.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/action-probe.txt
          git commit -m 'Record Actions probe [skip ci]' || exit 0
          git push origin HEAD:agent/iphone-performance-selector-completeness
