name: Temporary KRF settings source audit

on:
  push:
    branches: [agent/krf-final-audit]
    paths:
      - '.github/workflows/audit-krf-settings-source.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download FFDec 26.2.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          mkdir -p /tmp/ffdec && unzip -q /tmp/ffdec.zip -d /tmp/ffdec
      - name: Export rebuilt V12.1 ActionScript
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/krf-src /tmp/report
          mkdir -p /tmp/krf-src /tmp/report
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 -export script /tmp/krf-src assets/kingdom-rush-frontiers-v12-1.swf >/tmp/export.log 2>&1 || true
          test -f /tmp/krf-src/scripts/Level.as
      - name: Trace tooltips persistence and settings handlers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/krf-src/scripts')
          out=[]
          needles=['tooltipsStatus','SharedObject','flush()','qolPopupsEnabled']
          for p in sorted(root.rglob('*.as')):
              try: s=p.read_text(encoding='utf-8-sig')
              except Exception: continue
              if any(n in s for n in needles):
                  lines=s.splitlines()
                  hits=[i for i,line in enumerate(lines) if any(n in line for n in needles)]
                  if hits:
                      out.append(f'===== {p.relative_to(root)} =====')
                      seen=set()
                      for i in hits:
                          a=max(0,i-12); b=min(len(lines),i+13)
                          key=(a,b)
                          if key in seen: continue
                          seen.add(key)
                          out.extend(f'{j+1:5d}: {lines[j]}' for j in range(a,b))
                          out.append('')
          Path('/tmp/report/settings-context.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
          grep -RniF 'tooltipsStatus' /tmp/krf-src/scripts > /tmp/report/tooltips-index.txt || true
          grep -RniE 'SharedObject|\.flush\(' /tmp/krf-src/scripts > /tmp/report/sharedobject-index.txt || true
          wc -l /tmp/report/*.txt
      - uses: actions/upload-artifact@v4
        with:
          name: krf-settings-source-audit
          path: /tmp/report
