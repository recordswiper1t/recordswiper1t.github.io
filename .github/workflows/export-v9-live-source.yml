name: Export V8 live sources
on:
  pull_request:
    branches: [agent/v9-menu-completeness]
    paths: ['.github/workflows/export-v9-live-source.yml']
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Download FFDec
        run: |
          curl -fL 'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          mkdir -p /tmp/ffdec && unzip -q /tmp/ffdec.zip -d /tmp/ffdec
      - name: Export live V8 classes
        run: |
          rm -rf /tmp/out /tmp/live && mkdir -p /tmp/out /tmp/live
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 60 -selectclass 'Level,TowerHolder' -export script /tmp/out assets/kingdom-rush-frontiers-v8.swf || true
          cp /tmp/out/scripts/Level.as /tmp/live/Level.as
          cp /tmp/out/scripts/TowerHolder.as /tmp/live/TowerHolder.as
      - uses: actions/upload-artifact@v4
        with:
          name: v8-live-source
          path: /tmp/live
