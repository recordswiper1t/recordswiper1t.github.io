name: Export V8 live sources
on:
  push:
    branches: [agent/v9-export-live-source]
    paths: ['.github/workflows/export-v9-live-source.yml']
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Download FFDec
        run: |
          curl -fL 'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          mkdir -p /tmp/ffdec && unzip -q /tmp/ffdec.zip -d /tmp/ffdec
      - name: Export live V8 classes
        run: |
          rm -rf /tmp/out analysis/v9-live && mkdir -p /tmp/out analysis/v9-live
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 60 -selectclass 'Level,TowerHolder' -export script /tmp/out assets/kingdom-rush-frontiers-v8.swf || true
          cp /tmp/out/scripts/Level.as analysis/v9-live/Level.as
          cp /tmp/out/scripts/TowerHolder.as analysis/v9-live/TowerHolder.as
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- analysis/v9-live/Level.as analysis/v9-live/TowerHolder.as
          git commit -m 'Export live V8 sources for V9 [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
