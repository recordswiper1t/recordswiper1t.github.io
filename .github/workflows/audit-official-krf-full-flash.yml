name: Audit official Armor Games Frontiers full Flash source

on:
  push:
    branches: [agent/ultimate-source-recovery]
    paths:
      - '.github/workflows/audit-official-krf-full-flash.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch official Armor Games Frontiers SWF and FFDec
        run: |
          set -euo pipefail
          mkdir -p /tmp/krf-full /tmp/ffdec /tmp/report
          curl -fL --retry 5 --retry-all-errors \
            'https://cache.armorgames.com/files/games/kingdom-rush-frontiers-15717.swf' \
            -o /tmp/krf-full/frontiers.swf
          test -s /tmp/krf-full/frontiers.swf
          head -c 3 /tmp/krf-full/frontiers.swf | grep -Eq 'FWS|CWS|ZWS'
          stat -c '%s' /tmp/krf-full/frontiers.swf | tee /tmp/report/bytes.txt
          sha256sum /tmp/krf-full/frontiers.swf | tee /tmp/report/SHA256SUMS.txt
          curl -fL --retry 4 \
            'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' \
            -o /tmp/ffdec.zip
          unzip -q /tmp/ffdec.zip -d /tmp/ffdec

      - name: Export ActionScript and inventory level classes
        run: |
          set -euo pipefail
          mkdir -p /tmp/krf-full/export
          java -Xmx7g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 120 -exportFileTimeout 240 \
            -export script /tmp/krf-full/export /tmp/krf-full/frontiers.swf \
            >/tmp/krf-full/export.log 2>&1 || true
          test -d /tmp/krf-full/export/scripts
          python3 - <<'PY'
          from pathlib import Path
          import json,re,hashlib
          root=Path('/tmp/krf-full/export/scripts')
          levels=[]
          for p in root.rglob('Level*.as'):
              m=re.fullmatch(r'Level(\d+)\.as',p.name)
              if m:
                  levels.append(int(m.group(1)))
          levels=sorted(set(levels))
          expected={
              16:'Port Tortuga',17:'Storm Atoll',18:'The Sunken Citadel',
              19:'Bonesburg',20:'Desecrated Grove',21:'Dusk Chateau',22:'Darklight Depths',
          }
          rows=[]
          for n,title in expected.items():
              hits=list(root.rglob(f'Level{n}.as'))
              rows.append({'level':n,'title':title,'present':len(hits)==1,'source_path':str(hits[0].relative_to(root)) if len(hits)==1 else None})
          # Record class-name evidence only; do not upload decompiled source.
          classes=sorted(p.stem for p in root.rglob('*.as'))
          hero_classes=[x for x in classes if 'Hero' in x]
          report={
              'source_url':'https://cache.armorgames.com/files/games/kingdom-rush-frontiers-15717.swf',
              'swf_bytes':Path('/tmp/krf-full/frontiers.swf').stat().st_size,
              'swf_sha256':hashlib.sha256(Path('/tmp/krf-full/frontiers.swf').read_bytes()).hexdigest(),
              'level_numbers':levels,
              'highest_level_number':max(levels) if levels else None,
              'post_campaign_level16_22':rows,
              'all_level16_22_present':all(x['present'] for x in rows),
              'actionscript_class_count':len(classes),
              'hero_class_names':hero_classes,
              'policy':'structural class-name/hash report only; SWF and decompiled source are not uploaded',
          }
          Path('/tmp/report/official-krf-flash-audit.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          print(json.dumps(report,indent=2))
          PY

      - name: Require all seven post-campaign classes if present in official Flash
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/report/official-krf-flash-audit.json',encoding='utf-8'))
          print('Level classes:',d['level_numbers'])
          print('Level16-22 all present:',d['all_level16_22_present'])
          # This is an audit, not a hard failure: absence remains useful evidence.
          PY

      - name: Upload structural report only
        uses: actions/upload-artifact@v4
        with:
          name: official-krf-full-flash-audit
          path: |
            /tmp/report/official-krf-flash-audit.json
            /tmp/report/SHA256SUMS.txt
            /tmp/report/bytes.txt
          retention-days: 30
