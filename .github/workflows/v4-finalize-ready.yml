name: Finalize Frontiers V4 on ready

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/v4-frontiers-fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download FFDec
        run: |
          set -euo pipefail
          curl -fL --retry 4 'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          mkdir -p /tmp/ffdec
          unzip -q /tmp/ffdec.zip -d /tmp/ffdec
          test -f /tmp/ffdec/ffdec.jar
      - name: Export current verified V4
        run: |
          set -euo pipefail
          rm -rf /tmp/src /tmp/import /tmp/out /tmp/verify
          mkdir -p /tmp/src /tmp/import/scripts /tmp/out
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 -export script /tmp/src assets/kingdom-rush-frontiers-v4.swf >/tmp/export.log 2>&1 || true
          test -f '/tmp/src/scripts/Level.as'
          test -f '/tmp/src/scripts/§_-2i§.as'
          test -f '/tmp/src/scripts/§_-BQ§.as'
          test -f '/tmp/src/scripts/TowerHolder.as'
      - name: Apply final V4 patch
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/finalize.py <<'PY'
          from pathlib import Path
          import shutil

          src=Path('/tmp/src/scripts'); imp=Path('/tmp/import/scripts')
          def die(m): raise SystemExit(m)
          def get(n):
              p=imp/n
              return p.read_text(encoding='utf-8') if p.exists() else (src/n).read_text(encoding='utf-8')
          def save(n,t):
              p=imp/n; p.parent.mkdir(parents=True,exist_ok=True); p.write_text(t,encoding='utf-8')
          def once(t,a,b,label):
              c=t.count(a)
              if c!=1: die(f'{label}: expected one anchor, got {c}')
              return t.replace(a,b,1)
          def fn(t,sig,repl):
              a=t.find(sig)
              if a<0: die('missing '+sig)
              b=t.find('{',a); d=0; e=None
              for i in range(b,len(t)):
                  if t[i]=='{': d+=1
                  elif t[i]=='}':
                      d-=1
                      if d==0: e=i+1; break
              if e is None: die('unterminated '+sig)
              return t[:a]+repl.rstrip()+t[e:]

          # Hero data: max/reset applies to character level and skill spending.
          t=get('§_-2i§.as')
          t=fn(t,'public function qolSetSkillsMaxed(param1:Boolean) : void',r'''public function qolSetSkillsMaxed(param1:Boolean) : void
      {
         var heroes:Array = [this.heroAlric,this.heroMirage,this.heroCronan,this.heroCaptain,this.heroNivus,this.heroDierdre,this.heroGrawl,this.heroShatra,this.heroAshbite];
         var h:Object = null;
         var skill:Object = null;
         for each(h in heroes)
         {
            h.level = 10;
            if(this.master_xp != null && this.master_xp.length > 0)
            {
               h.xp = this.master_xp[this.master_xp.length - 1];
            }
            for each(skill in h.skillArray)
            {
               skill.level = param1 ? 3 : 0;
            }
         }
         this.updateSkillPoints();
      }''')
          save('§_-2i§.as',t)

          # Game root: max by default; reset/custom persists and won't be overwritten next load.
          t=get('§_-BQ§.as')
          t=once(t,'         this.qolSetTreesMaxed(true);\n',r'''         if(this.qolGetProgressMode() == "custom")
         {
            this.qolTreesMaxed = false;
            this.stars = this.qolRemainingUpgradeStars();
         }
         else
         {
            this.qolSetTreesMaxed(true);
         }
''','progress constructor')
          marker='      public function qolSetTreesMaxed(param1:Boolean) : void\n'
          helper=r'''      public function qolGetProgressMode() : String
      {
         var so:SharedObject = null;
         if(this.§_-yX§) return "max";
         try
         {
            so = SharedObject.getLocal(this.§use const get§);
            if(so.data.qolProgressMode == "custom")
            {
               so.close();
               return "custom";
            }
            so.close();
         }
         catch(err:Error) {}
         return "max";
      }
      
      private function qolSaveProgressMode(param1:String) : void
      {
         var so:SharedObject = null;
         if(!this.§_-yX§)
         {
            try
            {
               so = SharedObject.getLocal(this.§use const get§);
               so.data.qolProgressMode = param1;
               so.data.starsWon = this.starsWon;
               so.data.stars = this.stars;
               so.flush();
               so.close();
            }
            catch(err:Error) {}
         }
         this.gameUpgrades.§case super§();
         this.gameHeroData.§case super§();
      }
      
'''
          t=once(t,marker,helper+marker,'progress persistence')
          t=fn(t,'public function qolSetTreesMaxed(param1:Boolean) : void',r'''public function qolSetTreesMaxed(param1:Boolean) : void
      {
         this.qolTreesMaxed = param1;
         this.gameUpgrades.qolSetMaxed(param1);
         this.gameHeroData.qolSetSkillsMaxed(param1);
         this.starsWon = 65;
         this.stars = param1 ? 0 : this.qolRemainingUpgradeStars();
         this.qolSaveProgressMode(param1 ? "max" : "custom");
      }''')
          save('§_-BQ§.as',t)

          # Level controls: all 9 heroes ON by default, clearer reset/max action, reusable update snapshots.
          t=get('Level.as')
          t=once(t,'      private var qolSendAllCooldown:int = 0;\n','      private var qolSendAllCooldown:int = 0;\n      \n      private var qolPerfFrame:int = 0;\n      \n      private var qolEntityScratch:Array = [];\n      \n      private var qolEnemyDecalScratch:Array = [];\n      \n      private var qolBulletScratch:Array = [];\n','perf fields')
          t=once(t,'            Level.qolHeroEnabled[heroName] = false;\n','            Level.qolHeroEnabled[heroName] = true;\n','hero defaults')
          t=t.replace('         Level.qolHeroEnabled[this.game.gameHeroData.selectedHero.name] = true;\n','',1)
          t=t.replace('this.game.qolTreesMaxed ? "Trees: MAXED (reset)" : "Trees: RESET (max)"','this.game.qolTreesMaxed ? "RESET FOR CUSTOM" : "MAX ALL"',1)
          t=t.replace('This Flash build contains 9 regular hero implementations.','All 9 start ON. Tap any hero to toggle it for this level.',1)
          snap=r'''      private function qolUpdateContainer(param1:DisplayObjectContainer, param2:Array) : void
      {
         var i:int = 0;
         var item:DisplayObject = null;
         param2.length = 0;
         while(i < param1.numChildren)
         {
            param2.push(param1.getChildAt(i));
            i++;
         }
         i = 0;
         while(i < param2.length)
         {
            item = param2[i] as DisplayObject;
            if(item != null && item.parent == param1)
            {
               MovieClip(item).onFrameUpdate();
               ++this.§override get§;
            }
            i++;
         }
      }
      
'''
          t=once(t,'      public function updateEntities() : void\n',snap+'      public function updateEntities() : void\n','snapshot helper')
          t=fn(t,'public function updateEntities() : void',r'''public function updateEntities() : void
      {
         this.qolUpdateContainer(this.entities,this.qolEntityScratch);
      }''')
          t=fn(t,'public function updateEnemyDecals() : void',r'''public function updateEnemyDecals() : void
      {
         this.qolUpdateContainer(this.enemyDecals,this.qolEnemyDecalScratch);
      }''')
          t=fn(t,'public function updateBullets() : void',r'''public function updateBullets() : void
      {
         this.qolUpdateContainer(this.bullets,this.qolBulletScratch);
      }''')
          t=fn(t,'private function qolGameTick() : void',r'''private function qolGameTick() : void
      {
         this.qolPerfFrame++;
         if(this.§_-BF§ == LEVEL_NORMAL) this.§_-HR§();
         if(this.§_-BF§ == LEVEL_NORMAL || this.§_-BF§ == LEVEL_PRE_WIN)
         {
            var heavy:Boolean = this.entities.numChildren > 280 || this.bullets.numChildren > 320;
            this.updateEntities();
            this.updateBullets();
            if(!heavy || (this.qolPerfFrame & 1) == 0)
            {
               this.updateEnemyDecals();
               this.updateBulletsDecals();
               this.updateDecals();
               this.updateBackground();
            }
            this.§_-ai§();
            this.menu.updateMenu();
            this.§include return§.update();
            this.updatePointers();
         }
      }''')
          save('Level.as',t)

          # Tower menu: add the missing map-special Dwarf Hall and retain every V4 direct-build choice.
          t=get('TowerHolder.as')
          old1='''new Array("qol_crossbow","tw_archer",this.cRoot.gameSettings.archers.crossbow.cost,false,0,0,0,3,"TooltipBasic",{\n               "title":"Crossbow Fort",\n               "text":"Build the Crossbow specialization directly."\n            }),new Array("qol_totem","tw_archer",this.cRoot.gameSettings.archers.totem.cost,false,0,0,0,4,"TooltipBasic",{\n               "title":"Tribal Axethrowers",\n               "text":"Build the Totem specialization directly."\n            }),new Array("qol_specials2"'''
          new1='''new Array("qol_hall","tw_soldier",225,false,0,0,0,3,"TooltipBasic",{\n               "title":"Dwarf Hall — 225",\n               "text":"Place the map-special Dwarf Hall barracks."\n            }),new Array("qol_specials2"'''
          t=once(t,old1,new1,'Dwarf Hall menu')
          old2='''new Array("qol_archmage","tw_mage",this.cRoot.gameSettings.mages.archmage.cost,false,0,0,0,1,"TooltipBasic",{\n               "title":"Archmage",\n               "text":"Build the Archmage specialization directly."\n            }),new Array("qol_necro","tw_mage",this.cRoot.gameSettings.mages.necromancer.cost,false,0,0,0,2,"TooltipBasic",{\n               "title":"Necromancer",\n               "text":"Build the Necromancer specialization directly."\n            }),new Array("qol_dwaarp","tw_engineer",this.cRoot.gameSettings.engineers.dwaarp.cost,false,0,0,0,3,"TooltipBasic",{\n               "title":"DWAARP",\n               "text":"Build the DWAARP specialization directly."\n            }),new Array("qol_mech","tw_engineer",this.cRoot.gameSettings.engineers.mech.cost,false,0,0,0,4,"TooltipBasic",{\n               "title":"Battle-Mecha T200",\n               "text":"Build the Battle-Mecha specialization directly."\n            }),new Array("qol_specials"'''
          new2='''new Array("qol_crossbow","tw_archer",this.cRoot.gameSettings.archers.crossbow.cost,false,0,0,0,1,"TooltipBasic",{\n               "title":"Crossbow Fort",\n               "text":"Build the Crossbow specialization directly."\n            }),new Array("qol_totem","tw_archer",this.cRoot.gameSettings.archers.totem.cost,false,0,0,0,2,"TooltipBasic",{\n               "title":"Tribal Axethrowers",\n               "text":"Build the Totem specialization directly."\n            }),new Array("qol_archmage","tw_mage",this.cRoot.gameSettings.mages.archmage.cost,false,0,0,0,3,"TooltipBasic",{\n               "title":"Archmage",\n               "text":"Build the Archmage specialization directly."\n            }),new Array("qol_necro","tw_mage",this.cRoot.gameSettings.mages.necromancer.cost,false,0,0,0,4,"TooltipBasic",{\n               "title":"Necromancer",\n               "text":"Build the Necromancer specialization directly."\n            }),new Array("qol_specials3"'''
          t=once(t,old2,new2,'special page 2')
          page3=r'''         if(param1 == "qol_specials3")
         {
            this.cRoot.quickMenu.load(this.x,this.y - 10 + this.yAdjust,this,false,0,true,new Array(new Array("qol_dwaarp","tw_engineer",this.cRoot.gameSettings.engineers.dwaarp.cost,false,0,0,0,1,"TooltipBasic",{
               "title":"DWAARP","text":"Build the DWAARP specialization directly."
            }),new Array("qol_mech","tw_engineer",this.cRoot.gameSettings.engineers.mech.cost,false,0,0,0,2,"TooltipBasic",{
               "title":"Battle-Mecha T200","text":"Build the Battle-Mecha specialization directly."
            }),new Array("qol_specials","tw_clean",0,false,0,0,0,7,"TooltipBasic",{
               "title":"← Special towers","text":"Return to the first special-tower page."
            })));
            this.cRoot.quickMenu.show(this.cRoot.§else const native§);
            return;
         }
'''
          t=once(t,'         if(param1 == "qol_dwarf")\n',page3+'         if(param1 == "qol_dwarf")\n','special page 3')
          hall=r'''         if(param1 == "qol_hall")
         {
            if(this.cRoot.cash < 225) return;
            this.cRoot.updateCash(-225);
            this.qolPlaceSpecial(new §_-Zs§(this.x,this.y + this.yAdjust,this.§_-EV§));
            return;
         }
'''
          t=once(t,'         if(param1 == "qol_pirates")\n',hall+'         if(param1 == "qol_pirates")\n','Dwarf Hall action')
          save('TowerHolder.as',t)

          # Quick menu handles all three pages safely after tower replacement/destroy.
          t=get('§_-LZ§.as')
          t=once(t,'if(param1 == "qol_specials" || param1 == "qol_specials2")','if(param1 == "qol_specials" || param1 == "qol_specials2" || param1 == "qol_specials3")','page 3 nav')
          marker='         this.cTower.upgradeTower(param1);\n'
          safe=r'''         if(param1.indexOf("qol_") == 0)
         {
            this.cTower.upgradeTower(param1);
            this.hide();
            return;
         }
'''
          t=once(t,marker,safe+marker,'special action safety')
          save('§_-LZ§.as',t)

          # Touch: respond on press for radial item and all true map-special towers.
          for n in ['§true break§.as','TowerDwarfRiflemen.as','TowerSoldierPirates.as','§_-Zs§.as']:
              t=get(n).replace('MouseEvent.CLICK,this.clickEvent','MouseEvent.MOUSE_DOWN,this.clickEvent')
              save(n,t)

          assets=Path('/tmp/src/_assets')
          if assets.exists(): shutil.copytree(assets,Path('/tmp/import/_assets'),dirs_exist_ok=True)
          print('final V4 patch applied')
          PY
          python3 /tmp/finalize.py
      - name: Rebuild and re-export verify
        run: |
          set -euo pipefail
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror abort -importScript assets/kingdom-rush-frontiers-v4.swf /tmp/out/kingdom-rush-frontiers-v4.swf /tmp/import >/tmp/import.log 2>&1
          test -s /tmp/out/kingdom-rush-frontiers-v4.swf
          head -c 3 /tmp/out/kingdom-rush-frontiers-v4.swf | grep -Eq 'FWS|CWS|ZWS'
          mkdir -p /tmp/verify
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -selectclass 'Level,§_-2i§,§_-BQ§,TowerHolder,§_-LZ§,§true break§,TowerDwarfRiflemen,TowerSoldierPirates,§_-Zs§' -export script /tmp/verify /tmp/out/kingdom-rush-frontiers-v4.swf >/tmp/verify.log 2>&1 || true
          grep -F 'Level.qolHeroEnabled[heroName] = true' /tmp/verify/scripts/Level.as
          grep -F 'RESET FOR CUSTOM' /tmp/verify/scripts/Level.as
          grep -F 'qolUpdateContainer' /tmp/verify/scripts/Level.as
          grep -F 'var heavy:Boolean' /tmp/verify/scripts/Level.as
          grep -F 'h.level = 10' '/tmp/verify/scripts/§_-2i§.as'
          grep -F 'qolProgressMode' '/tmp/verify/scripts/§_-BQ§.as'
          grep -F 'Dwarf Hall — 225' /tmp/verify/scripts/TowerHolder.as
          grep -F 'qol_specials3' '/tmp/verify/scripts/§_-LZ§.as'
          grep -F 'MouseEvent.MOUSE_DOWN,this.clickEvent' '/tmp/verify/scripts/§true break§.as'
          grep -F 'MouseEvent.MOUSE_DOWN,this.clickEvent' /tmp/verify/scripts/TowerDwarfRiflemen.as
          grep -F 'MouseEvent.MOUSE_DOWN,this.clickEvent' /tmp/verify/scripts/TowerSoldierPirates.as
          grep -F 'MouseEvent.MOUSE_DOWN,this.clickEvent' '/tmp/verify/scripts/§_-Zs§.as'
      - name: Publish verified binary
        run: |
          set -euo pipefail
          cp /tmp/out/kingdom-rush-frontiers-v4.swf assets/kingdom-rush-frontiers-v4.swf
          cat > assets/V4-BUILD.txt <<'EOF'
          Kingdom Rush Frontiers — V4 Sandbox + Stability (final)
          Based on the verified V3/V4 SWF chain and re-export verified with FFDec 26.2.1.

          - All 9 heroes start enabled in levels and can be toggled individually.
          - New/legacy saves default to all 65 tower-upgrade stars spent/maxed and all heroes level 10 with every hero skill maxed.
          - RESET FOR CUSTOM clears tower/hero skill spending while retaining the full 65-star pool and level-10 heroes. Custom mode persists, so later manual choices are not overwritten.
          - Gold uses a numeric text field and Add button.
          - Next-wave flags appear immediately; Send All Waves is paced across frames.
          - Special catalog includes Dwarf Bastion (250), Pirate Barracks (180), Dwarf Hall (225), Crossbow, Totem, Archmage, Necromancer, DWAARP and Battle-Mecha direct builds with displayed costs.
          - Special placements use the corrected build-spot center.
          - Pause controls, radial items and all three map-special towers react on mouse-down for more reliable touch input.
          - Heavy-enemy performance reuses child snapshots instead of allocating per-tick Dictionaries and throttles cosmetic layers only under high entity/bullet counts; gameplay updates stay full-rate.
          - V3 unlock-all, speed, custom enemy round and mobile changes remain included.
          EOF
          sha256sum assets/kingdom-rush-frontiers-v3.swf assets/kingdom-rush-frontiers-v4.swf > assets/V4-SHA256SUMS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/kingdom-rush-frontiers-v4.swf assets/V4-BUILD.txt assets/V4-SHA256SUMS.txt
          git commit -m 'Finalize Frontiers V4 max-reset, touch and performance [skip ci]'
          git pull --rebase origin agent/v4-frontiers-fixes
          git push origin HEAD:agent/v4-frontiers-fixes
      - name: Publish failure marker
        if: failure()
        run: |
          set +e
          {
            echo 'V4 finalization failed.'
            echo '--- export tail ---'; tail -80 /tmp/export.log 2>/dev/null
            echo '--- import tail ---'; tail -80 /tmp/import.log 2>/dev/null
            echo '--- verify tail ---'; tail -80 /tmp/verify.log 2>/dev/null
          } > assets/V4-FINALIZE-FAIL.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/V4-FINALIZE-FAIL.txt
          git commit -m 'Record V4 finalization failure [skip ci]' || true
          git pull --rebase origin agent/v4-frontiers-fixes || true
          git push origin HEAD:agent/v4-frontiers-fixes || true
