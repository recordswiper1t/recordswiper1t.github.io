name: Verify Epic War 5 Expansion V3 Prototype

on:
  pull_request:
    paths:
      - 'tools/epicwar5/expansion/**'
      - '.github/workflows/build-epicwar5-expansion-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download exact game and FFDec
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/ew5 /tmp/ffdec
          curl -fL --retry 3 --connect-timeout 20 'https://cache.armorgames.com/files/games/epic-war-5-12518.swf' -o /tmp/ew5/original.swf
          test "$(sha256sum /tmp/ew5/original.swf | cut -d' ' -f1)" = '848d173b5cba7ebc321ba6dc374389e038924e32cb4a42b0d1b31f51c0b71bb8'
          curl -fL --retry 3 'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          unzip -q /tmp/ffdec.zip -d /tmp/ffdec
      - name: Export and patch full expansion slice
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/ew5/export /tmp/ew5/out /tmp/ew5/verify
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 -export script /tmp/ew5/export /tmp/ew5/original.swf > /tmp/ew5/export.log 2>&1 || true
          python3 tools/epicwar5/expansion/build_expansion_storage_v3.py /tmp/ew5/export
          python3 tools/epicwar5/expansion/patch_progression_curve_v3.py /tmp/ew5/export
          python3 tools/epicwar5/expansion/patch_formation_army_pages_v3.py /tmp/ew5/export
          python3 tools/epicwar5/expansion/patch_equipment_slots_v3.py /tmp/ew5/export
          python3 tools/epicwar5/expansion/patch_catalog_compat_v3.py /tmp/ew5/export
          python3 tools/epicwar5/expansion/patch_expansion_equipment_catalog_v3.py /tmp/ew5/export
          python3 tools/epicwar5/expansion/patch_advanced_upgrades_v3.py /tmp/ew5/export
          python3 tools/epicwar5/expansion/patch_battle_rewards_v3.py /tmp/ew5/export
          python3 tools/epicwar5/expansion/patch_battle_12_units_v3.py /tmp/ew5/export
          python3 tools/epicwar5/expansion/patch_progression_enforcement_v3.py /tmp/ew5/export
          python3 tools/epicwar5/expansion/patch_expansion_campaign_v3.py /tmp/ew5/export
          python3 tools/epicwar5/expansion/patch_worldmap_compile_compat_v3.py /tmp/ew5/export
      - name: Rebuild prototype
        shell: bash
        run: |
          set -euxo pipefail
          if ! java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror abort -importScript /tmp/ew5/original.swf /tmp/ew5/out/epic-war-5-expansion-v3-prototype.swf /tmp/ew5/export > /tmp/ew5/import.log 2>&1; then
            echo '===== FFDec import diagnostics ====='
            cat /tmp/ew5/import.log
            exit 1
          fi
          test -s /tmp/ew5/out/epic-war-5-expansion-v3-prototype.swf
      - name: Re-decompile and verify full expansion slice
        shell: bash
        run: |
          set -euxo pipefail
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 -export script /tmp/ew5/verify /tmp/ew5/out/epic-war-5-expansion-v3-prototype.swf > /tmp/ew5/verify.log 2>&1 || true
          d=/tmp/ew5/verify/scripts/Game/Manager/DataManager.as
          f=/tmp/ew5/verify/scripts/Game/Interface/WorldMapFormation.as
          a=/tmp/ew5/verify/scripts/Game/Interface/WorldMapFormationAcc.as
          s=/tmp/ew5/verify/scripts/Game/Interface/WorldMapFormationSkill.as
          c=/tmp/ew5/verify/scripts/Game/System/StatDef/CharTotalStat.as
          ca=/tmp/ew5/verify/scripts/Game/System/StatDef/CharAbilityStat.as
          ci=/tmp/ew5/verify/scripts/Game/System/StatDef/CharItemStat.as
          r=/tmp/ew5/verify/scripts/Game/Interface/BattleResult.as
          b=/tmp/ew5/verify/scripts/Game/System/Battle/BattleControlPlayer.as
          e=/tmp/ew5/verify/scripts/Game/System/Battle/BattleControlEnemy.as
          w=/tmp/ew5/verify/scripts/Game/Interface/WorldMap.as
          grep -F 'unit_equip12_id' "$d"
          grep -F 'stage_expansion_stat' "$d"
          grep -F 'expansionProgressCount' "$d"
          grep -F 'if(clears >= 48)' "$d"
          grep -F 'expansionAdvancedUpgradesUnlocked' "$d"
          grep -F 'return this.expansionProgressCount() * 100 / 50' "$d"
          grep -F 'dat_item_inv.length < 55' "$d"
          grep -F 'equipPage:int = 1' "$f"
          grep -F 'expansionGetUnitEquip(armyStart + 6)' "$f"
          grep -F 'equipSlotPage:int = 1' "$a"
          grep -F 'return "item2"' "$a"
          grep -F 'return "item3"' "$a"
          grep -F 'Page " + this.pageNum + " / " + "5"' "$a"
          grep -F 'expansionItemIconFrame' "$a"
          grep -F 'skillPage:int = 1' "$s"
          grep -F 'Advanced locked: 18 clears' "$s"
          grep -F 'unit_ability18_id' "$c"
          grep -F 'assignSpell(ability18.id)' "$c"
          grep -F 'unit_item2_ability_id' "$c"
          grep -F 'itemAbility3.attack' "$c"
          grep -F 'case 105:' "$ca"
          grep -F 'x_artlogicprime' "$ca"
          grep -F 'case 55:' "$ci"
          grep -F 'Artlogic Prime' "$ci"
          grep -F 'expansionGetUnitEquip(expansionSlot)' "$r"
          grep -F 'battle_stage >= 26' "$r"
          grep -F 'stageSetValue("expansion",expansionStage' "$r"
          grep -F 'expansionUnits:Array' "$b"
          grep -F '6 <= this.mGF.datMgr.expansionArmySlotsUnlocked()' "$b"
          grep -F 'slot = i + 7' "$b"
          grep -F 'case 125:' "$e"
          grep -F 'initExpansion(25)' "$e"
          grep -F 'battle_stage = 25 + tier' "$e"
          grep -F 'exp_artlogicprime' "$e"
          grep -F 'EPIC WAR 5 — EXPANSION CAMPAIGN' "$w"
          grep -F 'clip.init(this.mGF,100 + id)' "$w"
          grep -F 'var expansionStatus:String' "$w"
      - name: Upload verified full prototype artifact
        uses: actions/upload-artifact@v4
        with:
          name: epicwar5-expansion-v3-full-prototype
          retention-days: 7
          path: |
            /tmp/ew5/out/epic-war-5-expansion-v3-prototype.swf
            /tmp/ew5/import.log
            /tmp/ew5/verify.log
