name: Export V12 quick sources
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/export-v12-quick.yml']
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Download FFDec
        run: |
          curl -fL 'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          mkdir -p /tmp/ffdec && unzip -q /tmp/ffdec.zip -d /tmp/ffdec
      - name: Export campaign and boss classes from V11
        run: |
          set -euo pipefail
          rm -rf /tmp/out && mkdir -p /tmp/out
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -selectclass 'Level,Level1,Level15,MainMenu,Enemy,EnemyFinalBoss,TowerHolder,§_-Mm§,§each const each§' -export script /tmp/out assets/kingdom-rush-frontiers-v11.swf >/tmp/export.log 2>&1 || true
          test -f /tmp/out/scripts/Level15.as
          test -f /tmp/out/scripts/MainMenu.as
      - uses: actions/upload-artifact@v4
        with:
          name: v12-quick-sources
          path: /tmp/out/scripts
