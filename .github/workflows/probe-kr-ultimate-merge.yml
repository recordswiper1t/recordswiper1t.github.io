name: Probe Kingdom Rush Ultimate merge structure

on:
  push:
    branches: [agent/v13-kingdom-rush-ultimate]
    paths:
      - 'tools/ultimate/level_signatures.py'
      - 'tools/ultimate/swf_xml_probe.py'
      - '.github/workflows/probe-kr-ultimate-merge.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/ultimate/level_signatures.py'
      - 'tools/ultimate/swf_xml_probe.py'
      - '.github/workflows/probe-kr-ultimate-merge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch official KR1 publisher build and FFDec
        run: |
          set -euo pipefail
          mkdir -p /tmp/ultimate /tmp/ffdec
          curl -fL --retry 4 --retry-all-errors \
            'https://cache.armorgames.com/files/games/kingdom-rush-12141.swf' \
            -o /tmp/ultimate/kr1.swf
          curl -fL --retry 4 \
            'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' \
            -o /tmp/ffdec.zip
          unzip -q /tmp/ffdec.zip -d /tmp/ffdec
          head -c 3 /tmp/ultimate/kr1.swf | grep -Eq 'FWS|CWS|ZWS'

      - name: Select Frontiers runtime
        run: |
          set -euo pipefail
          if [ -s assets/kingdom-rush-frontiers-v12.swf ]; then
            echo 'KRF_BASE=assets/kingdom-rush-frontiers-v12.swf' >> "$GITHUB_ENV"
          else
            echo 'KRF_BASE=assets/kingdom-rush-frontiers-v11.swf' >> "$GITHUB_ENV"
          fi

      - name: Export KR1 scripts and produce safe level signatures
        run: |
          set -euo pipefail
          mkdir -p /tmp/kr1scripts
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar \
            -onerror ignore -timeout 90 -exportFileTimeout 180 \
            -export script /tmp/kr1scripts /tmp/ultimate/kr1.swf \
            >/tmp/ultimate/export-kr1.log 2>&1 || true
          test -d /tmp/kr1scripts/scripts
          python3 tools/ultimate/level_signatures.py /tmp/kr1scripts/scripts \
            --output /tmp/ultimate/kr1-level-signatures.json

      - name: Convert both SWFs to FFDec internal XML
        run: |
          set -euo pipefail
          java -Xmx6g -jar /tmp/ffdec/ffdec.jar -swf2xml /tmp/ultimate/kr1.swf /tmp/ultimate/kr1.xml
          java -Xmx6g -jar /tmp/ffdec/ffdec.jar -swf2xml "$KRF_BASE" /tmp/ultimate/krf.xml
          test -s /tmp/ultimate/kr1.xml
          test -s /tmp/ultimate/krf.xml

      - name: Probe merge-relevant XML schema
        run: |
          set -euo pipefail
          python3 tools/ultimate/swf_xml_probe.py \
            --kr1 /tmp/ultimate/kr1.xml \
            --krf /tmp/ultimate/krf.xml \
            --output /tmp/ultimate/swf-xml-schema.json

      - name: Round-trip Frontiers XML unchanged
        run: |
          set -euo pipefail
          java -Xmx6g -jar /tmp/ffdec/ffdec.jar -xml2swf /tmp/ultimate/krf.xml /tmp/ultimate/krf-roundtrip.swf
          test -s /tmp/ultimate/krf-roundtrip.swf
          head -c 3 /tmp/ultimate/krf-roundtrip.swf | grep -Eq 'FWS|CWS|ZWS'
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -dumpAS3 /tmp/ultimate/krf-roundtrip.swf >/tmp/ultimate/krf-roundtrip-as3.txt
          test -s /tmp/ultimate/krf-roundtrip-as3.txt
          sha256sum "$KRF_BASE" /tmp/ultimate/krf-roundtrip.swf > /tmp/ultimate/xml-roundtrip-sha256.txt

      - name: Explain probe output
        run: |
          cat > /tmp/ultimate/README-PROBE.txt <<'TXT'
          Structural merge probe only. No SWF, decompiled ActionScript, XML asset dump,
          or other copyrighted game content is uploaded. The artifact contains only
          dependency/class-name signatures, tag-schema metadata and round-trip hashes.
          TXT

      - uses: actions/upload-artifact@v4
        with:
          name: kr-ultimate-merge-probe
          path: |
            /tmp/ultimate/kr1-level-signatures.json
            /tmp/ultimate/swf-xml-schema.json
            /tmp/ultimate/xml-roundtrip-sha256.txt
            /tmp/ultimate/README-PROBE.txt
