name: Probe KR1 Southport Level adapter

on:
  push:
    branches: [agent/v13-kingdom-rush-ultimate-clean]
    paths:
      - 'tools/ultimate/merge_swf_xml.py'
      - 'tools/ultimate/port_plan.py'
      - 'tools/ultimate/extract_class_names.py'
      - 'tools/ultimate/level_api_diff.py'
      - 'tools/ultimate/build_level_adapter.py'
      - 'tools/ultimate/rebind_namespaced_scripts.py'
      - '.github/workflows/probe-kr1-southport-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  southport-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile adapter tooling
        run: |
          python3 -m py_compile tools/ultimate/level_api_diff.py
          python3 -m py_compile tools/ultimate/build_level_adapter.py
          python3 -m py_compile tools/ultimate/rebind_namespaced_scripts.py

      - name: Fetch publisher KR1 source and FFDec
        run: |
          set -euo pipefail
          mkdir -p /tmp/u /tmp/ffdec
          curl -fL --retry 4 --retry-all-errors \
            'https://cache.armorgames.com/files/games/kingdom-rush-12141.swf' -o /tmp/u/kr1.swf
          curl -fL --retry 4 \
            'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          unzip -q /tmp/ffdec.zip -d /tmp/ffdec
          if [ -s assets/kingdom-rush-frontiers-v12.swf ]; then
            echo 'KRF_BASE=assets/kingdom-rush-frontiers-v12.swf' >> "$GITHUB_ENV"
          else
            echo 'KRF_BASE=assets/kingdom-rush-frontiers-v11.swf' >> "$GITHUB_ENV"
          fi

      - name: Export source scripts and build merge policy
        run: |
          set -euo pipefail
          mkdir -p /tmp/u/kr1-src /tmp/u/krf-src
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 \
            -export script /tmp/u/kr1-src /tmp/u/kr1.swf >/tmp/u/export-kr1.log 2>&1 || true
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 \
            -export script /tmp/u/krf-src "$KRF_BASE" >/tmp/u/export-krf.log 2>&1 || true
          test -f /tmp/u/kr1-src/scripts/Level.as
          test -f /tmp/u/kr1-src/scripts/Level1.as
          test -f /tmp/u/krf-src/scripts/Level.as
          python3 tools/ultimate/port_plan.py \
            --kr1 /tmp/u/kr1-src/scripts --krf /tmp/u/krf-src/scripts \
            --output /tmp/u/port-plan.json
          python3 tools/ultimate/extract_class_names.py /tmp/u/kr1-src/scripts \
            --prefix 'KR1__' --output /tmp/u/all-prefix-map.json

      - name: Build fully namespaced KR1 plus enhanced Frontiers SWF
        run: |
          set -euo pipefail
          mkdir -p /tmp/u/report
          java -Xmx6g -jar /tmp/ffdec/ffdec.jar -swf2xml /tmp/u/kr1.swf /tmp/u/kr1.xml
          java -Xmx6g -jar /tmp/ffdec/ffdec.jar -swf2xml "$KRF_BASE" /tmp/u/krf.xml
          python3 tools/ultimate/merge_swf_xml.py \
            --base /tmp/u/krf.xml --source /tmp/u/kr1.xml \
            --class-map /tmp/u/all-prefix-map.json \
            --output /tmp/u/merged.xml --report /tmp/u/report/merge-report.json
          java -Xmx8g -jar /tmp/ffdec/ffdec.jar -xml2swf /tmp/u/merged.xml /tmp/u/merged.swf
          head -c 3 /tmp/u/merged.swf | grep -Eq 'FWS|CWS|ZWS'

      - name: Export merged scripts
        run: |
          set -euo pipefail
          mkdir -p /tmp/u/merged-export
          java -Xmx6g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 \
            -export script /tmp/u/merged-export /tmp/u/merged.swf >/tmp/u/export-merged.log 2>&1 || true
          test -f /tmp/u/merged-export/scripts/KR1__Level.as
          test -f /tmp/u/merged-export/scripts/KR1__Level1.as
          test -f /tmp/u/merged-export/scripts/Level.as

      - name: Generate Southport Level adapter contract and compile bridge
        run: |
          set -euo pipefail
          mkdir -p /tmp/u/report /tmp/u/adapter-import/scripts
          python3 tools/ultimate/level_api_diff.py \
            --kr1-level /tmp/u/kr1-src/scripts/Level.as \
            --krf-level /tmp/u/krf-src/scripts/Level.as \
            --kr1-stage /tmp/u/kr1-src/scripts/Level1.as \
            --output /tmp/u/report/southport-level-api.json
          python3 tools/ultimate/build_level_adapter.py \
            --contract /tmp/u/report/southport-level-api.json \
            --frontiers-level /tmp/u/krf-src/scripts/Level.as \
            --output /tmp/u/adapter-import/scripts/KR1__Level.as \
            --report /tmp/u/report/level-adapter-build.json
          grep -F 'class KR1__Level extends Level' /tmp/u/adapter-import/scripts/KR1__Level.as

      - name: Rebind Southport while retaining KR1 Level adapter identity
        run: |
          set -euo pipefail
          python3 tools/ultimate/rebind_namespaced_scripts.py \
            --scripts /tmp/u/merged-export/scripts \
            --plan /tmp/u/port-plan.json \
            --exclude-rebind KR1__Level \
            --output /tmp/u/rebind \
            --report /tmp/u/report/rebind-report.json
          src=$(find /tmp/u/rebind/scripts -name 'KR1__Level1.as' -print -quit)
          test -n "$src"
          cp "$src" /tmp/u/adapter-import/scripts/KR1__Level1.as
          grep -F 'extends KR1__Level' /tmp/u/adapter-import/scripts/KR1__Level1.as
          if grep -F 'extends Level' /tmp/u/adapter-import/scripts/KR1__Level1.as; then
            echo 'Southport bypassed the compatibility adapter unexpectedly' >&2
            exit 1
          fi

      - name: Compile adapter and Southport into merged SWF
        id: compile
        shell: bash
        run: |
          set +e
          java -Xmx8g -jar /tmp/ffdec/ffdec.jar -onerror abort \
            -importScript /tmp/u/merged.swf /tmp/u/southport-adapter.swf /tmp/u/adapter-import \
            >/tmp/u/import-adapter.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "$code" > /tmp/u/import-adapter.exit
          tail -160 /tmp/u/import-adapter.log || true
          exit 0

      - name: Verify compile bridge when successful
        if: steps.compile.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          test -s /tmp/u/southport-adapter.swf
          mkdir -p /tmp/u/verify
          java -Xmx6g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 \
            -selectclass 'KR1__Level,KR1__Level1,Level,Level15' \
            -export script /tmp/u/verify /tmp/u/southport-adapter.swf >/tmp/u/verify.log 2>&1 || true
          grep -F 'class KR1__Level extends Level' /tmp/u/verify/scripts/KR1__Level.as
          grep -F 'extends KR1__Level' /tmp/u/verify/scripts/KR1__Level1.as
          grep -F 'qolTowerClipboard' /tmp/u/verify/scripts/Level.as
          if [ -s assets/kingdom-rush-frontiers-v12.swf ]; then
            grep -F 'THE LAST RIFT' /tmp/u/verify/scripts/Level15.as
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          api=json.load(open('/tmp/u/report/southport-level-api.json',encoding='utf-8'))
          build=json.load(open('/tmp/u/report/level-adapter-build.json',encoding='utf-8'))
          result={
              'compile_success': True,
              'missing_frontiers_level_members_bridged': len(api['stage_refs_missing_on_krf']),
              'generated_bridge_members': build['generated_member_count'],
              'frontiers_constructor_forwarding': build.get('frontiers_constructor',{}),
              'southport_extends_kr1_level_adapter': True,
              'kr1_level_adapter_extends_frontiers_level': True,
              'frontiers_mod_markers_preserved': True,
              'semantic_status': 'compile bridge only; generated stubs still require explicit behavior adapters',
          }
          Path('/tmp/u/report/southport-adapter-result.json').write_text(json.dumps(result,indent=2),encoding='utf-8')
          print(json.dumps(result,indent=2))
          PY

      - name: Record compile failure for next adapter iteration
        if: steps.compile.outputs.exit_code != '0'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          log=Path('/tmp/u/import-adapter.log').read_text(encoding='utf-8',errors='replace')
          result={
              'compile_success': False,
              'exit_code': int(Path('/tmp/u/import-adapter.exit').read_text().strip()),
              'meaning': 'The KR1__Level bridge exposed additional compile-time API/type incompatibilities.',
              'log_tail': '\n'.join(log.splitlines()[-160:]),
          }
          Path('/tmp/u/report/southport-adapter-result.json').write_text(json.dumps(result,indent=2),encoding='utf-8')
          PY

      - name: Upload structural adapter reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kr1-southport-level-adapter-probe
          path: |
            /tmp/u/report/merge-report.json
            /tmp/u/report/southport-level-api.json
            /tmp/u/report/level-adapter-build.json
            /tmp/u/report/rebind-report.json
            /tmp/u/report/southport-adapter-result.json
            /tmp/u/import-adapter.log
          retention-days: 30

      - name: Require first adapter bridge to compile
        run: test '${{ steps.compile.outputs.exit_code }}' = '0'
