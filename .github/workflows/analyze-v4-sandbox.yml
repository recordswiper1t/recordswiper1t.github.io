name: Analyze Frontiers V4 Sandbox

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  analyze:
    if: github.head_ref == 'agent/iphone-performance-selector-completeness'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download FFDec 26.2.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          mkdir -p /tmp/ffdec
          unzip -q /tmp/ffdec.zip -d /tmp/ffdec
          test -f /tmp/ffdec/ffdec.jar

      - name: Export V4 ActionScript
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/krf-v4
          mkdir -p /tmp/krf-v4
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar \
            -onerror ignore -timeout 60 -exportFileTimeout 120 \
            -export script /tmp/krf-v4 assets/kingdom-rush-frontiers-v4.swf \
            > /tmp/v4-export.log 2>&1 || true
          count=$(find /tmp/krf-v4 -type f | wc -l | tr -d ' ')
          echo "Exported files: $count"
          test "$count" -gt 0

      - name: Build compact V4 sandbox index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p analysis
          report='analysis/v4-sandbox-index.txt'
          : > "$report"
          {
            echo 'Kingdom Rush Frontiers V4 sandbox-script index'
            echo 'Source: assets/kingdom-rush-frontiers-v4.swf'
            echo "Generated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo '=== hero/enemy/tower implementations ==='
          } >> "$report"
          find /tmp/krf-v4 -type f \( -iname '*Hero*.as' -o -iname 'Enemy*.as' -o -iname 'Tower*.as' -o -iname '*Boss*.as' -o -iname '*Special*.as' \) \
            | sed 's#^/tmp/krf-v4/##' | sort -u | head -n 1600 >> "$report" || true
          {
            echo
            echo '=== V4 control-related source lines ==='
          } >> "$report"
          grep -RniE 'SEND ALL|Send All|RESET FOR CUSTOM|MAX ALL|custom enemy|enemy round|hero|special tower|special_|wave|boss|quickMenu|qol_|addChild|removeChild|MOUSE_DOWN|CLICK' /tmp/krf-v4/scripts 2>/dev/null \
            | sed 's#^/tmp/krf-v4/##' | cut -c1-420 | head -n 14000 >> "$report" || true
          {
            echo
            echo '=== likely modified files with full context ==='
          } >> "$report"
          while IFS= read -r f; do
            echo >> "$report"
            echo "----- ${f#/tmp/krf-v4/} -----" >> "$report"
            nl -ba "$f" | head -n 1800 >> "$report"
          done < <(grep -RilE 'SEND ALL|Send All|RESET FOR CUSTOM|MAX ALL|qol_specials|qol_enemy|qol_hero' /tmp/krf-v4/scripts 2>/dev/null | head -n 40)
          {
            echo
            echo '=== export log tail ==='
            tail -n 80 /tmp/v4-export.log || true
          } >> "$report"
          wc -l "$report"

      - name: Commit V4 analysis index to PR branch
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/v4-sandbox-index.txt
          git commit -m 'Index Frontiers V4 sandbox scripts [skip ci]' || exit 0
          git pull --rebase origin "${TARGET_BRANCH}"
          git push origin HEAD:"${TARGET_BRANCH}"
