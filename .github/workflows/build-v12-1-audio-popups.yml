name: Build V12.1 audio and popup fixes

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/kingdom-rush-frontiers-v12.swf'
      - 'assets/V12-SHA256SUMS.txt'
      - 'tools/v12_1/**'
      - '.github/workflows/build-v12-1-audio-popups.yml'
  push:
    branches: [agent/finish-krf-v12-1, main]
    paths:
      - 'assets/kingdom-rush-frontiers-v12.swf'
      - 'assets/V12-SHA256SUMS.txt'
      - 'tools/v12_1/**'
      - '.github/workflows/build-v12-1-audio-popups.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify V12 base release
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/kingdom-rush-frontiers-v12.swf
          sha256sum -c assets/V12-SHA256SUMS.txt
          head -c 3 assets/kingdom-rush-frontiers-v12.swf | grep -Eq 'FWS|CWS|ZWS'

      - name: Download FFDec 26.2.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          mkdir -p /tmp/ffdec
          unzip -q /tmp/ffdec.zip -d /tmp/ffdec
          test -f /tmp/ffdec/ffdec.jar

      - name: Export V12 ActionScript
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v121 /tmp/import /tmp/out /tmp/verify
          mkdir -p /tmp/v121 /tmp/import/scripts/'§_-aQ§' /tmp/out /tmp/verify
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar \
            -onerror ignore -timeout 90 -exportFileTimeout 180 \
            -export script /tmp/v121 assets/kingdom-rush-frontiers-v12.swf \
            >/tmp/export-v121.log 2>&1 || true
          test -f /tmp/v121/scripts/Level.as
          test -f '/tmp/v121/scripts/§_-aQ§/§for for dynamic§.as'
          test -f '/tmp/v121/scripts/§dynamic const function§.as'
          test -f '/tmp/v121/scripts/§_-bK§.as'
          test -f /tmp/v121/scripts/Level15.as

      - name: Apply V12.1 fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/v12_1/audio_popups.py /tmp/v121/scripts
          python3 tools/v12_1/persisted_popup_state.py /tmp/v121/scripts
          cp /tmp/v121/scripts/Level.as /tmp/import/scripts/Level.as
          cp '/tmp/v121/scripts/§dynamic const function§.as' '/tmp/import/scripts/§dynamic const function§.as'
          cp '/tmp/v121/scripts/§_-bK§.as' '/tmp/import/scripts/§_-bK§.as'
          cp '/tmp/v121/scripts/§_-aQ§/§for for dynamic§.as' '/tmp/import/scripts/§_-aQ§/§for for dynamic§.as'
          [ -d /tmp/v121/_assets ] && cp -a /tmp/v121/_assets /tmp/import/_assets || true

      - name: Import patched scripts
        shell: bash
        run: |
          set -euo pipefail
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar \
            -onerror abort \
            -importScript assets/kingdom-rush-frontiers-v12.swf \
            /tmp/out/kingdom-rush-frontiers-v12-1.swf /tmp/import \
            >/tmp/import-v121.log 2>&1
          test -s /tmp/out/kingdom-rush-frontiers-v12-1.swf
          head -c 3 /tmp/out/kingdom-rush-frontiers-v12-1.swf | grep -Eq 'FWS|CWS|ZWS'

      - name: Re-export and verify gameplay/runtime markers
        shell: bash
        run: |
          set -euo pipefail
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar \
            -onerror ignore -timeout 90 -exportFileTimeout 180 \
            -export script /tmp/verify /tmp/out/kingdom-rush-frontiers-v12-1.swf \
            >/tmp/verify-v121.log 2>&1 || true
          test -f /tmp/verify/scripts/Level.as
          test -f /tmp/verify/scripts/Level15.as
          grep -F 'POP-UP HINTS:' /tmp/verify/scripts/Level.as
          grep -F 'nextPopupState' /tmp/verify/scripts/Level.as
          grep -F 'Level.qolPopupsEnabled && this.game.main.tooltipsStatus' /tmp/verify/scripts/Level.as
          grep -F 'if(!Level.qolPopupsEnabled || !this.game.main.tooltipsStatus)' /tmp/verify/scripts/Level.as
          grep -F 'qolApplyCategoryVolumes' '/tmp/verify/scripts/§_-aQ§/§for for dynamic§.as'
          grep -F 'requestedVolume' '/tmp/verify/scripts/§_-aQ§/§for for dynamic§.as'
          grep -F 'Level.qolPopupsEnabled && this.level.game.main.tooltipsStatus' '/tmp/verify/scripts/§dynamic const function§.as'
          grep -F 'Level.qolPopupsEnabled = false' '/tmp/verify/scripts/§_-bK§.as'
          grep -F 'qolV12PostBossActive' /tmp/verify/scripts/Level15.as
          grep -F 'THE LAST RIFT' /tmp/verify/scripts/Level15.as
          sha256sum /tmp/out/kingdom-rush-frontiers-v12-1.swf > /tmp/out/V12-1-SHA256SUMS.txt

      - name: Verify release integration targets
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'kingdom-rush-frontiers-v12-1.swf' mod/fast.html
          grep -F 'kingdom-rush-frontiers-v12-1.swf' iphone/krf.html
          grep -F 'kingdom-rush-frontiers-v12-1.swf' desktop/run_native.py
          grep -F 'kingdom-rush-frontiers-v12-1.swf' desktop/run-native.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: verified-v12-1-audio-popups
          path: /tmp/out

      - name: Publish verified V12.1
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/out/kingdom-rush-frontiers-v12-1.swf assets/kingdom-rush-frontiers-v12-1.swf
          sed 's#/tmp/out/kingdom-rush-frontiers-v12-1.swf#assets/kingdom-rush-frontiers-v12-1.swf#' \
            /tmp/out/V12-1-SHA256SUMS.txt > assets/V12-1-SHA256SUMS.txt
          cat > assets/V12-1-BUILD.txt <<'TXT'
          Kingdom Rush Frontiers — V12.1 Audio + Pop-up Polish (completion rebuild)
          - Fixes music/SFX mute state so pause/settings global mute cannot restore categories the player turned off.
          - Existing channels mute immediately; requested per-sound volume is preserved for correct later unmute.
          - Adds POP-UP HINTS ON/OFF to sandbox settings.
          - The built-in Tooltips switch and sandbox switch now stay synchronized.
          - A saved Tooltips=OFF preference is honored immediately after reload, including tutorial/notification cards created before opening sandbox settings.
          - Pop-up OFF suppresses tooltips, tutorial BUILD HERE signs, enemy/tutorial notification cards and similar instructional prompts without disabling gameplay controls.
          - Retains V12 The Last Rift and all earlier sandbox/performance features.
          - The V12 input checksum is verified before patching and the generated SWF is freshly re-exported for marker verification.
          Built, re-exported and structurally verified with FFDec 26.2.1.
          TXT
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/kingdom-rush-frontiers-v12-1.swf assets/V12-1-SHA256SUMS.txt assets/V12-1-BUILD.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Rebuild verified V12.1 runtime state fixes [skip ci]'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
