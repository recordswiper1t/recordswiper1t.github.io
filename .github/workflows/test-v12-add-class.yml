name: Test V12 class addition
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/test-v12-add-class.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Download FFDec
        run: |
          curl -fL 'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          mkdir -p /tmp/ffdec && unzip -q /tmp/ffdec.zip -d /tmp/ffdec
      - name: Attempt class addition
        run: |
          set -euo pipefail
          rm -rf /tmp/import /tmp/out /tmp/verify && mkdir -p /tmp/import/scripts /tmp/out /tmp/verify
          cat > /tmp/import/scripts/V12Dummy.as <<'AS'
          package
          {
             public class V12Dummy
             {
                public static const MARKER:String = "V12_NEW_CLASS_WORKS";
                public function V12Dummy() { super(); }
             }
          }
          AS
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror abort -importScript assets/kingdom-rush-frontiers-v11.swf /tmp/out/test.swf /tmp/import >/tmp/import.log 2>&1
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 60 -selectclass 'V12Dummy' -export script /tmp/verify /tmp/out/test.swf >/tmp/verify.log 2>&1 || true
          test -f /tmp/verify/scripts/V12Dummy.as
          grep -F 'V12_NEW_CLASS_WORKS' /tmp/verify/scripts/V12Dummy.as
