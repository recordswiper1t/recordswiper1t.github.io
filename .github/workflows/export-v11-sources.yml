name: Export V11 source targets
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/export-v11-sources.yml']
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Download FFDec
        run: |
          curl -fL 'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          mkdir -p /tmp/ffdec && unzip -q /tmp/ffdec.zip -d /tmp/ffdec
      - name: Export V10 sources
        run: |
          rm -rf /tmp/out /tmp/live && mkdir -p /tmp/out /tmp/live
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 -export script /tmp/out assets/kingdom-rush-frontiers-v10.swf || true
          cp /tmp/out/scripts/Level.as /tmp/live/Level.as
          cp /tmp/out/scripts/TowerHolder.as /tmp/live/TowerHolder.as
          cp /tmp/out/scripts/TowerArcherCrossbow.as /tmp/live/TowerArcherCrossbow.as
          cp /tmp/out/scripts/TowerArcherTotem.as /tmp/live/TowerArcherTotem.as
          cp /tmp/out/scripts/TowerMageArchmage.as /tmp/live/TowerMageArchmage.as
          cp /tmp/out/scripts/TowerMageNecromancer.as /tmp/live/TowerMageNecromancer.as
          cp /tmp/out/scripts/TowerEngineerDwaarp.as /tmp/live/TowerEngineerDwaarp.as
          cp /tmp/out/scripts/TowerEngineerMech.as /tmp/live/TowerEngineerMech.as
          cp '/tmp/out/scripts/§_-v9§.as' '/tmp/live/§_-v9§.as'
          cp /tmp/out/scripts/TowerMage.as /tmp/live/TowerMage.as
          cp /tmp/out/scripts/TowerEngineer.as /tmp/live/TowerEngineer.as
          cp '/tmp/out/scripts/§_-oH§.as' '/tmp/live/§_-oH§.as'
      - uses: actions/upload-artifact@v4
        with:
          name: v11-source-targets
          path: /tmp/live
