name: Build Epic War 5 Sandbox

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/epicwar5/**'
      - '.github/workflows/build-epicwar5.yml'
  pull_request:
    paths:
      - 'tools/epicwar5/**'
      - '.github/workflows/build-epicwar5.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download original Epic War 5 SWF
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .build/epicwar5 assets
          urls=(
            'https://cache.armorgames.com/files/games/epic-war-5-12518.swf'
            'https://locker.phinugamma.org/swf/armorgames/epic-war-5-12518.swf'
            'https://www.walshmedicalmedia.com/games/swf/epic-war-5.swf'
          )
          ok=0
          for u in "${urls[@]}"; do
            if curl -fL --retry 2 --connect-timeout 20 "$u" -o .build/epicwar5/original.swf; then
              sz=$(stat -c%s .build/epicwar5/original.swf)
              if [ "$sz" -gt 15000000 ]; then ok=1; echo "$u" > .build/epicwar5/source-url.txt; break; fi
            fi
          done
          test "$ok" = 1
          sig=$(head -c 3 .build/epicwar5/original.swf)
          case "$sig" in FWS|CWS|ZWS) ;; *) exit 1;; esac
          sha256sum .build/epicwar5/original.swf

      - name: Build sandbox and chaos variants
        run: |
          python3 tools/epicwar5/build_mod.py .build/epicwar5/original.swf assets/epic-war-5-sandbox-v1.swf --report assets/EPIC-WAR-5-SANDBOX-V1-BUILD.json
          python3 tools/epicwar5/build_mod.py .build/epicwar5/original.swf assets/epic-war-5-chaos-v1.swf --chaos --report assets/EPIC-WAR-5-CHAOS-V1-BUILD.json
          sha256sum assets/epic-war-5-*-v1.swf > assets/EPIC-WAR-5-SHA256SUMS.txt

      - name: Decompile ActionScript for analysis
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip -o .build/ffdec.zip
          unzip -q .build/ffdec.zip -d .build/ffdec
          mkdir -p .build/epicwar5/scripts
          java -jar .build/ffdec/ffdec.jar -export script .build/epicwar5/scripts .build/epicwar5/original.swf || true
          find .build/epicwar5/scripts -type f | sort > .build/epicwar5/script-files.txt
          grep -RniE 'DataManager|dat_unit_|mana|spawn|summon|hero|stage|skill|accessor|accessory|experience|gold|reward|population|unit' .build/epicwar5/scripts > .build/epicwar5/hotspots.txt || true

      - name: Upload analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: epicwar5-analysis
          retention-days: 7
          path: |
            .build/epicwar5/source-url.txt
            .build/epicwar5/script-files.txt
            .build/epicwar5/hotspots.txt
            .build/epicwar5/scripts/**
            assets/epic-war-5-sandbox-v1.swf
            assets/epic-war-5-chaos-v1.swf
            assets/EPIC-WAR-5-SANDBOX-V1-BUILD.json
            assets/EPIC-WAR-5-CHAOS-V1-BUILD.json
            assets/EPIC-WAR-5-SHA256SUMS.txt

      - name: Publish generated builds on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -eux
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/epic-war-5-sandbox-v1.swf assets/epic-war-5-chaos-v1.swf assets/EPIC-WAR-5-SANDBOX-V1-BUILD.json assets/EPIC-WAR-5-CHAOS-V1-BUILD.json assets/EPIC-WAR-5-SHA256SUMS.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build Epic War 5 sandbox v1'
          git push
