name: Build Epic War 5 Sandbox

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/epicwar5/**'
      - '.github/workflows/build-epicwar5.yml'
  pull_request:
    paths:
      - 'tools/epicwar5/**'
      - '.github/workflows/build-epicwar5.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download original Epic War 5 SWF and FFDec
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/ew5 /tmp/ffdec assets
          curl -fL --retry 3 --connect-timeout 20 'https://cache.armorgames.com/files/games/epic-war-5-12518.swf' -o /tmp/ew5/original.swf
          test "$(sha256sum /tmp/ew5/original.swf | cut -d' ' -f1)" = '848d173b5cba7ebc321ba6dc374389e038924e32cb4a42b0d1b31f51c0b71bb8'
          curl -fL --retry 3 'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          unzip -q /tmp/ffdec.zip -d /tmp/ffdec
          test -f /tmp/ffdec/ffdec.jar

      - name: Export and patch ActionScript
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/ew5/export /tmp/ew5/out /tmp/ew5/verify
          mkdir -p /tmp/ew5/export /tmp/ew5/out /tmp/ew5/verify
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 -export script /tmp/ew5/export /tmp/ew5/original.swf > /tmp/ew5/export.log 2>&1 || true
          test -f /tmp/ew5/export/scripts/Game/Manager/DataManager.as
          test -f /tmp/ew5/export/scripts/Game/System/Battle/BattleSystem.as
          python3 tools/epicwar5/build_source_mod_v2.py /tmp/ew5/export

      - name: Import patched scripts
        shell: bash
        run: |
          set -euxo pipefail
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror abort -importScript /tmp/ew5/original.swf /tmp/ew5/out/epic-war-5-sandbox-v2.swf /tmp/ew5/export > /tmp/ew5/import.log 2>&1
          test -s /tmp/ew5/out/epic-war-5-sandbox-v2.swf
          head -c 3 /tmp/ew5/out/epic-war-5-sandbox-v2.swf | grep -Eq 'FWS|CWS|ZWS'

      - name: Verify V2 output by re-decompiling
        shell: bash
        run: |
          set -euxo pipefail
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 -export script /tmp/ew5/verify /tmp/ew5/out/epic-war-5-sandbox-v2.swf > /tmp/ew5/verify.log 2>&1 || true
          grep -F 'sandboxMaxAll' /tmp/ew5/verify/scripts/Game/Manager/DataManager.as
          grep -F 'sandboxAddMana' /tmp/ew5/verify/scripts/Game/System/Battle/BattleControlPlayer.as
          grep -F 'sandboxFreeSpells ? 0 : stat.spell_manacost' /tmp/ew5/verify/scripts/Game/System/Battle/PlayerSpell.as
          grep -F 'sandboxUnlimitedBuildings ? 999 : 4' /tmp/ew5/verify/scripts/Game/System/Battle/PlayerSpell.as
          grep -F 'sandboxPopBoost ? Math.max' /tmp/ew5/verify/scripts/Game/System/Battle/PlayerUnit.as
          grep -F 'sandboxFastUnits ? BattleSystem.sandboxSpawnDelay' /tmp/ew5/verify/scripts/Game/System/Battle/PlayerUnit.as
          grep -F 'sandboxFreeSpells:Boolean = false' /tmp/ew5/verify/scripts/Game/System/Battle/BattleSystem.as
          grep -F 'vanilla defaults' /tmp/ew5/verify/scripts/Game/System/Battle/BattleSystem.as

      - name: Stage V2 build files
        shell: bash
        run: |
          set -euxo pipefail
          cp /tmp/ew5/out/epic-war-5-sandbox-v2.swf assets/epic-war-5-sandbox-v2.swf
          cat > assets/EPIC-WAR-5-SANDBOX-V2-BUILD.txt <<'EOF'
          Epic War 5 — Optional Sandbox V2
          Source: Armor Games Epic War 5 v1.05, SHA-256 848d173b5cba7ebc321ba6dc374389e038924e32cb4a42b0d1b31f51c0b71bb8
          Built and re-decompile verified with FFDec 26.2.1.
          Vanilla-by-default: loading the mod no longer maxes or rewrites progression and battle cheats start disabled.
          F1 adds the selected mana amount instead of filling to a hard-coded maximum. [ and ] halve/double the amount from 10 to 5000.
          F11 toggles free spells. F12 toggles rapid unit production for newly initialized unit spawners.
          B toggles the building cap between vanilla 4 and 999. P toggles population boost for newly initialized unit spawners.
          F2/F3 select unit; F4/F5 spawn selected ally/enemy; F6 cycles batch 1/5/20/50; F7 cycles 1x/4x/8x; F8 wipes enemies; F9 instant win; F10 heals allies.
          The backtick key hides/shows the sandbox HUD. All optional battle toggles reset to OFF when the SWF starts.
          The legacy max-all helper remains in the binary as an explicit developer action, but is not called on new-save or load paths.
          EOF
          sed -i 's/^          //' assets/EPIC-WAR-5-SANDBOX-V2-BUILD.txt
          sha256sum assets/epic-war-5-sandbox-v2.swf > assets/EPIC-WAR-5-V2-SHA256SUMS.txt

      - name: Upload verified V2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: epicwar5-sandbox-v2
          retention-days: 7
          path: |
            assets/epic-war-5-sandbox-v2.swf
            assets/EPIC-WAR-5-SANDBOX-V2-BUILD.txt
            assets/EPIC-WAR-5-V2-SHA256SUMS.txt
            /tmp/ew5/import.log
            /tmp/ew5/verify.log

      - name: Commit verified V2 build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/epic-war-5-sandbox-v2.swf assets/EPIC-WAR-5-SANDBOX-V2-BUILD.txt assets/EPIC-WAR-5-V2-SHA256SUMS.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish Epic War 5 optional sandbox v2 [skip ci]'
          git push origin HEAD:main
