name: Analyze KRF unlocks

on:
  push:
    branches:
      - agent/unlock-all-towers-heroes
    paths-ignore:
      - 'analysis/unlock-export/**'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download FFDec
        run: |
          curl -L --fail -o /tmp/ffdec.zip https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip
          unzip -q /tmp/ffdec.zip -d /tmp/ffdec
      - name: Export ActionScript
        run: |
          rm -rf /tmp/krf-scripts
          mkdir -p /tmp/krf-scripts
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -cli -format script:as -export script /tmp/krf-scripts assets/kingdom-rush-frontie-15717.swf
      - name: Collect unlock-related scripts
        run: |
          rm -rf analysis/unlock-export
          mkdir -p analysis/unlock-export/scripts
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          root = Path('/tmp/krf-scripts')
          out = Path('analysis/unlock-export/scripts')
          needles = [
              'unlockMax', 'selectedHero', 'heroPrices', 'premium', 'Premium',
              'gameHeroData', 'heroAlric', 'heroMirage', 'heroCronan', 'heroCaptain',
              'heroNivus', 'heroGrawl', 'heroDierdre', 'heroShatra', 'heroAshbite',
              'purchases', 'purchase', 'locked', 'unlocked', 'unlock',
          ]
          chosen = []
          for p in root.rglob('*.as'):
              try:
                  text = p.read_text(errors='replace')
              except Exception:
                  continue
              hits = [n for n in needles if n in text]
              if not hits:
                  continue
              # Keep anything with direct unlock/hero-selection commerce logic, plus level scripts.
              strong = any(n in text for n in ['unlockMax','selectedHero','heroPrices','gameHeroData','purchases','purchase'])
              name = p.name
              levelish = name == 'Level.as' or (name.startswith('Level') and name[5:-3].isdigit())
              heroish = 'Hero' in name or name in {'MainMenu.as','ButPremiumContentMainMenu.as','AgiV2Handler.as'}
              if not (strong or levelish or heroish):
                  continue
              rel = p.relative_to(root)
              dest = out / rel
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(p, dest)
              chosen.append((str(rel), hits))

          idx = Path('analysis/unlock-export/INDEX.txt')
          with idx.open('w', encoding='utf-8') as f:
              f.write('Unlock-related ActionScript exported from Kingdom Rush Frontiers\n\n')
              for rel, hits in sorted(chosen):
                  f.write(f'{rel}\t{", ".join(hits)}\n')
          print(f'Collected {len(chosen)} scripts')
          PY
      - name: Commit analysis output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/unlock-export
          if git diff --cached --quiet; then
            echo 'No analysis changes.'
          else
            git commit -m 'export unlock scripts [unlock-analysis]'
            git push origin HEAD:agent/unlock-all-towers-heroes
          fi
