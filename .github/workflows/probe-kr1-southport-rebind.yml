name: Probe KR1 Southport on Frontiers shared core

on:
  push:
    branches: [agent/v13-kingdom-rush-ultimate-clean]
    paths:
      - 'tools/ultimate/rebind_namespaced_scripts.py'
      - 'tools/ultimate/port_plan.py'
      - 'tools/ultimate/merge_swf_xml.py'
      - '.github/workflows/probe-kr1-southport-rebind.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/ultimate/rebind_namespaced_scripts.py'
      - 'tools/ultimate/port_plan.py'
      - 'tools/ultimate/merge_swf_xml.py'
      - '.github/workflows/probe-kr1-southport-rebind.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  southport-rebind:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch publisher KR1 source and FFDec
        run: |
          set -euo pipefail
          mkdir -p /tmp/u /tmp/ffdec
          curl -fL --retry 4 --retry-all-errors \
            'https://cache.armorgames.com/files/games/kingdom-rush-12141.swf' -o /tmp/u/kr1.swf
          curl -fL --retry 4 \
            'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          unzip -q /tmp/ffdec.zip -d /tmp/ffdec
          if [ -s assets/kingdom-rush-frontiers-v12-1.swf ]; then
            echo 'KRF_BASE=assets/kingdom-rush-frontiers-v12-1.swf' >> "$GITHUB_ENV"
            echo 'HAS_V121=1' >> "$GITHUB_ENV"
          elif [ -s assets/kingdom-rush-frontiers-v12.swf ]; then
            echo 'KRF_BASE=assets/kingdom-rush-frontiers-v12.swf' >> "$GITHUB_ENV"
            echo 'HAS_V121=0' >> "$GITHUB_ENV"
          else
            echo 'KRF_BASE=assets/kingdom-rush-frontiers-v11.swf' >> "$GITHUB_ENV"
            echo 'HAS_V121=0' >> "$GITHUB_ENV"
          fi

      - name: Export source scripts and build policy
        run: |
          set -euo pipefail
          mkdir -p /tmp/u/kr1-src /tmp/u/krf-src
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 \
            -export script /tmp/u/kr1-src /tmp/u/kr1.swf >/tmp/u/export-kr1.log 2>&1 || true
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 \
            -export script /tmp/u/krf-src "$KRF_BASE" >/tmp/u/export-krf.log 2>&1 || true
          python3 tools/ultimate/port_plan.py \
            --kr1 /tmp/u/kr1-src/scripts --krf /tmp/u/krf-src/scripts \
            --output /tmp/u/port-plan.json
          python3 tools/ultimate/extract_class_names.py /tmp/u/kr1-src/scripts \
            --prefix 'KR1__' --output /tmp/u/all-prefix-map.json

      - name: Build fully namespaced structural merge
        run: |
          set -euo pipefail
          java -Xmx6g -jar /tmp/ffdec/ffdec.jar -swf2xml /tmp/u/kr1.swf /tmp/u/kr1.xml
          java -Xmx6g -jar /tmp/ffdec/ffdec.jar -swf2xml "$KRF_BASE" /tmp/u/krf.xml
          python3 tools/ultimate/merge_swf_xml.py \
            --base /tmp/u/krf.xml --source /tmp/u/kr1.xml \
            --class-map /tmp/u/all-prefix-map.json \
            --output /tmp/u/merged.xml --report /tmp/u/merge-report.json
          java -Xmx8g -jar /tmp/ffdec/ffdec.jar -xml2swf /tmp/u/merged.xml /tmp/u/merged.swf
          head -c 3 /tmp/u/merged.swf | grep -Eq 'FWS|CWS|ZWS'

      - name: Export merged scripts and generate shared-core rebinds
        run: |
          set -euo pipefail
          mkdir -p /tmp/u/merged-export
          java -Xmx6g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 \
            -export script /tmp/u/merged-export /tmp/u/merged.swf >/tmp/u/export-merged.log 2>&1 || true
          python3 tools/ultimate/rebind_namespaced_scripts.py \
            --scripts /tmp/u/merged-export/scripts \
            --plan /tmp/u/port-plan.json \
            --output /tmp/u/rebind-all \
            --report /tmp/u/rebind-report.json
          test -n "$(find /tmp/u/rebind-all/scripts -name 'KR1__Level1.as' -print -quit)"
          mkdir -p /tmp/u/southport-import/scripts
          find /tmp/u/rebind-all/scripts -name 'KR1__Level1.as' -exec cp '{}' /tmp/u/southport-import/scripts/ \;
          test -s /tmp/u/southport-import/scripts/KR1__Level1.as
          grep -F 'extends Level' /tmp/u/southport-import/scripts/KR1__Level1.as
          if grep -F 'extends KR1__Level' /tmp/u/southport-import/scripts/KR1__Level1.as; then
            echo 'Southport still extends the namespaced KR1 core' >&2
            exit 1
          fi

      - name: Recompile only Southport against Frontiers core
        id: compile
        shell: bash
        run: |
          set +e
          java -Xmx8g -jar /tmp/ffdec/ffdec.jar -onerror abort \
            -importScript /tmp/u/merged.swf /tmp/u/southport-rebound.swf /tmp/u/southport-import \
            >/tmp/u/import-southport.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "$code" > /tmp/u/import-southport.exit
          tail -120 /tmp/u/import-southport.log || true
          exit 0

      - name: Verify rebound Southport when compilation succeeds
        if: steps.compile.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          test -s /tmp/u/southport-rebound.swf
          mkdir -p /tmp/u/rebound-export
          java -Xmx6g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 \
            -export script /tmp/u/rebound-export /tmp/u/southport-rebound.swf >/tmp/u/export-rebound.log 2>&1 || true
          test -f /tmp/u/rebound-export/scripts/KR1__Level1.as
          grep -F 'extends Level' /tmp/u/rebound-export/scripts/KR1__Level1.as
          grep -F 'qolTowerClipboard' /tmp/u/rebound-export/scripts/Level.as
          if [ "$KRF_BASE" != 'assets/kingdom-rush-frontiers-v11.swf' ]; then
            grep -F 'THE LAST RIFT' /tmp/u/rebound-export/scripts/Level15.as
          fi
          if [ "$HAS_V121" = '1' ]; then
            grep -F 'qolPopupsEnabled' /tmp/u/rebound-export/scripts/Level.as
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          r=json.load(open('/tmp/u/rebind-report.json', encoding='utf-8'))
          Path('/tmp/u/southport-result.json').write_text(json.dumps({
              'compile_success': True,
              'frontiers_base': os.environ.get('KRF_BASE'),
              'shared_core_reference_map_count': r['shared_core_reference_map_count'],
              'content_classes_patchable': r['stats'].get('content_classes_patched',0),
              'reference_tokens_patchable': r['stats'].get('reference_tokens_rebound',0),
              'southport_extends_frontiers_level': True,
              'frontiers_mod_markers_preserved': True,
              'v12_1_polish_preserved': os.environ.get('HAS_V121') == '1',
          },indent=2),encoding='utf-8')
          PY

      - name: Record failure result when Southport exposes API incompatibilities
        if: steps.compile.outputs.exit_code != '0'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          code=int(Path('/tmp/u/import-southport.exit').read_text().strip())
          log=Path('/tmp/u/import-southport.log').read_text(encoding='utf-8',errors='replace')
          tail='\n'.join(log.splitlines()[-120:])
          Path('/tmp/u/southport-result.json').write_text(json.dumps({
              'compile_success': False,
              'exit_code': code,
              'meaning': 'Southport needs an adapter for one or more KR1-vs-KRF Level APIs; structural merge remains valid.',
              'log_tail': tail,
          },indent=2),encoding='utf-8')
          PY

      - name: Upload adapter/rebind reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kr1-southport-frontiers-core-probe
          path: |
            /tmp/u/merge-report.json
            /tmp/u/rebind-report.json
            /tmp/u/southport-result.json
            /tmp/u/import-southport.log

      - name: Require Southport core rebind to compile
        run: test '${{ steps.compile.outputs.exit_code }}' = '0'
