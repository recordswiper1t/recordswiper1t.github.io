name: Temporary KRF lifecycle source audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-krf-lifecycle.yml'
  push:
    branches: [agent/krf-lifecycle-audit]
    paths:
      - '.github/workflows/audit-krf-lifecycle.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download FFDec 26.2.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          mkdir -p /tmp/ffdec && unzip -q /tmp/ffdec.zip -d /tmp/ffdec
      - name: Export current V12.1 ActionScript
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/krf-src /tmp/report
          mkdir -p /tmp/krf-src /tmp/report
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 -export script /tmp/krf-src assets/kingdom-rush-frontiers-v12-1.swf >/tmp/export.log 2>&1 || true
          test -f /tmp/krf-src/scripts/Level.as
          test -f /tmp/krf-src/scripts/Level15.as
      - name: Extract victory, scoring and Last Rift lifecycle context
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/krf-src/scripts')

          def extract_function(text, marker):
              start=text.find(marker)
              if start < 0: return f'NOT FOUND: {marker}\n'
              brace=text.find('{', start)
              if brace < 0: return f'NO BRACE: {marker}\n'
              depth=0; ins=False; esc=False; quote=''; i=brace
              while i < len(text):
                  c=text[i]
                  if ins:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: ins=False
                  else:
                      if c in ('"', "'"): ins=True; quote=c
                      elif c=='{': depth+=1
                      elif c=='}':
                          depth-=1
                          if depth==0:
                              return text[start:i+1]+'\n'
                  i+=1
              return f'UNTERMINATED: {marker}\n'

          level=(root/'Level.as').read_text(encoding='utf-8-sig')
          l15=(root/'Level15.as').read_text(encoding='utf-8-sig')
          sections=[]
          for marker in [
              'private function qolTimeAttackKey()',
              'private function qolSaveBestTime()',
              'private function qolBankRun()',
              'private function qolFinishTimeAttack()',
              'private function qolTimeAttackDone()',
              'private function qolGameTick()',
              'public function onPreWin()',
          ]:
              sections.append('===== Level.as :: '+marker+' =====\n'+extract_function(level,marker))
          for marker in [
              'override public function onPreWin()',
              'private function qolV12BeginPostBoss()',
              'private function qolV12Frame(',
          ]:
              sections.append('===== Level15.as :: '+marker+' =====\n'+extract_function(l15,marker))
          Path('/tmp/report/functions.txt').write_text('\n'.join(sections),encoding='utf-8')

          report=[]
          for name,text in [('Level.as',level),('Level15.as',l15)]:
              lines=text.splitlines()
              needles=['onPreWin(', 'qolFinishTimeAttack(', 'qolBankRun(', 'qolV12PostBossActive', 'isReadyToWin', 'readyToWinTimeCounter']
              report.append('######## '+name+' ########')
              for i,line in enumerate(lines):
                  if any(n in line for n in needles):
                      report.append(f'--- hit line {i+1}: {line.strip()} ---')
                      a=max(0,i-18); b=min(len(lines),i+19)
                      report.extend(f'{j+1:5d}: {lines[j]}' for j in range(a,b))
                      report.append('')
          Path('/tmp/report/callsites.txt').write_text('\n'.join(report),encoding='utf-8')
          PY
      - name: Trace publisher-era external loaders and site locks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/krf-src/scripts')
          needles=[
              'server.cpmstar.com','mochiads.com','linkping.swf','AGI2.swf','ABS.swf',
              'agi.armorgames.com','stats.ironhidegames.com','armorgames.com/login',
              'getmobile.kingdomrushfrontiers.com','navigateToURL','URLLoader','Loader.load',
              'Security.allowDomain','loaderInfo.url','ExternalInterface'
          ]
          out=[]
          files=[]
          for p in sorted(root.rglob('*.as')):
              try: text=p.read_text(encoding='utf-8-sig')
              except Exception: continue
              lines=text.splitlines()
              hits=[i for i,line in enumerate(lines) if any(n.lower() in line.lower() for n in needles)]
              if not hits: continue
              rel=p.relative_to(root)
              files.append(str(rel))
              out.append('===== '+str(rel)+' =====')
              merged=[]
              for i in hits:
                  a=max(0,i-24); b=min(len(lines),i+25)
                  if merged and a <= merged[-1][1]: merged[-1]=(merged[-1][0],max(merged[-1][1],b))
                  else: merged.append((a,b))
              for a,b in merged:
                  out.extend(f'{j+1:5d}: {lines[j]}' for j in range(a,b))
                  out.append('')
          Path('/tmp/report/network-context.txt').write_text('\n'.join(out),encoding='utf-8')
          Path('/tmp/report/network-files.txt').write_text('\n'.join(files)+'\n',encoding='utf-8')
          PY
          find /tmp/krf-src/scripts -type f -name '*.as' -print | sort > /tmp/report/all-script-files.txt
          wc -l /tmp/report/*.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: krf-lifecycle-source-audit
          path: /tmp/report
