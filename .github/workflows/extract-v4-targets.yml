name: Extract V4 Patch Targets

on:
  push:
    branches:
      - agent/iphone-performance-selector-completeness

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out work branch
        uses: actions/checkout@v4
        with:
          ref: agent/iphone-performance-selector-completeness
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download FFDec
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          mkdir -p /tmp/ffdec
          unzip -q /tmp/ffdec.zip -d /tmp/ffdec

      - name: Export V4 scripts and extract final targets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/krf-v4
          mkdir -p /tmp/krf-v4 analysis
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 60 -exportFileTimeout 120 \
            -export script /tmp/krf-v4 assets/kingdom-rush-frontiers-v4.swf >/tmp/export.log 2>&1 || true
          test "$(find /tmp/krf-v4 -type f | wc -l)" -gt 1000
          report=analysis/v4-final-targets.txt
          : > "$report"
          {
            echo '=== LEVEL NORMAL WAVE CORE ==='
            sed -n '1840,1950p' /tmp/krf-v4/scripts/Level.as | nl -ba -v1840
            echo
            echo '=== LEVEL MANUAL SEND CORE ==='
            sed -n '2235,2270p' /tmp/krf-v4/scripts/Level.as | nl -ba -v2235
            echo
            echo '=== LEVEL6 BOSS CORE ==='
            sed -n '175,225p' /tmp/krf-v4/scripts/Level6.as | nl -ba -v175
            echo
            echo '=== LEVEL11 BOSS CORE ==='
            sed -n '215,275p' /tmp/krf-v4/scripts/Level11.as | nl -ba -v215
            echo
            echo '=== LEVEL15 BOSS CORE ==='
            sed -n '275,335p' /tmp/krf-v4/scripts/Level15.as | nl -ba -v275
            echo
            echo '=== SPECIAL TOWER CLASSES ==='
          } >> "$report"
          grep -l 'SPECIAL_' /tmp/krf-v4/scripts/*.as 2>/dev/null | while IFS= read -r f; do
            if grep -qE 'extends .*_-5u|extends Tower' "$f"; then
              echo >> "$report"
              echo "----- ${f#/tmp/krf-v4/} -----" >> "$report"
              grep -nE 'public class|public function|SPECIAL_|pName|tName|getInfo' "$f" | sed -n '1,120p' >> "$report" || true
            fi
          done
          {
            echo
            echo '=== V4 TOWERHOLDER SPECIAL BLOCK ==='
            sed -n '220,390p' /tmp/krf-v4/scripts/TowerHolder.as | nl -ba -v220
          } >> "$report"
          wc -l "$report"

      - name: Commit target report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/v4-final-targets.txt
          git commit -m 'Extract final V4 patch targets [skip ci]' || exit 0
          git pull --rebase origin agent/iphone-performance-selector-completeness
          git push origin HEAD:agent/iphone-performance-selector-completeness
