name: Finalize V4 repository cleanup

on:
  pull_request:
    branches:
      - main
    types: [reopened]
    paths:
      - '.github/workflows/publish-unlock-all.yml'

permissions:
  contents: write

jobs:
  cleanup-v4:
    if: github.head_ref == 'agent/v4-frontiers-fixes'
    runs-on: ubuntu-latest
    steps:
      - name: Check out V4 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Update installer copy and integrity hash
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('mod/index.html')
          text = p.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '<p><strong>V4</strong> is the recommended build. It keeps the V3 sandbox tools, adds per-hero selection and max/reset trees, expands special towers, improves wave dispatch stability, and tightens touch handling.</p>',
              '<p><strong>V4</strong> is the recommended build. It keeps the V3 sandbox tools, starts heroes/stars maxed with a persistent reset-to-custom mode, adds per-hero level toggles, expands the special-tower catalog, improves swarm performance, and tightens touch handling.</p>',
              'V4 intro',
          )
          replace_once(
              '<li><strong>Heroes:</strong> the pause tools now have individual ON/OFF toggles for all <strong>9 hero implementations present in this Flash build</strong>: Alric, Mirage, Captain Blackthorne, Cronan, Sha\'tra, Grawl, Nivus, Dierdre and Ashbite.</li>',
              '<li><strong>Heroes:</strong> the pause tools have individual ON/OFF toggles for all <strong>9 hero implementations present in this Flash build</strong>: Alric, Mirage, Captain Blackthorne, Cronan, Sha\'tra, Grawl, Nivus, Dierdre and Ashbite. All 9 start ON in a level; toggle any hero off or back on for that level.</li>',
              'hero copy',
          )
          replace_once(
              '<li><strong>Maxed by default:</strong> a session starts with all six star-upgrade trees and every hero skill tree maxed. Use <strong>Trees: MAXED (reset)</strong> to reset everything and receive the exact spendable stars/hero points again; press it again to max them.</li>',
              '<li><strong>Maxed by default:</strong> new and existing saves default to all 65 star upgrades spent/maxed and every hero at level 10 with all hero skills maxed. Press <strong>RESET FOR CUSTOM</strong> to clear upgrade/skill spending while keeping the full 65-star pool and level-10 heroes; custom mode persists so your manual choices are not overwritten. Use <strong>MAX ALL</strong> to return to the default maxed mode.</li>',
              'max/reset copy',
          )
          replace_once(
              '<li><strong>Special towers:</strong> the radial page expands from 2 to <strong>8 buildable choices</strong>: Dwarf Riflemen, Pirate Barracks, Crossbow Fort, Tribal Axethrowers, Archmage, Necromancer, DWAARP and Battle-Mecha T200. Dwarf/Pirate placements now have explicit costs; the six advanced towers use their built-in game costs.</li>',
              '<li><strong>Special towers:</strong> the catalog has <strong>9 buildable choices</strong>: Dwarf Bastion (250), Pirate Barracks (180), Dwarf Hall (225), Crossbow Fort, Tribal Axethrowers, Archmage, Necromancer, DWAARP and Battle-Mecha T200. The six advanced specializations use their native in-game costs.</li>',
              'tower catalog copy',
          )
          replace_once(
              '<li><strong>Tower placement:</strong> special towers now use the same +36px holder adjustment as normal towers, fixing the half-tile-high placement.</li>',
              '<li><strong>Tower placement:</strong> map-special towers use the corrected build-spot center instead of the old offset placement.</li>',
              'tower placement copy',
          )
          replace_once(
              '<li><strong>Touch + performance:</strong> V4 pause buttons respond on press, the player is re-focused on pointer-down, touch devices use medium render quality, and a leaked TowerHolder mouse listener is cleaned up correctly.</li>',
              '<li><strong>Touch + performance:</strong> pause buttons, radial items and all three map-special towers respond on press; the player is re-focused on pointer-down. High-entity play reuses child snapshots instead of allocating per-tick Dictionaries and throttles cosmetic layers only when entity/bullet counts are high, while gameplay updates stay full-rate.</li>',
              'touch/performance copy',
          )
          replace_once(
              "On an empty build spot, use <strong>More…</strong> to reach the two special-tower pages.",
              "On an empty build spot, use <strong>More…</strong> to reach the three special-tower pages.",
              'special pages copy',
          )

          old_hash = 'd603b4d554347e0c55964061607d6524dc7d7eae53d44966347006be0487c0f1'
          new_hash = '9744706b367e5b2fb36947614cd92f4957a87db1832a10b058477cf313930bdb'
          hash_count = text.count(old_hash)
          if hash_count != 2:
              raise SystemExit(f'V4 hash: expected two old hashes, found {hash_count}')
          text = text.replace(old_hash, new_hash)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary V4 build files and restore normal workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch .github/v4-finalize.py .github/workflows/v4-finalize-ready.yml assets/V4-FINALIZE-FAIL.txt
          git checkout origin/main -- .github/workflows/publish-unlock-all.yml

      - name: Commit clean final V4 PR
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mod/index.html .github/workflows/publish-unlock-all.yml
          git commit -m 'Finalize V4 installer and clean build scaffolding [skip ci]'
          git pull --rebase origin agent/v4-frontiers-fixes
          git push origin HEAD:agent/v4-frontiers-fixes
