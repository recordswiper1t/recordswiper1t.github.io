name: Verify Epic War 5 Expansion V3.2

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/verify-epicwar5-expansion-v32.yml'
      - 'tools/epicwar5/expansion/**'
      - 'epicwar5-expansion/**'
  push:
    branches:
      - epicwar5-expansion-v32-polish
    paths:
      - '.github/workflows/verify-epicwar5-expansion-v32.yml'
      - 'tools/epicwar5/expansion/**'
      - 'epicwar5-expansion/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: epicwar5-expansion-v32-polish
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download exact game and FFDec
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/ew5 /tmp/ffdec
          curl -fL --retry 3 --connect-timeout 20 'https://cache.armorgames.com/files/games/epic-war-5-12518.swf' -o /tmp/ew5/original.swf
          test "$(sha256sum /tmp/ew5/original.swf | cut -d' ' -f1)" = '848d173b5cba7ebc321ba6dc374389e038924e32cb4a42b0d1b31f51c0b71bb8'
          curl -fL --retry 3 'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          unzip -q /tmp/ffdec.zip -d /tmp/ffdec
      - name: Export and apply V3 + V3.1 + V3.2
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/ew5/export /tmp/ew5/out /tmp/ew5/verify
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 -export script /tmp/ew5/export /tmp/ew5/original.swf > /tmp/ew5/export.log 2>&1 || true
          python3 tools/epicwar5/expansion/build_expansion_storage_v3.py /tmp/ew5/export
          python3 tools/epicwar5/expansion/patch_progression_curve_v3.py /tmp/ew5/export
          python3 tools/epicwar5/expansion/patch_formation_army_pages_v3.py /tmp/ew5/export
          python3 tools/epicwar5/expansion/patch_equipment_slots_v3.py /tmp/ew5/export
          python3 tools/epicwar5/expansion/patch_catalog_compat_v3.py /tmp/ew5/export
          python3 tools/epicwar5/expansion/patch_expansion_equipment_catalog_v3.py /tmp/ew5/export
          python3 tools/epicwar5/expansion/patch_advanced_upgrades_v3.py /tmp/ew5/export
          python3 tools/epicwar5/expansion/patch_battle_rewards_v3.py /tmp/ew5/export
          python3 tools/epicwar5/expansion/patch_battle_12_units_v3.py /tmp/ew5/export
          python3 tools/epicwar5/expansion/patch_progression_enforcement_v3.py /tmp/ew5/export
          python3 tools/epicwar5/expansion/patch_expansion_campaign_v3.py /tmp/ew5/export
          python3 tools/epicwar5/expansion/patch_campaign_newline_compat_v3.py /tmp/ew5/export
          python3 tools/epicwar5/expansion/patch_polish_compat_v31.py /tmp/ew5/export
          python3 tools/epicwar5/expansion/patch_polish_v31.py /tmp/ew5/export
          python3 tools/epicwar5/expansion/patch_polish_v32.py /tmp/ew5/export
          python3 tools/epicwar5/expansion/patch_advanced_identity_v32.py /tmp/ew5/export
      - name: Rebuild V3.2 SWF
        shell: bash
        run: |
          set -euxo pipefail
          if ! java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror abort -importScript /tmp/ew5/original.swf /tmp/ew5/out/epic-war-5-expansion-v32.swf /tmp/ew5/export > /tmp/ew5/import.log 2>&1; then
            echo '===== FFDec import diagnostics ====='
            cat /tmp/ew5/import.log
            exit 1
          fi
          test -s /tmp/ew5/out/epic-war-5-expansion-v32.swf
      - name: Re-decompile and verify V3.2 markers
        shell: bash
        run: |
          set -euxo pipefail
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 -export script /tmp/ew5/verify /tmp/ew5/out/epic-war-5-expansion-v32.swf > /tmp/ew5/verify.log 2>&1 || true
          d=/tmp/ew5/verify/scripts/Game/Manager/DataManager.as
          f=/tmp/ew5/verify/scripts/Game/Interface/WorldMapFormation.as
          a=/tmp/ew5/verify/scripts/Game/Interface/WorldMapFormationAcc.as
          s=/tmp/ew5/verify/scripts/Game/Interface/WorldMapFormationSkill.as
          c=/tmp/ew5/verify/scripts/Game/System/StatDef/CharTotalStat.as
          ca=/tmp/ew5/verify/scripts/Game/System/StatDef/CharAbilityStat.as
          ci=/tmp/ew5/verify/scripts/Game/System/StatDef/CharItemStat.as
          r=/tmp/ew5/verify/scripts/Game/Interface/BattleResult.as
          e=/tmp/ew5/verify/scripts/Game/System/Battle/BattleControlEnemy.as
          w=/tmp/ew5/verify/scripts/Game/Interface/WorldMap.as
          grep -F 'if(CLEARS >= 45)' "$d"
          grep -F 'expansionUpgradeCostMultiplier' "$d"
          grep -F 'expansionNextArmyUnlockClear' "$d"
          grep -F 'expansionUpgradeCostMultiplier(MATCH_NUM)' "$s"
          grep -F 'Advanced 10-18' "$s"
          grep -F 'army slots 7-12 unlock later' "$f"
          grep -F 'next " + next' "$f"
          grep -F 'case 10:' "$c"
          grep -F 'return [20,46,52,15,47,39,37,48,35]' "$c"
          grep -F 'return [20,29,69,15,39,53,37,38,75]' "$c"
          grep -F 'return [20,46,71,15,47,72,42,48,73]' "$c"
          grep -F 'return [15,25,71,36,72,73,38,74,77]' "$c"
          grep -F 'return [20,25,35,36,38,39,40,41,43]' "$c"
          if grep -Fq 'expansionPolishTree' "$c"; then echo 'generic tree helper unexpectedly survived' >&2; exit 1; fi
          grep -F 'Health +35%, defense +12%' "$ca"
          grep -F 'All resistance, health +10%, damage -15%' "$ca"
          grep -F 'Damage +25%, health +25%, defense +15%, regen +75' "$ca"
          grep -F 'All resistance, health +10%, damage -15%' "$ci"
          grep -F 'expansionItemEquippedInOtherSlot' "$a"
          grep -F 'already equipped in another gear slot' "$a"
          grep -F 'firstClear:Boolean' "$e"
          grep -F '135 + tier * 15' "$e"
          grep -F 'firstClear ? String(rewardNames[index]) : ""' "$e"
          grep -F 'if(tier >= 9)' "$e"
          grep -F 'if(tier >= 17)' "$e"
          grep -F 'if(tier >= 21)' "$e"
          grep -F 'itemGetValue(itemReward) + 1,99' "$r"
          grep -F '"\\nT" + threat' "$w"
      - name: Upload verified V3.2 build
        uses: actions/upload-artifact@v4
        with:
          name: epicwar5-expansion-v32-verified
          retention-days: 7
          path: |
            /tmp/ew5/out/epic-war-5-expansion-v32.swf
            /tmp/ew5/import.log
            /tmp/ew5/verify.log
