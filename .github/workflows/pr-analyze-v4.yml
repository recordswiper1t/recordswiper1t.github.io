name: PR Analyze Frontiers v4

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  analyze:
    if: github.head_ref == 'agent/v4-frontiers-fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - id: guard
        name: Skip after report is committed
        shell: bash
        run: |
          if [ -f analysis/v4-selected.txt ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - if: steps.guard.outputs.skip != 'true'
        name: Download FFDec
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          mkdir -p /tmp/ffdec
          unzip -q /tmp/ffdec.zip -d /tmp/ffdec
          test -f /tmp/ffdec/ffdec.jar

      - if: steps.guard.outputs.skip != 'true'
        name: Export current V3 ActionScript and select controllers
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v4scripts
          mkdir -p /tmp/v4scripts analysis
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 -export script /tmp/v4scripts assets/kingdom-rush-frontiers-v3.swf > /tmp/v4-export.log 2>&1 || true
          test -d /tmp/v4scripts/scripts
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('/tmp/v4scripts/scripts')
          files = []
          for p in root.rglob('*.as'):
              try:
                  text = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              files.append((p, text))

          categories = {
              'pause_settings': ['onPause','pause(','unPause','resume','restart','quit','settings','sound','music','sandbox'],
              'hero_selection_spawn': ['selectedHero','heroPortrait','SoldierHero','heroDied','heroLevel','heroes','hero'],
              'hero_currency': ['skillPoints','calculateTotalCost','updateCosts','heroSkill','points'],
              'upgrade_stars': ['MenuUpgrades','gameUpgrades','stars','archersUpLevel','barracksUpLevel','magesUpLevel','engineersUpLevel','rainUpLevel','reinforcementLevel'],
              'wave_dispatch': ['indexWaves','activeWaves','maxWaves','Wave(','intervalWave','sendWave','nextWave','waveFlag','wave'],
              'cash_gold': ['updateCash','this.cash','cash +=','cash -=','gold','coins'],
              'tower_build_menu': ['quickMenu','TowerHolder','buildTower','towerName','TowerDwarfRiflemen','TowerSoldierPirates','cost'],
              'tower_positioning': ['this.x','this.y','holder','cTower','tower.x','tower.y','position'],
              'input': ['MouseEvent','TouchEvent','Multitouch','stageX','stageY','CLICK','MOUSE_DOWN','MOUSE_UP'],
              'performance_cleanup': ['removeChild','dispose','destroy','removeEventListener','ENTER_FRAME','activeWaves','enemies','bullets']
          }

          explicit_names = {
              'Level.as','TowerHolder.as','MenuUpgrades.as','GameUpgrades.as',
              '§_-2i§.as','§_-BQ§.as','§_-LZ§.as','§_-8a§.as'
          }

          selected = set()
          report = ['=== Frontiers v4 targeted source selection from current V3 ===', '']

          for cat, pats in categories.items():
              scored = []
              for p, text in files:
                  score = sum(1 for pat in pats if pat in text)
                  if score:
                      scored.append((score, p, text))
              scored.sort(key=lambda x: (-x[0], len(x[2]), str(x[1])))
              report.append(f'===== CATEGORY {cat} =====')
              for score, p, text in scored[:18]:
                  rel = p.relative_to(root)
                  report.append(f'{score}\t{rel}\t{len(text)} bytes')
                  if score >= 2:
                      selected.add(p)
              report.append('')

          tower_classes = []
          hero_classes = []
          enemy_classes = []
          for p, text in files:
              rel = p.relative_to(root)
              for m in re.finditer(r'public\s+class\s+([A-Za-z0-9_§$-]+)', text):
                  name = m.group(1)
                  if name.startswith('Tower'):
                      tower_classes.append((name, str(rel)))
                  elif 'Hero' in name or name.startswith('SoldierHero'):
                      hero_classes.append((name, str(rel)))
                  elif name.startswith('Enemy'):
                      enemy_classes.append((name, str(rel)))
              if p.name in explicit_names:
                  selected.add(p)

          report.append('===== TOWER CLASS INVENTORY =====')
          for name, rel in sorted(set(tower_classes)):
              report.append(f'{name}\t{rel}')
          report.append('')
          report.append('===== HERO CLASS INVENTORY =====')
          for name, rel in sorted(set(hero_classes)):
              report.append(f'{name}\t{rel}')
          report.append('')
          report.append('===== ENEMY CLASS INVENTORY (first 250) =====')
          for name, rel in sorted(set(enemy_classes))[:250]:
              report.append(f'{name}\t{rel}')
          report.append('')

          report.append('===== FULL SELECTED SOURCES =====')
          for p in sorted(selected, key=lambda x: str(x)):
              text = p.read_text(encoding='utf-8')
              if len(text) > 220000:
                  report.append(f'\n===== {p.relative_to(root)} (OMITTED: {len(text)} bytes) =====')
                  continue
              report.extend(['', f'===== {p.relative_to(root)} =====', text])

          out = Path('analysis/v4-selected.txt')
          out.write_text('\n'.join(report), encoding='utf-8')
          print('ActionScript files:', len(files))
          print('Selected source files:', len(selected))
          print('Report bytes:', out.stat().st_size)
          PY

      - if: steps.guard.outputs.skip != 'true'
        name: Commit analysis report to PR branch
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/v4-selected.txt
          git commit -m 'Add Frontiers v4 source selection [skip ci]' || exit 0
          git pull --rebase origin "${TARGET_BRANCH}"
          git push origin HEAD:"${TARGET_BRANCH}"

      - name: Upload export log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v4-analysis-log
          path: /tmp/v4-export.log
          if-no-files-found: ignore
          retention-days: 1
