name: Analyze Frontiers v4

on:
  push:
    branches:
      - agent/v4-frontiers-fixes
    paths:
      - '.github/workflows/pr-analyze-v4.yml'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download FFDec
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          mkdir -p /tmp/ffdec
          unzip -q /tmp/ffdec.zip -d /tmp/ffdec
          test -f /tmp/ffdec/ffdec.jar

      - name: Export current V3 ActionScript and write compact source reports
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v4scripts analysis/v4-core analysis/v4-inventory.txt analysis/v4-snippets.txt
          mkdir -p /tmp/v4scripts analysis/v4-core
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 -export script /tmp/v4scripts assets/kingdom-rush-frontiers-v3.swf > /tmp/v4-export.log 2>&1 || true
          test -d /tmp/v4scripts/scripts
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil

          root = Path('/tmp/v4scripts/scripts')
          files = []
          for p in root.rglob('*.as'):
              try:
                  text = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              files.append((p, text))

          # Copy the exact controllers V3 verified, plus upgrade/currency controllers,
          # into small repository files that can be reviewed directly.
          wanted = {
              'Level.as': 'Level.as.txt',
              'TowerHolder.as': 'TowerHolder.as.txt',
              'MenuUpgrades.as': 'MenuUpgrades.as.txt',
              'GameUpgrades.as': 'GameUpgrades.as.txt',
              '§_-2i§.as': 'pause-obfuscated.as.txt',
              '§_-BQ§.as': 'wave-ui-obfuscated.as.txt',
              '§_-LZ§.as': 'tower-menu-obfuscated.as.txt',
              '§_-8a§.as': 'hero-currency-obfuscated.as.txt',
          }
          found = {}
          for p, text in files:
              if p.name in wanted and p.name not in found:
                  dst = Path('analysis/v4-core') / wanted[p.name]
                  dst.write_text(text, encoding='utf-8')
                  found[p.name] = str(p.relative_to(root))

          # Inventory every public class so we can enumerate all built-in special heroes/towers.
          towers, heroes, allclasses = [], [], []
          class_re = re.compile(r'public\s+(?:final\s+)?class\s+([A-Za-z0-9_§$-]+)')
          for p, text in files:
              rel = str(p.relative_to(root))
              for m in class_re.finditer(text):
                  name = m.group(1)
                  allclasses.append((name, rel))
                  if name.startswith('Tower'):
                      towers.append((name, rel))
                  if 'Hero' in name or name.startswith('SoldierHero') or 'hero' in rel.lower():
                      heroes.append((name, rel))

          inv = ['=== EXACT CORE FILES ===']
          for src, dst in wanted.items():
              inv.append(f'{src}\t{found.get(src, "NOT FOUND")}\tanalysis/v4-core/{dst}')
          inv += ['', '=== TOWER CLASSES ===']
          inv += [f'{name}\t{rel}' for name, rel in sorted(set(towers))]
          inv += ['', '=== HERO-RELATED CLASSES ===']
          inv += [f'{name}\t{rel}' for name, rel in sorted(set(heroes))]
          Path('analysis/v4-inventory.txt').write_text('\n'.join(inv) + '\n', encoding='utf-8')

          # Compact context snippets around the exact behaviors requested for V4.
          patterns = [
              'qol_', 'selectedHero', 'SoldierHero', 'skillPoints', 'calculateTotalCost',
              'archersUpLevel', 'stars', 'indexWaves', 'activeWaves', 'maxWaves',
              'intervalWave', 'Wave(', 'updateCash', 'cash +=', 'cash -=',
              'TowerDwarfRiflemen', 'TowerSoldierPirates', 'quickMenu', 'cTower',
              'MouseEvent', 'TouchEvent', 'stageX', 'stageY', 'removeChild', 'ENTER_FRAME'
          ]
          out = []
          for pat in patterns:
              out.append(f'===== {pat} =====')
              hits = 0
              for p, text in files:
                  lines = text.splitlines()
                  for i, line in enumerate(lines):
                      if pat not in line:
                          continue
                      rel = p.relative_to(root)
                      out.append(f'--- {rel}:{i+1} ---')
                      a, b = max(0, i-8), min(len(lines), i+9)
                      for j in range(a, b):
                          out.append(f'{j+1:05d}: {lines[j]}')
                      hits += 1
                      if hits >= 16:
                          break
                  if hits >= 16:
                      break
              out.append('')
          Path('analysis/v4-snippets.txt').write_text('\n'.join(out), encoding='utf-8')

          print('ActionScript files:', len(files))
          print('Core files found:', found)
          print('Tower classes:', len(set(towers)))
          print('Hero-related classes:', len(set(heroes)))
          PY

      - name: Commit compact analysis to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/v4-core analysis/v4-inventory.txt analysis/v4-snippets.txt
          git commit -m 'Add compact Frontiers v4 controller analysis [skip ci]' || exit 0
          git pull --rebase origin agent/v4-frontiers-fixes
          git push origin HEAD:agent/v4-frontiers-fixes

      - name: Upload export log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v4-analysis-log
          path: /tmp/v4-export.log
          if-no-files-found: ignore
          retention-days: 1
