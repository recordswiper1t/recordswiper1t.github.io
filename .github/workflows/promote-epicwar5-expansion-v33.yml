name: Promote Verified Epic War 5 Expansion V3.3

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/promote-epicwar5-expansion-v33.yml'

permissions:
  actions: read
  contents: write

jobs:
  promote:
    if: github.head_ref == 'epicwar5-expansion-v33-polish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: epicwar5-expansion-v33-polish
          fetch-depth: 0
      - name: Download already-verified V3.3 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/v33
          gh run download 32552291727 --repo "$GITHUB_REPOSITORY" --name epicwar5-expansion-v33-verified --dir /tmp/v33
          SWF="$(find /tmp/v33 -type f -name 'epic-war-5-expansion-v33.swf' -print -quit)"
          test -n "$SWF"
          test -s "$SWF"
          printf '%s\n' "$SWF" > /tmp/v33-swf-path
      - name: Stage exact verified release
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p assets
          SWF="$(cat /tmp/v33-swf-path)"
          cp "$SWF" assets/epic-war-5-expansion-v33.swf
          HASH="$(sha256sum assets/epic-war-5-expansion-v33.swf | cut -d' ' -f1)"
          printf '%s  assets/epic-war-5-expansion-v33.swf\n' "$HASH" > assets/EPICWAR5-EXPANSION-V33-SHA256SUMS.txt
          cat > assets/EPICWAR5-EXPANSION-V33-BUILD.txt <<EOF
          Epic War 5 — Expansion V3.3 Performance + Quality
          Source: canonical Armor Games SWF SHA-256 848d173b5cba7ebc321ba6dc374389e038924e32cb4a42b0d1b31f51c0b71bb8
          Toolchain: FFDec 26.2.1
          Verified workflow run: 32552291727
          Release SWF SHA-256: $HASH

          Performance-first changes:
          - Broad-phase character collision/target filtering before Flash hit-tests.
          - Incremental unit depth insertion replaces full battlefield sort/allocation on every spawn.
          - Staggered health-bar, player counter and wave-count refreshes while simulation remains per-frame.
          - Enemy-wave count scans no longer re-command every wave unit.
          - Expansion disposable-wave caps reduced to 16-22 per controller while bosses/elites stay intact.
          - Weather particle budgets sharply reduced; heavy-load mode reduces them further.
          - Off-camera/transient effects, damage text and blood splats are culled/capped.
          - Adaptive Flash render quality engages only under very heavy display-list load and restores automatically.

          Quality/content changes:
          - Repairs old Expansion relic ownership values so earned gear is actually selectable.
          - Correct ownership semantics for future first-clear relic rewards.
          - Adds Field Standard at 45 unique clears and Conqueror Medal at 50 unique clears.
          - Equipment catalog: 55 -> 57 (+3.6%); no new stages, units, army slots or upgrade slots.
          - V3.2 progression, role-specific advanced trees, threat bands and gear tradeoffs are preserved.

          Verification:
          - Exact V3.2 baseline rebuilt from the canonical SWF and re-decompiled.
          - V3.3 applied to that compiled V3.2 source.
          - FFDec V3.3 import succeeded.
          - Re-decompiled V3.3 passed all performance/fix regression markers.
          EOF
      - name: Commit verified V3.3 binary
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/epic-war-5-expansion-v33.swf assets/EPICWAR5-EXPANSION-V33-BUILD.txt assets/EPICWAR5-EXPANSION-V33-SHA256SUMS.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish Epic War 5 Expansion V3.3 [skip ci]'
          git push origin HEAD:epicwar5-expansion-v33-polish

# Promotion retry: use recursive artifact discovery after successful V3.3 verification.
