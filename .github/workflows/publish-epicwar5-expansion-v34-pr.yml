name: Promote Epic War 5 Expansion V3.4 PR Artifact

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/publish-epicwar5-expansion-v34-pr.yml'

permissions:
  contents: write

jobs:
  promote-v34:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: epicwar5-expansion-runtime-sandbox
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Rebuild and reverify exact candidate
        shell: bash
        run: |
          set -euxo pipefail
          test "$(sha256sum assets/epic-war-5-expansion-v331.swf | cut -d' ' -f1)" = '40712cc3685861ee93a97ad49cd4ff71c2ebc55c9959a1d9f160fcf39e8d6577'
          mkdir -p /tmp/ffdec /tmp/v34/src /tmp/v34/out /tmp/v34/verify
          curl -fL --retry 3 'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          unzip -q /tmp/ffdec.zip -d /tmp/ffdec
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 -export script /tmp/v34/src assets/epic-war-5-expansion-v331.swf >/tmp/v34/export.log 2>&1 || true
          python3 tools/epicwar5/expansion/patch_runtime_sandbox_v34.py /tmp/v34/src
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror abort -importScript assets/epic-war-5-expansion-v331.swf /tmp/v34/out/epic-war-5-expansion-v34.swf /tmp/v34/src >/tmp/v34/import.log 2>&1
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 -export script /tmp/v34/verify /tmp/v34/out/epic-war-5-expansion-v34.swf >/tmp/v34/verify.log 2>&1 || true
          python3 tools/epicwar5/expansion/validate_v34_invariants.py /tmp/v34/verify
          wm=/tmp/v34/verify/scripts/Game/Interface/WorldMap.as
          bs=/tmp/v34/verify/scripts/Game/System/Battle/BattleSystem.as
          grep -F 'if(this.expansionPendingStage > 0)' "$wm"
          grep -F 'sandboxMaster:Boolean = false' "$bs"
          grep -F 'recordswiper1t.github.io' /tmp/v34/verify/scripts/Game/Manager/HostManager.as
      - name: Stage and push exact verified V3.4
        shell: bash
        run: |
          set -euxo pipefail
          cp /tmp/v34/out/epic-war-5-expansion-v34.swf assets/epic-war-5-expansion-v34.swf
          HASH="$(sha256sum assets/epic-war-5-expansion-v34.swf | cut -d' ' -f1)"
          printf '%s  assets/epic-war-5-expansion-v34.swf\n' "$HASH" > assets/EPICWAR5-EXPANSION-V34-SHA256SUMS.txt
          cat > assets/EPICWAR5-EXPANSION-V34-BUILD.txt <<EOF
          Epic War 5 — Expansion V3.4 — Runtime Repair + Optional Sandbox
          Baseline V3.3.1 SHA-256: 40712cc3685861ee93a97ad49cd4ff71c2ebc55c9959a1d9f160fcf39e8d6577
          Toolchain: FFDec 26.2.1
          Release SWF SHA-256: $HASH

          Runtime repair:
          - Expansion stage clicks queue battle selection and transition from WorldMap ENTER_FRAME, matching stock EW5 lifecycle.
          - The click handler no longer constructs battle_mc or destroys WorldMap synchronously.
          - GitHub Pages HostManager authorization remains intact.

          Optional sandbox (OFF by default):
          - Backtick toggles sandbox master.
          - F1 mana; F2/F3 unit; F4 ally; F5 enemy; F6 batch; F7 speed; F8 wipe; F9 win; F10 heal; F11 free spells; F12 fast units.
          - U building cap; O population boost; [ / ] mana amount; H HUD.
          - Native B retreat and P pause controls are not overridden.
          - No max-all/save rewrite helper is added.

          Verification:
          - Exact V3.3.1 decompiled, patched, FFDec-rebuilt and re-decompiled.
          - V3.4 transition and default-OFF sandbox markers survived rebuild.
          - Frozen V3.3 progression/save/stage/reward/balance/performance invariants all passed; only the obsolete V3.3 HTML filename freeze was excluded.
          EOF
          sed -i 's/^          //' assets/EPICWAR5-EXPANSION-V34-BUILD.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/epic-war-5-expansion-v34.swf assets/EPICWAR5-EXPANSION-V34-BUILD.txt assets/EPICWAR5-EXPANSION-V34-SHA256SUMS.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish Epic War 5 Expansion V3.4 runtime sandbox [skip ci]'
          git push origin HEAD:epicwar5-expansion-runtime-sandbox
