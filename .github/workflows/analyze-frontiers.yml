name: Analyze Frontiers Tower Scripts

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-frontiers.yml'
      - 'assets/kingdom-rush-frontie-15717.swf'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download FFDec 26.2.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          mkdir -p /tmp/ffdec
          unzip -q /tmp/ffdec.zip -d /tmp/ffdec
          test -f /tmp/ffdec/ffdec.jar

      - name: Export ActionScript
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/krf-scripts
          mkdir -p /tmp/krf-scripts
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar \
            -onerror ignore -timeout 60 -exportFileTimeout 120 \
            -export script /tmp/krf-scripts assets/kingdom-rush-frontie-15717.swf \
            > /tmp/ffdec-export.log 2>&1 || true
          count=$(find /tmp/krf-scripts -type f | wc -l | tr -d ' ')
          echo "Exported files: $count"
          test "$count" -gt 0

      - name: Build compact tower index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p analysis
          report='analysis/tower-index.txt'
          : > "$report"
          {
            echo 'Kingdom Rush Frontiers tower-script index'
            echo 'Source: assets/kingdom-rush-frontie-15717.swf'
            echo "Generated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo '=== likely tower-related source files ==='
          } >> "$report"

          pattern='tower|archer|barrack|mage|artillery|crossbow|templar|assassin|necromancer|dwaarp|mecha|tesla|archmage|axe.?throw|totem|falconer'
          grep -RilE "$pattern" /tmp/krf-scripts 2>/dev/null \
            | sed 's#^/tmp/krf-scripts/##' \
            | sort -u \
            | head -n 500 >> "$report" || true

          {
            echo
            echo '=== matching declarations/stat lines (trimmed) ==='
          } >> "$report"
          grep -RniE 'class .*Tower|tower|archer|barrack|mage|artillery|crossbow|templar|assassin|necromancer|dwaarp|mecha|tesla|archmage|axe.?throw|totem|falconer|damage|minDamage|maxDamage|range|reload|cooldown|fireRate|attackRate|price|cost' /tmp/krf-scripts 2>/dev/null \
            | sed 's#^/tmp/krf-scripts/##' \
            | cut -c1-260 \
            | head -n 6000 >> "$report" || true

          {
            echo
            echo '=== FFDec export tail ==='
            tail -n 80 /tmp/ffdec-export.log || true
          } >> "$report"

          wc -l "$report"

      - name: Build unlock source report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('/tmp/krf-scripts')
          out = Path('analysis/unlock-index.txt')
          strong = ['selectedHero', 'heroPrices', 'unlockMax', 'purchases', 'purchaseHero', 'heroSku', 'isPremium', 'premiumHero', 'heroLocked', 'heroUnlocked']
          name_keep = {'Level.as','MainMenu.as','ButPremiumContentMainMenu.as','AgiV2Handler.as'}
          chosen = []
          for p in root.rglob('*.as'):
              try:
                  text = p.read_text(errors='replace')
              except Exception:
                  continue
              hits = [s for s in strong if s in text]
              is_level = p.name == 'Level.as' or (p.name.startswith('Level') and p.name[5:-3].isdigit())
              if hits or is_level or p.name in name_keep:
                  chosen.append((p, text, hits))

          with out.open('w', encoding='utf-8') as f:
              f.write('Kingdom Rush Frontiers unlock-source report\n')
              f.write('Source: assets/kingdom-rush-frontie-15717.swf\n\n')
              f.write('=== FILE LIST ===\n')
              for p,text,hits in sorted(chosen, key=lambda x: str(x[0])):
                  rel = p.relative_to(root)
                  f.write(f'{rel}\t{", ".join(hits)}\n')
              f.write('\n=== FULL SOURCES ===\n')
              for p,text,hits in sorted(chosen, key=lambda x: str(x[0])):
                  rel = p.relative_to(root)
                  f.write(f'\n\n===== {rel} =====\n')
                  f.write(text)
                  if not text.endswith('\n'):
                      f.write('\n')
          print(f'Wrote {len(chosen)} source files to {out}')
          PY
          wc -c analysis/unlock-index.txt

      - name: Commit analysis indexes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/tower-index.txt analysis/unlock-index.txt
          if git diff --cached --quiet; then
            echo 'Analysis indexes unchanged.'
            exit 0
          fi
          git commit -m 'Index Frontiers tower and unlock scripts'
          git push
