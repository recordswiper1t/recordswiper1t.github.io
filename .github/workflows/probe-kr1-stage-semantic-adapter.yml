name: Test semantic KR1 Level adapter on all 19 stages

on:
  push:
    branches: [agent/v13-kingdom-rush-ultimate-clean]
    paths:
      - 'tools/ultimate/build_level_adapter_from_namespaced_source.py'
      - 'tools/ultimate/stage_api_matrix.py'
      - 'tools/ultimate/rebind_namespaced_scripts.py'
      - '.github/workflows/probe-kr1-stage-semantic-adapter.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/ultimate/build_level_adapter_from_namespaced_source.py'
      - 'tools/ultimate/stage_api_matrix.py'
      - 'tools/ultimate/rebind_namespaced_scripts.py'
      - '.github/workflows/probe-kr1-stage-semantic-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch sources and FFDec
        run: |
          set -euo pipefail
          python3 -m py_compile tools/ultimate/build_level_adapter_from_namespaced_source.py
          mkdir -p /tmp/u /tmp/ffdec /tmp/u/kr1-src /tmp/u/krf-src /tmp/u/report
          curl -fL --retry 4 --retry-all-errors \
            'https://cache.armorgames.com/files/games/kingdom-rush-12141.swf' -o /tmp/u/kr1.swf
          curl -fL --retry 4 \
            'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          unzip -q /tmp/ffdec.zip -d /tmp/ffdec
          if [ -s assets/kingdom-rush-frontiers-v12-1.swf ]; then
            echo 'KRF_BASE=assets/kingdom-rush-frontiers-v12-1.swf' >> "$GITHUB_ENV"
            echo 'HAS_V121=1' >> "$GITHUB_ENV"
          elif [ -s assets/kingdom-rush-frontiers-v12.swf ]; then
            echo 'KRF_BASE=assets/kingdom-rush-frontiers-v12.swf' >> "$GITHUB_ENV"
            echo 'HAS_V121=0' >> "$GITHUB_ENV"
          else
            echo 'KRF_BASE=assets/kingdom-rush-frontiers-v11.swf' >> "$GITHUB_ENV"
            echo 'HAS_V121=0' >> "$GITHUB_ENV"
          fi

      - name: Export source trees and build merge policy
        run: |
          set -euo pipefail
          java -Xmx5g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 \
            -export script /tmp/u/kr1-src /tmp/u/kr1.swf >/tmp/u/export-kr1.log 2>&1 || true
          java -Xmx5g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 \
            -export script /tmp/u/krf-src "$KRF_BASE" >/tmp/u/export-krf.log 2>&1 || true
          python3 tools/ultimate/port_plan.py --kr1 /tmp/u/kr1-src/scripts --krf /tmp/u/krf-src/scripts --output /tmp/u/port-plan.json
          python3 tools/ultimate/extract_class_names.py /tmp/u/kr1-src/scripts --prefix KR1__ --output /tmp/u/class-map.json
          python3 tools/ultimate/stage_api_matrix.py \
            --kr1-scripts /tmp/u/kr1-src/scripts --krf-scripts /tmp/u/krf-src/scripts \
            --first 1 --last 19 --output /tmp/u/report/stage-api-matrix.json \
            --union-contract /tmp/u/report/union-level-adapter-contract.json

      - name: Build namespaced structural merge and export it
        run: |
          set -euo pipefail
          java -Xmx6g -jar /tmp/ffdec/ffdec.jar -swf2xml /tmp/u/kr1.swf /tmp/u/kr1.xml
          java -Xmx6g -jar /tmp/ffdec/ffdec.jar -swf2xml "$KRF_BASE" /tmp/u/krf.xml
          python3 tools/ultimate/merge_swf_xml.py \
            --base /tmp/u/krf.xml --source /tmp/u/kr1.xml --class-map /tmp/u/class-map.json \
            --output /tmp/u/merged.xml --report /tmp/u/report/merge-report.json
          java -Xmx9g -jar /tmp/ffdec/ffdec.jar -xml2swf /tmp/u/merged.xml /tmp/u/merged.swf
          mkdir -p /tmp/u/merged-export
          java -Xmx7g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 120 -exportFileTimeout 240 \
            -export script /tmp/u/merged-export /tmp/u/merged.swf >/tmp/u/export-merged.log 2>&1 || true
          test -f /tmp/u/merged-export/scripts/KR1__Level.as

      - name: Generate semantic bridge from namespaced KR1 Level
        run: |
          set -euo pipefail
          python3 tools/ultimate/build_level_adapter_from_namespaced_source.py \
            --namespaced-kr1-level /tmp/u/merged-export/scripts/KR1__Level.as \
            --frontiers-level /tmp/u/krf-src/scripts/Level.as \
            --contract /tmp/u/report/union-level-adapter-contract.json \
            --output /tmp/u/KR1__Level.as \
            --report /tmp/u/report/semantic-adapter-build.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/u/report/semantic-adapter-build.json',encoding='utf-8'))
          assert d['copied_member_count']==37, d
          assert not d['missing_members'], d
          PY

      - name: Rebind all 19 stages while retaining semantic bridge
        run: |
          set -euo pipefail
          python3 tools/ultimate/rebind_namespaced_scripts.py \
            --scripts /tmp/u/merged-export/scripts --plan /tmp/u/port-plan.json \
            --exclude-rebind KR1__Level --output /tmp/u/rebind --report /tmp/u/report/rebind-report.json
          mkdir -p /tmp/u/import/scripts
          cp /tmp/u/KR1__Level.as /tmp/u/import/scripts/KR1__Level.as
          for n in $(seq 1 19); do
            src=$(find /tmp/u/rebind/scripts -name "KR1__Level${n}.as" -print -quit)
            test -n "$src"
            cp "$src" "/tmp/u/import/scripts/KR1__Level${n}.as"
          done

      - name: Compile semantic bridge plus all 19 stages
        id: compile
        shell: bash
        run: |
          set +e
          java -Xmx12g -jar /tmp/ffdec/ffdec.jar -onerror abort \
            -importScript /tmp/u/merged.swf /tmp/u/stages-semantic.swf /tmp/u/import \
            >/tmp/u/import-semantic.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "$code" >/tmp/u/import.exit
          tail -250 /tmp/u/import-semantic.log || true
          exit 0

      - name: Verify semantic bridge after successful compile
        if: steps.compile.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          mkdir -p /tmp/u/verify
          java -Xmx8g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 120 -exportFileTimeout 240 \
            -export script /tmp/u/verify /tmp/u/stages-semantic.swf >/tmp/u/verify.log 2>&1 || true
          grep -F 'class KR1__Level extends Level' /tmp/u/verify/scripts/KR1__Level.as
          for n in $(seq 1 19); do test -f "/tmp/u/verify/scripts/KR1__Level${n}.as"; done
          grep -F 'qolTowerClipboard' /tmp/u/verify/scripts/Level.as
          grep -F 'THE LAST RIFT' /tmp/u/verify/scripts/Level15.as
          if [ "$HAS_V121" = 1 ]; then grep -F 'qolPopupsEnabled' /tmp/u/verify/scripts/Level.as; fi
          python3 - <<'PY'
          import json, pathlib, os
          b=json.load(open('/tmp/u/report/semantic-adapter-build.json',encoding='utf-8'))
          out={
            'compile_success':True,
            'frontiers_base':os.environ.get('KRF_BASE'),
            'source_ready_stages':19,
            'semantic_members_copied':b['copied_member_count'],
            'null_compile_stubs':0,
            'v12_1_polish_preserved':os.environ.get('HAS_V121')=='1',
            'runtime_certification_still_required':True,
          }
          pathlib.Path('/tmp/u/report/semantic-adapter-result.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps(out,indent=2))
          PY

      - name: Record semantic compile failure
        if: steps.compile.outputs.exit_code != '0'
        run: |
          python3 - <<'PY'
          import json, pathlib
          log=pathlib.Path('/tmp/u/import-semantic.log').read_text(encoding='utf-8',errors='replace')
          out={'compile_success':False,'exit_code':int(pathlib.Path('/tmp/u/import.exit').read_text().strip()),'log_tail':'\n'.join(log.splitlines()[-250:])}
          pathlib.Path('/tmp/u/report/semantic-adapter-result.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          PY

      - name: Upload semantic adapter diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kr1-level1-19-semantic-adapter
          path: |
            /tmp/u/report
            /tmp/u/import-semantic.log
            /tmp/u/verify.log
          retention-days: 30

      - name: Require semantic adapter compile
        run: test '${{ steps.compile.outputs.exit_code }}' = '0'
