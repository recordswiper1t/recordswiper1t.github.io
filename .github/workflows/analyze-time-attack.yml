name: Analyze Frontiers time attack hooks

on:
  push:
    branches:
      - agent/time-attack-mode
    paths:
      - '.github/workflows/analyze-time-attack.yml'
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  analyze:
    if: github.event_name == 'push' || github.head_ref == 'agent/time-attack-mode'
    runs-on: ubuntu-latest
    steps:
      - name: Check out analysis branch
        uses: actions/checkout@v4
        with:
          ref: agent/time-attack-mode
          fetch-depth: 1
          sparse-checkout: |
            .github
            analysis
          sparse-checkout-cone-mode: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download current V6 and FFDec
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 'https://raw.githubusercontent.com/recordswiper1t/recordswiper1t.github.io/main/assets/kingdom-rush-frontiers-v5.swf' -o /tmp/krf-v6.swf
          curl -fL --retry 4 'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          mkdir -p /tmp/ffdec
          unzip -q /tmp/ffdec.zip -d /tmp/ffdec
          test -s /tmp/krf-v6.swf
          test -f /tmp/ffdec/ffdec.jar

      - name: Export scripts and capture hooks
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/krf-export
          mkdir -p /tmp/krf-export analysis
          java -Xmx6g -jar /tmp/ffdec/ffdec.jar \
            -onerror ignore -timeout 60 -exportFileTimeout 120 \
            -export script /tmp/krf-export /tmp/krf-v6.swf \
            > /tmp/export.log 2>&1 || true
          test -s /tmp/krf-export/scripts/Enemy.as
          test -s /tmp/krf-export/scripts/Level.as
          {
            echo '=== Enemy.as ==='
            cat /tmp/krf-export/scripts/Enemy.as
            echo
            echo '=== Level.as relevant symbols ==='
            grep -n -E 'qol|function for const|hasEnemies|update\(|onPreWin|default const try|indexWaves|waves|SharedObject|save|levelIndex|level' /tmp/krf-export/scripts/Level.as || true
            echo
            echo '=== SharedObject/save references ==='
            grep -Rni -E 'SharedObject|getLocal\(|flush\(|bestTime|levelIndex|levelId' /tmp/krf-export/scripts --include='*.as' | head -n 1200 || true
          } > analysis/time-attack-context.txt
          cat /tmp/krf-export/scripts/Level.as > analysis/time-attack-level.txt
          {
            for f in EnemyCanibalBeast.as EnemyCanibalHunterUnderwater.as EnemyCanibalUnderwater.as EnemyFinalBossPiece.as EnemySaurianNightscale.as EnemyTremor.as; do
              echo "=== $f ==="
              cat "/tmp/krf-export/scripts/$f"
              echo
            done
          } > analysis/time-attack-overrides.txt

      - name: Commit analysis context
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- analysis/time-attack-context.txt analysis/time-attack-level.txt analysis/time-attack-overrides.txt
          git commit -m 'Capture enemy exit overrides for V7 [skip ci]' || exit 0
          git pull --rebase origin agent/time-attack-mode
          git push origin HEAD:agent/time-attack-mode
