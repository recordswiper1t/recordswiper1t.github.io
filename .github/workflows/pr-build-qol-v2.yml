name: PR Build Frontiers QoL v2

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build:
    if: github.head_ref == 'agent/qol-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Check out QoL branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download FFDec 26.2.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          mkdir -p /tmp/ffdec
          unzip -q /tmp/ffdec.zip -d /tmp/ffdec
          test -f /tmp/ffdec/ffdec.jar

      - name: Export current Unlock-All ActionScript
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/krf-scripts /tmp/import /tmp/verify /tmp/out
          mkdir -p /tmp/krf-scripts /tmp/import/scripts /tmp/out
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar \
            -onerror ignore -timeout 60 -exportFileTimeout 120 \
            -export script /tmp/krf-scripts assets/kingdom-rush-frontiers-unlock-all.swf \
            > /tmp/export.log 2>&1 || true
          test -f '/tmp/krf-scripts/scripts/Level.as'
          test -f '/tmp/krf-scripts/scripts/MainMenu.as'
          test -f '/tmp/krf-scripts/scripts/§_-BQ§.as'
          test -f '/tmp/krf-scripts/scripts/§each const each§.as'

      - name: Patch QoL features
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ROOT = Path('/tmp/krf-scripts/scripts')

          def span(text, signature):
              start = text.find(signature)
              if start < 0:
                  raise SystemExit(f'function signature not found: {signature}')
              brace = text.find('{', start)
              if brace < 0:
                  raise SystemExit(f'opening brace not found: {signature}')
              depth = 0
              for i in range(brace, len(text)):
                  c = text[i]
                  if c == '{':
                      depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          return start, brace, i + 1
              raise SystemExit(f'closing brace not found: {signature}')

          def replace_function(text, signature, body):
              start, brace, end = span(text, signature)
              indent = '      '
              rendered = signature + '\r\n' + indent + '{\r\n'
              for line in body.split('\n'):
                  rendered += indent + '   ' + line + '\r\n'
              rendered += indent + '}'
              return text[:start] + rendered + text[end:]

          def inject_before_close(text, signature, lines):
              start, brace, end = span(text, signature)
              close = end - 1
              insertion = ''
              for line in lines.split('\n'):
                  insertion += '         ' + line + '\r\n'
              return text[:close] + insertion + text[close:]

          # 1) Skip the long branded intro sequence but keep all game initialization.
          root = ROOT / '§each const each§.as'
          text = root.read_text(encoding='utf-8', errors='strict')
          text = replace_function(text, 'public function §import for§() : void', '''§in extends§(this.§override do§).destroyThis();
this.§override do§ = null;
this.gotoAndStop(2);
this.§try for for§();
this.§_-Zv§();
this.§_-hn§();
this.§override class§();
this.§_-MI§();
this.§_-fH§();
this.§_-cF§();
this.§_-IV§();
this.§import§();
this.initGame();''')
          root.write_text(text, encoding='utf-8', newline='')

          # 2) Open the save chooser as soon as MainMenu reaches the stage.
          menu = ROOT / 'MainMenu.as'
          text = menu.read_text(encoding='utf-8', errors='strict')
          text = inject_before_close(text, 'public function MainMenu()', 'this.addEventListener(Event.ADDED_TO_STAGE,this.qolOpenSave,false,0,true);')
          marker = 'internal function frame47() : *'
          pos = text.find(marker)
          if pos < 0:
              raise SystemExit('MainMenu frame47 marker not found')
          helper = '''private function qolOpenSave(param1:Event) : void\r\n      {\r\n         this.removeEventListener(Event.ADDED_TO_STAGE,this.qolOpenSave);\r\n         this.§function const with§();\r\n         this.location = this.IDLE;\r\n         if(this.§if else§ != null)\r\n         {\r\n            this.§if else§.visible = false;\r\n         }\r\n      }\r\n      \r\n      '''
          text = text[:pos] + helper + text[pos:]
          menu.write_text(text, encoding='utf-8', newline='')

          # 3) Heroic/Iron become available whenever the campaign level itself is enabled.
          #    Existing saves also receive an effectively unlimited upgrade-star balance.
          data = ROOT / '§_-BQ§.as'
          text = data.read_text(encoding='utf-8', errors='strict')
          replacements = [
              ('public var stars:int = 0;', 'public var stars:int = 999999;'),
              ('this.stars = this.main.onlineData.stars;', 'this.stars = 999999;'),
              ('this.stars = §function for var§.data.stars;', 'this.stars = 999999;'),
              ('if(§true final§(this.§native import§[this.main.onlineData.levels[_loc1_].index]).stars == 3)', 'if(§true final§(this.§native import§[this.main.onlineData.levels[_loc1_].index]).levelStatus != §true final§.LEVEL_DISABLED)'),
              ('if(§_-kS§.stars == 3)', 'if(§_-kS§.levelStatus != §true final§.LEVEL_DISABLED)'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f'expected save/challenge pattern not found: {old}')
              text = text.replace(old, new)
          data.write_text(text, encoding='utf-8', newline='')

          # 4) Add a persistent 1x/3x gameplay-logic toggle to every level.
          level = ROOT / 'Level.as'
          text = level.read_text(encoding='utf-8', errors='strict')
          anchor = 'public static const LEVEL_NORMAL:int = 0;'
          if anchor not in text:
              raise SystemExit('Level constant anchor not found')
          text = text.replace(anchor, 'public static var qolSpeed:int = 1;\r\n      \r\n      ' + anchor, 1)
          anchor = 'public var mode:int;'
          if anchor not in text:
              raise SystemExit('Level mode anchor not found')
          text = text.replace(anchor, anchor + '\r\n      \r\n      private var qolSpeedButton:Sprite;\r\n      \r\n      private var qolSpeedLabel:TextField;', 1)

          text = inject_before_close(text, 'public function §_-Eu§() : void', 'this.qolInstallSpeedButton();')

          speed_helpers = '''private function qolInstallSpeedButton() : void\r\n      {\r\n         if(this.qolSpeedButton != null)\r\n         {\r\n            return;\r\n         }\r\n         this.qolSpeedButton = new Sprite();\r\n         this.qolSpeedButton.graphics.beginFill(1118481,0.88);\r\n         this.qolSpeedButton.graphics.lineStyle(1,16777215,0.45);\r\n         this.qolSpeedButton.graphics.drawRoundRect(0,0,58,30,10,10);\r\n         this.qolSpeedButton.graphics.endFill();\r\n         this.qolSpeedButton.x = 734;\r\n         this.qolSpeedButton.y = 552;\r\n         this.qolSpeedButton.buttonMode = true;\r\n         this.qolSpeedButton.mouseChildren = false;\r\n         this.qolSpeedButton.addEventListener(MouseEvent.CLICK,this.qolToggleSpeed,false,0,true);\r\n         this.qolSpeedLabel = new TextField();\r\n         this.qolSpeedLabel.width = 50;\r\n         this.qolSpeedLabel.height = 22;\r\n         this.qolSpeedLabel.x = 12;\r\n         this.qolSpeedLabel.y = 5;\r\n         this.qolSpeedLabel.textColor = 16777215;\r\n         this.qolSpeedLabel.selectable = false;\r\n         this.qolSpeedLabel.mouseEnabled = false;\r\n         this.qolSpeedButton.addChild(this.qolSpeedLabel);\r\n         this.qolUpdateSpeedLabel();\r\n         this.addChild(this.qolSpeedButton);\r\n      }\r\n      \r\n      private function qolToggleSpeed(param1:MouseEvent) : void\r\n      {\r\n         Level.qolSpeed = Level.qolSpeed == 1 ? 3 : 1;\r\n         this.qolUpdateSpeedLabel();\r\n      }\r\n      \r\n      private function qolUpdateSpeedLabel() : void\r\n      {\r\n         if(this.qolSpeedLabel != null)\r\n         {\r\n            this.qolSpeedLabel.text = Level.qolSpeed == 3 ? "3x" : "1x";\r\n         }\r\n      }\r\n      \r\n      private function qolGameTick() : void\r\n      {\r\n         if(this.§_-BF§ == LEVEL_NORMAL)\r\n         {\r\n            this.§_-HR§();\r\n         }\r\n         if(this.§_-BF§ == LEVEL_NORMAL || this.§_-BF§ == LEVEL_PRE_WIN)\r\n         {\r\n            this.updateEnemyDecals();\r\n            this.updateEntities();\r\n            this.updateBullets();\r\n            this.updateBulletsDecals();\r\n            this.updateDecals();\r\n            this.updateBackground();\r\n            this.§_-ai§();\r\n            this.menu.updateMenu();\r\n            this.§include return§.update();\r\n            this.updatePointers();\r\n         }\r\n      }\r\n      \r\n      '''
          ef = text.find('public function eFrameEvents(param1:Event) : void')
          if ef < 0:
              raise SystemExit('Level eFrameEvents not found')
          text = text[:ef] + speed_helpers + text[ef:]

          new_eframe = '''var qolTick:int = 0;
if(this.isOnComicEnd)
{
   this.comicEnd.update();
}
if(this.§_-BF§ == LEVEL_STARTING)
{
   if(this.onStart())
   {
      return;
   }
   this.§_-BF§ = LEVEL_NORMAL;
   if(this.data.levelIndex == 0 && this.mode == §_-Mm§.MODE_CAMPAIGN)
   {
      this.pause(true);
      this.§else const native§.addChild(new §dynamic const function§(new Point(0,0),this));
   }
   if(!this.game.challengeShow && this.mode != §_-Mm§.MODE_CAMPAIGN)
   {
      this.§_-JI§();
      this.sendPauseNotification("NotificationTipChallenges");
      this.game.challengeShow = true;
      this.game.§get final§();
   }
}
if(this.§_-BF§ == LEVEL_NORMAL || this.§_-BF§ == LEVEL_PRE_WIN)
{
   this.§override get§ = 0;
   if(this.stage.focus != this.stage)
   {
      this.stage.focus = this.stage;
   }
   this.game.gameSounds.onFrameUpdate();
   qolTick = 0;
   while(qolTick < Level.qolSpeed && (this.§_-BF§ == LEVEL_NORMAL || this.§_-BF§ == LEVEL_PRE_WIN))
   {
      this.qolGameTick();
      qolTick++;
   }
   if(this.§_-BF§ == LEVEL_PRE_WIN)
   {
      if(this.§_-WR§ < this.§_-jE§)
      {
         this.§_-WR§ += Level.qolSpeed;
         return;
      }
      if(this.data.levelIndex < 14 || this.data.levelIndex == 14 && this.mode != §_-Mm§.MODE_CAMPAIGN)
      {
         this.pause(true);
      }
      this.§_-BF§ = LEVEL_WIN;
      this.§_-pp§();
      this.§super const finally§();
   }
}'''
          text = replace_function(text, 'public function eFrameEvents(param1:Event) : void', new_eframe)
          level.write_text(text, encoding='utf-8', newline='')

          # Import only changed classes, retaining FFDec exported embed assets.
          for name in ['Level.as','MainMenu.as','§_-BQ§.as','§each const each§.as']:
              (Path('/tmp/import/scripts') / name).write_bytes((ROOT / name).read_bytes())
          assets = Path('/tmp/krf-scripts/_assets')
          if assets.exists():
              import shutil
              shutil.copytree(assets, Path('/tmp/import/_assets'), dirs_exist_ok=True)

          print('Patched: fast boot -> save slots')
          print('Patched: Heroic/Iron unlocked with enabled campaign level')
          print('Patched: 999999 upgrade stars on existing/new saves')
          print('Patched: persistent 1x/3x gameplay toggle')
          PY

      - name: Import patched scripts
        shell: bash
        run: |
          set -o pipefail
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar \
            -onerror abort \
            -importScript assets/kingdom-rush-frontiers-unlock-all.swf /tmp/out/kingdom-rush-frontiers-qol-v2.swf /tmp/import \
            > /tmp/import.log 2>&1
          test -s /tmp/out/kingdom-rush-frontiers-qol-v2.swf
          head -c 3 /tmp/out/kingdom-rush-frontiers-qol-v2.swf | grep -Eq 'FWS|CWS|ZWS'

      - name: Re-export and verify QoL patches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/verify
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar \
            -onerror ignore -timeout 60 \
            -selectclass 'Level,MainMenu,§_-BQ§,§each const each§' \
            -export script /tmp/verify /tmp/out/kingdom-rush-frontiers-qol-v2.swf \
            > /tmp/verify.log 2>&1 || true
          grep -F 'public static var qolSpeed:int = 1;' '/tmp/verify/scripts/Level.as'
          grep -F 'Level.qolSpeed == 1 ? 3 : 1' '/tmp/verify/scripts/Level.as'
          grep -F 'qolOpenSave' '/tmp/verify/scripts/MainMenu.as'
          grep -F 'public var stars:int = 999999;' '/tmp/verify/scripts/§_-BQ§.as'
          grep -F 'levelStatus != §true final§.LEVEL_DISABLED' '/tmp/verify/scripts/§_-BQ§.as'
          grep -F 'this.stars = 999999;' '/tmp/verify/scripts/§_-BQ§.as'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/verify/scripts/§each const each§.as').read_text(errors='replace')
          sig = 'public function §import for§() : void'
          i = p.find(sig)
          assert i >= 0
          snippet = p[i:i+1400]
          assert 'this.initGame();' in snippet
          assert 'new Intros()' not in snippet
          print('Fast-boot function verified')
          PY

      - name: Publish v2 build on branch
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/out/kingdom-rush-frontiers-qol-v2.swf assets/kingdom-rush-frontiers-qol-v2.swf
          cat > assets/QOL-V2-BUILD.txt <<'EOF'
          Kingdom Rush Frontiers — QoL v2
          Includes Unlock-All v1.
          Adds 1x/3x gameplay speed toggle (default 1x).
          Skips branded intro sequence and opens directly to save selection.
          Heroic and Iron challenges unlock as soon as their campaign level is enabled.
          Upgrade-star balance is forced to 999999 when a save is loaded.
          Built and re-export verified with FFDec 26.2.1.
          EOF
          sha256sum \
            assets/kingdom-rush-frontiers-unlock-all.swf \
            assets/kingdom-rush-frontiers-qol-v2.swf \
            > assets/QOL-V2-SHA256SUMS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/kingdom-rush-frontiers-qol-v2.swf assets/QOL-V2-BUILD.txt assets/QOL-V2-SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo 'QoL v2 output already matches branch.'
          else
            git commit -m 'Add Frontiers QoL v2 build [skip ci]'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qol-v2-build-logs
          path: |
            /tmp/export.log
            /tmp/import.log
            /tmp/verify.log
          if-no-files-found: ignore
          retention-days: 1
