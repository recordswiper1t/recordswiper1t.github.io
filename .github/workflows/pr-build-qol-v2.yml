name: PR Build Frontiers QoL v2

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build:
    if: github.head_ref == 'agent/qol-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download FFDec
        run: |
          set -euo pipefail
          curl -fL --retry 4 'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          mkdir -p /tmp/ffdec
          unzip -q /tmp/ffdec.zip -d /tmp/ffdec
          test -f /tmp/ffdec/ffdec.jar

      - name: Export and patch ActionScript
        run: |
          set -euo pipefail
          rm -rf /tmp/krf-scripts /tmp/import /tmp/verify /tmp/out
          mkdir -p /tmp/krf-scripts /tmp/import/scripts /tmp/out
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 60 -exportFileTimeout 120 -export script /tmp/krf-scripts assets/kingdom-rush-frontiers-unlock-all.swf > /tmp/export.log 2>&1 || true
          python3 tools/build-qol-v2.py patch /tmp/krf-scripts/scripts /tmp/import

      - name: Rebuild SWF
        run: |
          set -euo pipefail
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror abort -importScript assets/kingdom-rush-frontiers-unlock-all.swf /tmp/out/kingdom-rush-frontiers-qol-v2.swf /tmp/import > /tmp/import.log 2>&1
          test -s /tmp/out/kingdom-rush-frontiers-qol-v2.swf
          head -c 3 /tmp/out/kingdom-rush-frontiers-qol-v2.swf | grep -Eq 'FWS|CWS|ZWS'

      - name: Re-export and verify
        run: |
          set -euo pipefail
          mkdir -p /tmp/verify
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 60 -selectclass 'Level,MainMenu,§_-BQ§,§each const each§' -export script /tmp/verify /tmp/out/kingdom-rush-frontiers-qol-v2.swf > /tmp/verify.log 2>&1 || true
          python3 tools/build-qol-v2.py verify /tmp/verify/scripts

      - name: Publish verified build to PR branch
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          cp /tmp/out/kingdom-rush-frontiers-qol-v2.swf assets/kingdom-rush-frontiers-qol-v2.swf
          cat > assets/QOL-V2-BUILD.txt <<'EOF'
          Kingdom Rush Frontiers — QoL v2
          Includes Unlock-All v1.
          Adds persistent 1x/3x gameplay speed toggle (default 1x).
          Skips the branded intro sequence and opens directly to save selection.
          Heroic and Iron unlock as soon as their campaign level is enabled.
          Upgrade-star balance is forced to 999999 whenever a save is loaded.
          Built and re-export verified with FFDec 26.2.1.
          EOF
          sha256sum assets/kingdom-rush-frontiers-unlock-all.swf assets/kingdom-rush-frontiers-qol-v2.swf > assets/QOL-V2-SHA256SUMS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/kingdom-rush-frontiers-qol-v2.swf assets/QOL-V2-BUILD.txt assets/QOL-V2-SHA256SUMS.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add Frontiers QoL v2 build [skip ci]'
          git push origin HEAD:"${TARGET_BRANCH}"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qol-v2-build-logs
          path: |
            /tmp/export.log
            /tmp/import.log
            /tmp/verify.log
          if-no-files-found: ignore
          retention-days: 1
