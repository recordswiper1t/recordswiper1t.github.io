name: Probe Ultimate KR1 hero selector on V12.1

on:
  push:
    branches: [agent/v13-kingdom-rush-ultimate-clean]
    paths:
      - 'tools/ultimate/build_ultimate_hero_menu.py'
      - '.github/workflows/probe-ultimate-hero-menu.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/ultimate/build_ultimate_hero_menu.py'
      - '.github/workflows/probe-ultimate-hero-menu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hero-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare enhanced runtime and FFDec
        run: |
          set -euo pipefail
          python3 -m py_compile tools/ultimate/build_ultimate_hero_menu.py
          mkdir -p /tmp/u /tmp/ffdec /tmp/u/report
          if [ -s assets/kingdom-rush-frontiers-v12-1.swf ]; then
            echo 'KRF_BASE=assets/kingdom-rush-frontiers-v12-1.swf' >> "$GITHUB_ENV"
            echo 'HAS_V12=1' >> "$GITHUB_ENV"
            echo 'HAS_V121=1' >> "$GITHUB_ENV"
          elif [ -s assets/kingdom-rush-frontiers-v12.swf ]; then
            echo 'KRF_BASE=assets/kingdom-rush-frontiers-v12.swf' >> "$GITHUB_ENV"
            echo 'HAS_V12=1' >> "$GITHUB_ENV"
            echo 'HAS_V121=0' >> "$GITHUB_ENV"
          else
            echo 'KRF_BASE=assets/kingdom-rush-frontiers-v11.swf' >> "$GITHUB_ENV"
            echo 'HAS_V12=0' >> "$GITHUB_ENV"
            echo 'HAS_V121=0' >> "$GITHUB_ENV"
          fi
          curl -fL --retry 4 \
            'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          unzip -q /tmp/ffdec.zip -d /tmp/ffdec

      - name: Export Level and apply combined hero UI patch
        run: |
          set -euo pipefail
          mkdir -p /tmp/u/export /tmp/u/import/scripts
          java -Xmx5g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 \
            -export script /tmp/u/export "$KRF_BASE" >/tmp/u/export.log 2>&1 || true
          test -f /tmp/u/export/scripts/Level.as
          python3 tools/ultimate/build_ultimate_hero_menu.py /tmp/u/export/scripts \
            --report /tmp/u/report/hero-menu-patch.json
          cp /tmp/u/export/scripts/Level.as /tmp/u/import/scripts/Level.as

      - name: Compile patched Level into enhanced runtime
        run: |
          set -euo pipefail
          java -Xmx7g -jar /tmp/ffdec/ffdec.jar -onerror abort \
            -importScript "$KRF_BASE" /tmp/u/hero-menu.swf /tmp/u/import \
            >/tmp/u/import.log 2>&1
          test -s /tmp/u/hero-menu.swf
          head -c 3 /tmp/u/hero-menu.swf | grep -Eq 'FWS|CWS|ZWS'

      - name: Re-export and verify combined selector invariants
        run: |
          set -euo pipefail
          mkdir -p /tmp/u/verify
          java -Xmx5g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 \
            -export script /tmp/u/verify /tmp/u/hero-menu.swf >/tmp/u/verify.log 2>&1 || true
          level=/tmp/u/verify/scripts/Level.as
          test -f "$level"
          grep -F 'private var qolHeroPage:int' "$level"
          grep -F 'HEROES — PAGE' "$level"
          grep -F 'hero_page_prev' "$level"
          grep -F 'hero_page_next' "$level"
          grep -F 'private function ultimateMakeKR1Hero' "$level"
          grep -F 'getDefinitionByName(param1)' "$level"
          for cls in \
            KR1__SoldierHeroGerald KR1__SoldierHeroAlleria KR1__SoldierHeroMalik \
            KR1__SoldierHeroBolin KR1__SoldierHeroMagnus KR1__SoldierHeroIgnus \
            KR1__SoldierHeroDenas KR1__SoldierHeroFrost KR1__SoldierHeroViking; do
            grep -F "$cls" "$level"
          done
          grep -F 'var kr1Roster:Array' "$level"
          grep -F 'Level.qolHeroEnabled[heroName] = false' "$level"
          grep -F 'qolTowerClipboard' "$level"
          if [ "$HAS_V12" = 1 ]; then
            grep -F 'qolVirtualLivesLost' "$level"
            grep -F 'THE LAST RIFT' /tmp/u/verify/scripts/Level15.as
          fi
          if [ "$HAS_V121" = 1 ]; then
            grep -F 'qolPopupsEnabled' "$level"
          fi
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/u/verify/scripts/Level.as').read_text(encoding='utf-8-sig',errors='replace')
          a=s.index('else if(action == "hero_page_prev")')
          b=s.index('else if(action.indexOf("hero_") == 0)')
          assert a < b, 'pagination actions must precede generic hero_* toggle'
          print('hero pagination dispatch ordering verified')
          PY
          sha256sum /tmp/u/hero-menu.swf >/tmp/u/report/hero-menu-SHA256.txt

      - name: Upload structural verification only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultimate-kr1-hero-menu-probe
          path: |
            /tmp/u/report/hero-menu-patch.json
            /tmp/u/report/hero-menu-SHA256.txt
            /tmp/u/import.log
            /tmp/u/verify.log
          retention-days: 30
