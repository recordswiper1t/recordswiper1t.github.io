name: PR Build Frontiers v4

on:
  push:
    branches:
      - agent/v4-frontiers-fixes
    paths:
      - '.github/workflows/pr-build-v4.yml'
      - 'tools/build-v4.py'
      - 'tools/build-v4-finalize.py'
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'push' || github.head_ref == 'agent/v4-frontiers-fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download FFDec
        run: |
          set -euo pipefail
          curl -fL --retry 4 'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          mkdir -p /tmp/ffdec
          unzip -q /tmp/ffdec.zip -d /tmp/ffdec
          test -f /tmp/ffdec/ffdec.jar

      - name: Export and patch V3 ActionScript
        run: |
          set -euo pipefail
          rm -rf /tmp/v4scripts /tmp/import /tmp/verify /tmp/out
          mkdir -p /tmp/v4scripts /tmp/import/scripts /tmp/out
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 -export script /tmp/v4scripts assets/kingdom-rush-frontiers-v3.swf > /tmp/export-v4.log 2>&1 || true
          python3 tools/build-v4.py patch /tmp/v4scripts/scripts /tmp/import
          python3 tools/build-v4-finalize.py patch /tmp/v4scripts/scripts /tmp/import

      - name: Rebuild V4 SWF
        run: |
          set -euo pipefail
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror abort -importScript assets/kingdom-rush-frontiers-v3.swf /tmp/out/kingdom-rush-frontiers-v4.swf /tmp/import > /tmp/import-v4.log 2>&1
          test -s /tmp/out/kingdom-rush-frontiers-v4.swf
          head -c 3 /tmp/out/kingdom-rush-frontiers-v4.swf | grep -Eq 'FWS|CWS|ZWS'

      - name: Re-export and verify V4
        run: |
          set -euo pipefail
          mkdir -p /tmp/verify
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -selectclass 'Level,§_-2i§,§_-BQ§,GameUpgrades,TowerHolder,§_-LZ§,§true break§,TowerDwarfRiflemen,TowerSoldierPirates,§_-Zs§' -export script /tmp/verify /tmp/out/kingdom-rush-frontiers-v4.swf > /tmp/verify-v4.log 2>&1 || true
          python3 tools/build-v4.py verify /tmp/verify/scripts
          python3 tools/build-v4-finalize.py verify /tmp/verify/scripts

      - name: Publish verified V4 build
        env:
          TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          cp /tmp/out/kingdom-rush-frontiers-v4.swf assets/kingdom-rush-frontiers-v4.swf
          cat > assets/V4-BUILD.txt <<'EOF'
          Kingdom Rush Frontiers — V4 Sandbox + Stability
          Based on the verified V3 SWF.

          - All 9 hero implementations start enabled in every level and can be toggled individually in the pause tools.
          - New/legacy saves default to all 65 tower-upgrade stars spent/maxed and all heroes level 10 with every hero skill maxed.
          - RESET FOR CUSTOM clears tower-upgrade and hero-skill spending while retaining the full 65-star pool and level-10 heroes; custom mode persists so later manual choices are not overwritten.
          - Gold uses a numeric text field and Add button.
          - Next-wave flags appear immediately and Send All Waves is paced across frames to avoid a single-frame spike.
          - Special catalog includes Dwarf Bastion (250), Dwarf Hall (225), Pirate Barracks (200), native-priced jungle/underground repair sites, Crossbow, Totem, Archmage, Necromancer, DWAARP and Battle-Mecha direct builds with displayed costs.
          - Special placements use the actual build-spot center instead of the previous 36px Y offset.
          - V4 buttons, radial items, and map-special towers react on mouse-down for more reliable touch behavior under Ruffle.
          - High-entity performance uses reusable child snapshots instead of allocating weak Dictionaries every gameplay tick, and throttles cosmetic layers only when entity/bullet counts are high; gameplay updates remain full-rate.
          - V3 unlock-all, speed, enemy-round and mobile changes remain included.

          Built and re-export verified with FFDec 26.2.1.
          EOF
          sha256sum assets/kingdom-rush-frontiers-v3.swf assets/kingdom-rush-frontiers-v4.swf > assets/V4-SHA256SUMS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/kingdom-rush-frontiers-v4.swf assets/V4-BUILD.txt assets/V4-SHA256SUMS.txt
          git commit -m 'Add verified Frontiers v4 build [skip ci]' || exit 0
          git pull --rebase origin "${TARGET_BRANCH}"
          git push origin HEAD:"${TARGET_BRANCH}"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v4-build-logs
          path: |
            /tmp/export-v4.log
            /tmp/import-v4.log
            /tmp/verify-v4.log
          if-no-files-found: ignore
          retention-days: 1
