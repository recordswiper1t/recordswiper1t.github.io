name: Probe Frontiers v4 candidates

on:
  push:
    branches: [agent/v4-frontiers-fixes]
    paths: ['.github/workflows/pr-analyze-v4-candidates.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          set -euo pipefail
          curl -fL --retry 4 'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          mkdir -p /tmp/ffdec /tmp/v4probe
          unzip -q /tmp/ffdec.zip -d /tmp/ffdec
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 -export script /tmp/v4probe assets/kingdom-rush-frontiers-v3.swf >/tmp/probe.log 2>&1 || true
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('/tmp/v4probe/scripts')
          keys=['Rurin','HERO_DWARF','Lucrezia','Black Corsair','HERO_VAMPIRE','HERO_PIRATE','SPECIAL_','DwarfRiflemen','Pirate','Mercenary','Djinn','Genie','Shrine','Necromancer','Watchtower','Dwarf','Barrack','Camp']
          out=['=== SPECIAL HERO / TOWER CANDIDATE PROBE ===','']
          classes=[]
          for p in root.rglob('*.as'):
              try:t=p.read_text(encoding='utf-8')
              except:continue
              m=re.search(r'(public\s+(?:final\s+)?class\s+[^\s{]+\s+extends\s+[^\s{]+)',t)
              decl=m.group(1) if m else ''
              ctor=''
              if m:
                  name=re.search(r'class\s+([^\s{]+)',decl).group(1)
                  cm=re.search(r'public\s+function\s+'+re.escape(name)+r'\s*\([^\n{]*',t)
                  ctor=cm.group(0) if cm else ''
                  classes.append((name,decl,str(p.relative_to(root)),ctor))
              hits=[k for k in keys if k.lower() in t.lower()]
              if hits:
                  out += [f'===== {p.relative_to(root)} =====',f'DECL: {decl}',f'CTOR: {ctor}',f'HITS: {", ".join(hits)}']
                  lines=t.splitlines()
                  shown=0
                  for i,line in enumerate(lines):
                      if any(k.lower() in line.lower() for k in keys):
                          a=max(0,i-3); b=min(len(lines),i+4)
                          out += [f'--- line {i+1} ---']+[f'{j+1:05d}: {lines[j]}' for j in range(a,b)]
                          shown+=1
                          if shown>=10: break
                  out.append('')
          out += ['=== CLASSES WITH SOLDIER / TOWER / SPECIAL / CAMP / DWARF / PIRATE IN NAME OR PATH ===']
          for name,decl,rel,ctor in sorted(classes,key=lambda x:x[2]):
              s=(name+' '+rel).lower()
              if any(k in s for k in ['soldier','tower','special','camp','dwarf','pirate','hero','mercenary','djinn','genie','shrine']):
                  out.append(f'{name}\t{rel}\t{decl}\t{ctor}')
          Path('analysis/v4-candidates.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/v4-candidates.txt
          git commit -m 'Add Frontiers v4 special class probe [skip ci]' || exit 0
          git pull --rebase origin agent/v4-frontiers-fixes
          git push origin HEAD:agent/v4-frontiers-fixes
