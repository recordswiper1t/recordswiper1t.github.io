name: Build and verify Epic War 5 Expansion V3.7

on:
  push:
    branches: [codex/epicwar5-expansion-v37]
    paths:
      - '.github/workflows/build-epicwar5-expansion-v37.yml'
      - 'tools/epicwar5/expansion/patch_battle_unit_ui_v37.py'
      - 'assets/epic-war-5-expansion-v36.swf'
      - 'epicwar5-expansion/index.html'
      - 'iphone/epicwar5.html'
      - 'desktop/**'
      - 'index.html'
      - 'README.md'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-epicwar5-expansion-v37.yml'
      - 'tools/epicwar5/expansion/patch_battle_unit_ui_v37.py'
      - 'assets/epic-war-5-expansion-v37.swf'
      - 'assets/EPICWAR5-EXPANSION-V37-BUILD.txt'
      - 'assets/EPICWAR5-EXPANSION-V37-SHA256SUMS.txt'
      - 'epicwar5-expansion/index.html'
      - 'iphone/epicwar5.html'
      - 'desktop/**'
      - 'index.html'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Freeze V3.6 and download FFDec
        shell: bash
        run: |
          set -euxo pipefail
          test "$(sha256sum assets/epic-war-5-expansion-v36.swf | cut -d' ' -f1)" = 'cfc5424232b81693b42187242c2e93bb867b36636ba266ffc01595c687a74563'
          mkdir -p /tmp/ffdec /tmp/v37/src /tmp/v37/out /tmp/v37/verify
          curl -fL --retry 4 'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          unzip -q /tmp/ffdec.zip -d /tmp/ffdec
      - name: Patch exact V3.6 and rebuild V3.7
        shell: bash
        run: |
          set -euxo pipefail
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 -export script /tmp/v37/src assets/epic-war-5-expansion-v36.swf >/tmp/v37/export.log 2>&1 || true
          test -f /tmp/v37/src/scripts/Game/System/Battle/BattleControlPlayer.as
          test -f /tmp/v37/src/scripts/Game/System/Battle/PlayerUnit.as
          python3 tools/epicwar5/expansion/patch_battle_unit_ui_v37.py /tmp/v37/src
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror abort -importScript assets/epic-war-5-expansion-v36.swf /tmp/v37/out/epic-war-5-expansion-v37.swf /tmp/v37/src >/tmp/v37/import.log 2>&1
          test -s /tmp/v37/out/epic-war-5-expansion-v37.swf
          head -c 3 /tmp/v37/out/epic-war-5-expansion-v37.swf | grep -Eq 'FWS|CWS|ZWS'
      - name: Re-decompile and verify battle initialization plus frozen gameplay
        shell: bash
        run: |
          set -euxo pipefail
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 -export script /tmp/v37/verify /tmp/v37/out/epic-war-5-expansion-v37.swf >/tmp/v37/verify.log 2>&1 || true
          game=/tmp/v37/verify/scripts/Game
          control=$game/System/Battle/BattleControlPlayer.as
          unit=$game/System/Battle/PlayerUnit.as
          world=$game/Interface/WorldMap.as
          grep -F 'private function expansionCreateUnitClip' "$control"
          grep -F 'clip.expansionIcon = true' "$control"
          grep -F 'clip = this.expansionCreateUnitClip(refs[i],slot)' "$control"
          grep -F 'this.icoClip.hasOwnProperty("expansionIcon")' "$unit"
          grep -F 'this.icoClip.iconLabel.htmlText' "$unit"
          grep -F 'clip.init(expansionGame,expansionStageId)' "$world"
          grep -F 'sandboxMaster:Boolean = false' "$game/System/Battle/BattleSystem.as"
          ! grep -F 'getQualifiedClassName(this.bSys.ui.unit1)' "$control"
          python3 tools/epicwar5/expansion/validate_v34_invariants.py /tmp/v37/verify
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('/tmp/v37/verify/scripts/Game/System/Battle')
          control = (root / 'BattleControlPlayer.as').read_text(encoding='utf-8-sig')
          unit = (root / 'PlayerUnit.as').read_text(encoding='utf-8-sig')
          create = re.search(r'(?ms)private function expansionCreateUnitClip.*?(?=private function expansionInitUnits)', control)
          assert create
          body = create.group(0)
          for marker in ('clip.select = selection', 'clip.iconLabel = iconLabel', 'clip.total = total', 'clip.spawn = spawn', 'spawn.bar = bar'):
              assert marker in body, marker
          init = re.search(r'(?ms)private function expansionInitUnits.*?(?=private function expansionDestroyUnits)', control)
          assert init and 'new PlayerUnit(this.mGF,this.bSys,clip' in init.group(0)
          assert unit.index('hasOwnProperty("expansionIcon")') < unit.index('this.icoClip.icon.gotoAndStop(this.id)')
          PY
      - name: Verify V3.7 release integration
        shell: bash
        run: |
          set -euxo pipefail
          grep -F '/assets/epic-war-5-expansion-v37.swf?v=37-battle-init-r1' epicwar5-expansion/index.html
          grep -F 'parameters:{ew5ExpansionDirect:"1"}' epicwar5-expansion/index.html
          grep -F '/assets/epic-war-5-expansion-v37.swf?v=iphone-exp-v37-r1' iphone/epicwar5.html
          grep -F 'params:{ew5ExpansionDirect:"1"}' iphone/epicwar5.html
          grep -F 'epic-war-5-expansion-v37.swf' desktop/run_native.py desktop/run-native.ps1
          grep -F 'Expansion V3.7' README.md index.html desktop/README.md
          grep -F 'cb78bef6532d1d425d68af15cccff36e5549d45424b8a0f230cd5cc2994b5e03' assets/THREE-GAME-EXPANSION-COMPLETION.txt
          python3 -m py_compile tools/epicwar5/expansion/patch_battle_unit_ui_v37.py desktop/run_native.py
      - name: Stage build record and checksum
        shell: bash
        run: |
          set -euxo pipefail
          hash=$(sha256sum /tmp/v37/out/epic-war-5-expansion-v37.swf | cut -d' ' -f1)
          printf '%s  assets/epic-war-5-expansion-v37.swf\n' "$hash" > /tmp/v37/out/EPICWAR5-EXPANSION-V37-SHA256SUMS.txt
          cat > /tmp/v37/out/EPICWAR5-EXPANSION-V37-BUILD.txt <<EOF
          Epic War 5 — Expansion V3.7 — Battle Initialization Completion
          Baseline V3.6 SHA-256: cfc5424232b81693b42187242c2e93bb867b36636ba266ffc01595c687a74563
          Release SWF SHA-256: $hash
          Toolchain: FFDec 26.2.1

          - Replaces the invalid getQualifiedClassName(unit1) clone, which produced a plain MovieClip without the children PlayerUnit requires.
          - Creates an explicit second six-slot HUD row with selection, unit identifier, population count and spawn progress controls.
          - Allows all twelve army controllers to initialize before battle state, spell controls and mana state are finalized.
          - Preserves V3.6's world-map teardown before battle initialization and V3.5's save-safe direct Expansion entry.
          - Expansion stages 27-50 remain sequentially gated by genuine victories.
          - V3.4 sandbox controls remain default-off; V3.3.1 performance and site-lock behavior remain intact.
          - Rebuilt from exact V3.6, freshly re-decompiled, invariant-checked and browser-runtime verified.
          EOF
          sed -i 's/^          //' /tmp/v37/out/EPICWAR5-EXPANSION-V37-BUILD.txt
      - name: Match committed release on pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euxo pipefail
          sha256sum -c assets/EPICWAR5-EXPANSION-V37-SHA256SUMS.txt
          cmp /tmp/v37/out/epic-war-5-expansion-v37.swf assets/epic-war-5-expansion-v37.swf
          cmp /tmp/v37/out/EPICWAR5-EXPANSION-V37-SHA256SUMS.txt assets/EPICWAR5-EXPANSION-V37-SHA256SUMS.txt
          cmp /tmp/v37/out/EPICWAR5-EXPANSION-V37-BUILD.txt assets/EPICWAR5-EXPANSION-V37-BUILD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: epicwar5-expansion-v37-verified
          retention-days: 7
          path: /tmp/v37/out
      - name: Publish verified V3.7 to the branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euxo pipefail
          cp /tmp/v37/out/epic-war-5-expansion-v37.swf assets/
          cp /tmp/v37/out/EPICWAR5-EXPANSION-V37-SHA256SUMS.txt assets/
          cp /tmp/v37/out/EPICWAR5-EXPANSION-V37-BUILD.txt assets/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/epic-war-5-expansion-v37.swf assets/EPICWAR5-EXPANSION-V37-SHA256SUMS.txt assets/EPICWAR5-EXPANSION-V37-BUILD.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Epic War 5 Expansion V3.7 battle initialization'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
