name: PR Analyze Frontiers Unlocks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download FFDec 26.2.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          mkdir -p /tmp/ffdec
          unzip -q /tmp/ffdec.zip -d /tmp/ffdec
          test -f /tmp/ffdec/ffdec.jar

      - name: Export ActionScript
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/krf-scripts
          mkdir -p /tmp/krf-scripts
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar \
            -onerror ignore -timeout 60 -exportFileTimeout 120 \
            -export script /tmp/krf-scripts assets/kingdom-rush-frontie-15717.swf \
            > /tmp/ffdec-export.log 2>&1 || true
          test "$(find /tmp/krf-scripts -type f | wc -l)" -gt 0

      - name: Build unlock report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          python3 - <<'PY'
          from pathlib import Path

          root = Path('/tmp/krf-scripts')
          out = Path('/tmp/out/unlock-index.txt')
          strong = [
              'selectedHero','heroPrices','unlockMax','purchases','purchaseHero',
              'heroSku','isPremium','premiumHero','heroLocked','heroUnlocked',
              'premium','Premium','locked','unlocked'
          ]
          name_keep = {'Level.as','MainMenu.as','ButPremiumContentMainMenu.as','AgiV2Handler.as'}
          chosen = []
          for p in root.rglob('*.as'):
              try:
                  text = p.read_text(errors='replace')
              except Exception:
                  continue
              hits = [s for s in strong if s in text]
              is_level = p.name == 'Level.as' or (p.name.startswith('Level') and p.name[5:-3].isdigit())
              if hits or is_level or p.name in name_keep:
                  chosen.append((p, text, hits))

          with out.open('w', encoding='utf-8') as f:
              f.write('Kingdom Rush Frontiers unlock-source report\n\n')
              f.write('=== FILE LIST ===\n')
              for p,text,hits in sorted(chosen, key=lambda x: str(x[0])):
                  f.write(f'{p.relative_to(root)}\t{", ".join(hits)}\n')
              f.write('\n=== FULL SOURCES ===\n')
              for p,text,hits in sorted(chosen, key=lambda x: str(x[0])):
                  f.write(f'\n\n===== {p.relative_to(root)} =====\n')
                  f.write(text)
                  if not text.endswith('\n'):
                      f.write('\n')
          print(f'Included {len(chosen)} scripts; {out.stat().st_size} bytes')
          PY

      - name: Upload unlock report
        uses: actions/upload-artifact@v4
        with:
          name: unlock-analysis
          path: /tmp/out/unlock-index.txt
          if-no-files-found: error
          retention-days: 1
