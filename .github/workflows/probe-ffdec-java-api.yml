name: Probe FFDec Java API for SWF merge

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/probe-ffdec-java-api.yml'
  push:
    branches: [agent/v13-kingdom-rush-ultimate]
    paths:
      - '.github/workflows/probe-ffdec-java-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download FFDec 26.2.1
        run: |
          set -euo pipefail
          curl -fL --retry 4 'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          mkdir -p /tmp/ffdec && unzip -q /tmp/ffdec.zip -d /tmp/ffdec
      - name: Locate merge-relevant classes
        run: |
          set -euo pipefail
          J=/tmp/ffdec/ffdec.jar
          jar tf "$J" | grep -E 'com/jpexs/decompiler/flash/(SWF|tags/.*(DoABC|SymbolClass|Character|Tag)|abc/ABC).*\.class$' | head -250
      - name: Inspect core SWF/tag APIs
        run: |
          set -euo pipefail
          J=/tmp/ffdec/ffdec.jar
          for C in \
            com.jpexs.decompiler.flash.SWF \
            com.jpexs.decompiler.flash.tags.Tag \
            com.jpexs.decompiler.flash.tags.base.CharacterTag \
            com.jpexs.decompiler.flash.tags.DoABC2Tag \
            com.jpexs.decompiler.flash.tags.SymbolClassTag \
            com.jpexs.decompiler.flash.abc.ABC; do
            echo "===== $C ====="
            javap -classpath "$J" -public "$C" 2>&1 | head -220 || true
          done
