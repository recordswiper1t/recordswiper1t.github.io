name: Analyze Frontiers V5 completeness

on:
  push:
    branches:
      - agent/sandbox-completeness-unlimited-ios
    paths:
      - '.github/workflows/analyze-v5-completeness.yml'
      - 'assets/kingdom-rush-frontiers-v5.swf'
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  analyze:
    if: github.event_name == 'push' || github.head_ref == 'agent/sandbox-completeness-unlimited-ios'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/sandbox-completeness-unlimited-ios
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download FFDec 26.2.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          mkdir -p /tmp/ffdec
          unzip -q /tmp/ffdec.zip -d /tmp/ffdec
          test -f /tmp/ffdec/ffdec.jar

      - name: Export V5 ActionScript
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/krf-v5
          mkdir -p /tmp/krf-v5
          java -Xmx5g -jar /tmp/ffdec/ffdec.jar \
            -onerror ignore -timeout 60 -exportFileTimeout 120 \
            -export script /tmp/krf-v5 assets/kingdom-rush-frontiers-v5.swf \
            > /tmp/v5-completeness-export.log 2>&1 || true
          count=$(find /tmp/krf-v5/scripts -type f | wc -l | tr -d ' ')
          echo "Exported scripts: $count"
          test "$count" -gt 1200

      - name: Build targeted completeness report
        shell: bash
        run: |
          set -euo pipefail
          report='analysis/v5-completeness-index.txt'
          mkdir -p analysis
          : > "$report"
          {
            echo 'Kingdom Rush Frontiers V5 completeness index'
            echo "Generated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo '=== Hero-like script files ==='
            find /tmp/krf-v5/scripts -maxdepth 1 -type f \( -iname '*Hero*.as' -o -iname '*hero*.as' \) -printf '%f\n' | sort
            echo
            echo '=== Enemy/Boss script files ==='
            find /tmp/krf-v5/scripts -maxdepth 1 -type f \( -iname 'Enemy*.as' -o -iname '*Boss*.as' \) -printf '%f\n' | sort
            echo
            echo '=== Enemy constructor signatures ==='
            grep -HnE 'public function Enemy[A-Za-z0-9_]*\(' /tmp/krf-v5/scripts/Enemy*.as 2>/dev/null | sed 's#^/tmp/krf-v5/scripts/##' | cut -c1-500 || true
            echo
            echo '=== Tower/building-like script files ==='
            find /tmp/krf-v5/scripts -maxdepth 1 -type f \( -iname 'Tower*.as' -o -iname '*Camp*.as' -o -iname '*Barrack*.as' -o -iname '*Building*.as' -o -iname '*Special*.as' \) -printf '%f\n' | sort
            echo
            echo '=== Special/map-only tower references ==='
            grep -HnEi 'SPECIAL_|special tower|special building|pirate|dwarf|mercenar|tribal|crossbow|archmage|necromancer|dwaarp|mech|towerholder' /tmp/krf-v5/scripts/*.as 2>/dev/null | sed 's#^/tmp/krf-v5/scripts/##' | cut -c1-500 | head -n 5000 || true
            echo
            echo '=== Level sandbox source ==='
            nl -ba /tmp/krf-v5/scripts/Level.as | sed -n '1,3000p'
            echo
            echo '=== TowerHolder source ==='
            nl -ba /tmp/krf-v5/scripts/TowerHolder.as | sed -n '1,2200p'
            echo
            echo '=== Pause/menu source candidates ==='
            grep -RilE 'SEND ALL|RESET FOR CUSTOM|MAX ALL|qolEnemies|qolHeroes|SEND UNIT|UNLIMITED|INSTANT WIN' /tmp/krf-v5/scripts 2>/dev/null | while read -r f; do
              echo "----- ${f#/tmp/krf-v5/scripts/} -----"
              nl -ba "$f" | sed -n '1,2600p'
            done
            echo
            echo '=== Stage ending / victory references ==='
            grep -HnEi 'endLevel|end level|victory|winLevel|win level|maxWaves|gameWon|levelWon|campaignWon|finishLevel|stageWon|wave.*max|showWin|victory' /tmp/krf-v5/scripts/Level*.as 2>/dev/null | sed 's#^/tmp/krf-v5/scripts/##' | cut -c1-500 | head -n 5000 || true
            echo
            echo '=== Export log tail ==='
            tail -n 80 /tmp/v5-completeness-export.log || true
          } >> "$report"
          wc -l "$report"

      - name: Commit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/v5-completeness-index.txt
          git commit -m 'Index V5 sandbox completeness [skip ci]' || exit 0
          git pull --rebase origin agent/sandbox-completeness-unlimited-ios
          git push origin HEAD:agent/sandbox-completeness-unlimited-ios
