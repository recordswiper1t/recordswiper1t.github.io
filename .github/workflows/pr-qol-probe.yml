name: PR QoL trigger probe

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  probe:
    if: github.head_ref == 'agent/qol-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "PR workflow trigger confirmed" > QOL-V2-PROBE.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add QOL-V2-PROBE.txt
          git commit -m 'Confirm QoL PR workflow trigger [skip ci]' || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
