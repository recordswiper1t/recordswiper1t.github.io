name: Analyze Frontiers v4 extra targets

on:
  push:
    branches:
      - agent/v4-frontiers-fixes
    paths:
      - '.github/workflows/pr-analyze-v4-extra.yml'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download FFDec
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          mkdir -p /tmp/ffdec
          unzip -q /tmp/ffdec.zip -d /tmp/ffdec
      - name: Export exact V4 targets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v4extra analysis/v4-extra
          mkdir -p /tmp/v4extra analysis/v4-extra
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 -export script /tmp/v4extra assets/kingdom-rush-frontiers-v3.swf >/tmp/v4extra.log 2>&1 || true
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil
          root=Path('/tmp/v4extra/scripts')
          names=[
            'TowerDwarfRiflemen.as','TowerSoldierPirates.as','TowerArcherCrossbow.as','TowerArcherTotem.as',
            'TowerSoldierAssassin.as','TowerSoldierTemplar.as','TowerMageArchmage.as','TowerMageNecromancer.as',
            'TowerEngineerDwaarp.as','TowerEngineerMech.as','§_-2i§.as','§_-BQ§.as','§true break§.as'
          ]
          found={}
          for p in root.rglob('*.as'):
            if p.name in names and p.name not in found:
              dst=Path('analysis/v4-extra')/(p.name+'.txt')
              shutil.copyfile(p,dst)
              found[p.name]=str(p.relative_to(root))
          lines=[]
          for n in names:
            lines.append(f'{n}\t{found.get(n,"NOT FOUND")}')
            if n in found:
              t=(root/found[n]).read_text(encoding='utf-8')
              cls=n[:-3]
              for i,line in enumerate(t.splitlines(),1):
                if ('function '+cls+'(' in line or 'cost' in line.lower() or 'upgradeTower' in line or 'loadData(' in line) and len(line)<420:
                  lines.append(f'  {i:05d}: {line.strip()}')
          Path('analysis/v4-extra-summary.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
      - name: Commit analysis
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/v4-extra analysis/v4-extra-summary.txt
          git commit -m 'Add exact V4 tower and progression targets [skip ci]' || exit 0
          git pull --rebase origin agent/v4-frontiers-fixes
          git push origin HEAD:agent/v4-frontiers-fixes
