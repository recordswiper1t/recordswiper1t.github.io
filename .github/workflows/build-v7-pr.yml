name: Build Frontiers V7 time attack

on:
  push:
    branches:
      - agent/time-attack-mode
    paths:
      - '.github/workflows/build-v7-pr.yml'
      - 'tools/build-v7.py'
      - 'tools/build-v7-special-enemies.py'
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'push' || github.head_ref == 'agent/time-attack-mode'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/time-attack-mode
          fetch-depth: 1
          sparse-checkout: |
            .github
            tools
            analysis
            assets/kingdom-rush-frontiers-v5.swf
            assets/V7-BUILD.txt
            assets/V7-SHA256SUMS.txt
          sparse-checkout-cone-mode: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download FFDec 26.2.1 and current V6 base
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          mkdir -p /tmp/ffdec
          unzip -q /tmp/ffdec.zip -d /tmp/ffdec
          test -f /tmp/ffdec/ffdec.jar
          curl -fL --retry 4 'https://raw.githubusercontent.com/recordswiper1t/recordswiper1t.github.io/main/assets/kingdom-rush-frontiers-v5.swf' -o /tmp/krf-v6.swf
          test -s /tmp/krf-v6.swf
          test "$(stat -c '%s' /tmp/krf-v6.swf)" -gt 50000000

      - name: Export V6 scripts and apply V7 patches
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/krf-v7 /tmp/v7-patches
          mkdir -p /tmp/krf-v7 /tmp/v7-patches
          java -Xmx6g -jar /tmp/ffdec/ffdec.jar \
            -onerror ignore -timeout 60 -exportFileTimeout 120 \
            -export script /tmp/krf-v7 /tmp/krf-v6.swf \
            > /tmp/v7-export.log 2>&1 || true
          count=$(find /tmp/krf-v7/scripts -type f | wc -l | tr -d ' ')
          echo "Exported scripts: $count"
          test "$count" -gt 1200
          test -s /tmp/krf-v7/scripts/Level.as
          test -s /tmp/krf-v7/scripts/Enemy.as
          overrides=$(grep -RFl 'override protected function §with catch§' /tmp/krf-v7/scripts/Enemy*.as || true)
          printf '%s\n' "$overrides" > /tmp/v7-overrides.txt
          unexpected=$(printf '%s\n' "$overrides" | grep -Ev '/(EnemyCanibalBeast|EnemyCanibalHunterUnderwater|EnemyCanibalUnderwater|EnemyFinalBossPiece|EnemySaurianNightscale|EnemyTremor)\.as$' || true)
          if [ -n "$unexpected" ]; then
            echo 'Unexpected enemy subclasses override the common path-end hook:' >&2
            echo "$unexpected" >&2
            exit 1
          fi
          python3 tools/build-v7.py /tmp/krf-v7/scripts
          python3 tools/build-v7-special-enemies.py /tmp/krf-v7/scripts
          for f in Level.as Enemy.as EnemyCanibalBeast.as EnemyTremor.as; do
            cp "/tmp/krf-v7/scripts/$f" "/tmp/v7-patches/$f"
          done

      - name: Import patched scripts
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/kingdom-rush-frontiers-v7.swf
          java -Xmx6g -jar /tmp/ffdec/ffdec.jar \
            -onerror abort -timeout 180 \
            -importScript /tmp/krf-v6.swf /tmp/kingdom-rush-frontiers-v7.swf /tmp/v7-patches \
            > /tmp/v7-import.log 2>&1 || {
              cat /tmp/v7-import.log
              exit 1
            }
          test -s /tmp/kingdom-rush-frontiers-v7.swf
          test "$(stat -c '%s' /tmp/kingdom-rush-frontiers-v7.swf)" -gt 50000000

      - name: Re-export and verify compiled V7
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/verify-v7
          mkdir -p /tmp/verify-v7
          java -Xmx6g -jar /tmp/ffdec/ffdec.jar \
            -onerror ignore -timeout 60 -exportFileTimeout 120 \
            -export script /tmp/verify-v7 /tmp/kingdom-rush-frontiers-v7.swf \
            > /tmp/v7-verify-export.log 2>&1 || true
          level=/tmp/verify-v7/scripts/Level.as
          enemy=/tmp/verify-v7/scripts/Enemy.as
          beast=/tmp/verify-v7/scripts/EnemyCanibalBeast.as
          tremor=/tmp/verify-v7/scripts/EnemyTremor.as
          nightscale=/tmp/verify-v7/scripts/EnemySaurianNightscale.as
          test -s "$level" && test -s "$enemy" && test -s "$beast" && test -s "$tremor"
          grep -Fq 'qolTimeAttackEnabled' "$level"
          grep -Fq 'qolRecycleEnemies' "$level"
          grep -Fq 'qolStartTimeAttack' "$level"
          grep -Fq 'qolTimeAttackDone' "$level"
          grep -Fq 'qolTimeAttackEnemyKilled' "$level"
          grep -Fq 'krf_qol_time_attack' "$level"
          grep -Fq 'Timer + all waves:' "$level"
          grep -Fq 'Recycle exits:' "$level"
          grep -Fq 'if(Level.qolRecycleEnemies)' "$enemy"
          grep -Fq 'this.cRoot.qolTimeAttackEnemyKilled();' "$enemy"
          grep -Fq 'this.§package for var§ = 0;' "$enemy"
          grep -Fq 'if(Level.qolRecycleEnemies)' "$beast"
          grep -Fq 'this.§package for var§ = 0;' "$beast"
          grep -Fq 'if(Level.qolRecycleEnemies)' "$tremor"
          grep -Fq 'this.cRoot.qolTimeAttackEnemyKilled();' "$tremor"
          grep -Fq 'return super.§with catch§();' "$nightscale"
          echo 'Compiled V7 verification passed.'

      - name: Publish rebuilt asset and metadata to feature branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/kingdom-rush-frontiers-v7.swf assets/kingdom-rush-frontiers-v5.swf
          sha256sum assets/kingdom-rush-frontiers-v5.swf > assets/V7-SHA256SUMS.txt
          cat > assets/V7-BUILD.txt <<'EOF'
          Frontiers V7 time-attack build
          - Settings page adds separate Timer + all waves and Recycle exits toggles
          - Timer mode activates every authored wave immediately when enabled before wave 1
          - Timer measures wall-clock seconds from launch until every active wave has finished spawning and the final living enemy is killed
          - Best time is persisted per level/mode in a separate SharedObject named krf_qol_time_attack
          - Base enemy exits recycle before life loss, exit gold, or destruction
          - Tremor's copied exit handler and the Cannibal Beast boss's scripted endpoint are explicitly recycled too
          - Underwater transformation enemies and the final-boss fusion piece keep their intended internal transformations; their resulting normal enemies still recycle at the map exit
          - Recycled enemies keep the same object, health, and boss state and restart at path node 0
          - Existing V6 sandbox, hero, boss Send All, and performance patches remain intact
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/kingdom-rush-frontiers-v5.swf assets/V7-BUILD.txt assets/V7-SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo 'Compiled V7 asset already matches branch.'
            exit 0
          fi
          git commit -m 'Build verified V7 time attack [skip ci]'
          git pull --rebase origin agent/time-attack-mode
          git push origin HEAD:agent/time-attack-mode

      - name: Publish build diagnostic
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          set -u
          mkdir -p analysis
          {
            echo "job_status=${{ job.status }}"
            echo "head=${GITHUB_SHA}"
            echo
            echo '=== exit-hook overrides ==='
            if [ -f /tmp/v7-overrides.txt ]; then cat /tmp/v7-overrides.txt; else echo '(check not reached)'; fi
            echo
            echo '=== export tail ==='
            if [ -f /tmp/v7-export.log ]; then tail -n 80 /tmp/v7-export.log; else echo '(no export log)'; fi
            echo
            echo '=== import tail ==='
            if [ -f /tmp/v7-import.log ]; then tail -n 160 /tmp/v7-import.log; else echo '(no import log)'; fi
            echo
            echo '=== verify export tail ==='
            if [ -f /tmp/v7-verify-export.log ]; then tail -n 80 /tmp/v7-verify-export.log; else echo '(no verify log)'; fi
          } > analysis/v7-build-report.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- analysis/v7-build-report.txt
          git commit -m 'Record V7 build diagnostic [skip ci]' || exit 0
          git pull --rebase origin agent/time-attack-mode
          git push origin HEAD:agent/time-attack-mode
