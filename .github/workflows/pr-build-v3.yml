name: PR Build Frontiers v3

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build:
    if: github.head_ref == 'agent/v3-mobile-tools'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download FFDec
        run: |
          set -euo pipefail
          curl -fL --retry 4 'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          mkdir -p /tmp/ffdec
          unzip -q /tmp/ffdec.zip -d /tmp/ffdec
          test -f /tmp/ffdec/ffdec.jar

      - name: Export and patch v2 ActionScript
        run: |
          set -euo pipefail
          rm -rf /tmp/v3scripts /tmp/import /tmp/verify /tmp/out
          mkdir -p /tmp/v3scripts /tmp/import/scripts /tmp/out
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 60 -exportFileTimeout 120 -export script /tmp/v3scripts assets/kingdom-rush-frontiers-qol-v2.swf > /tmp/export-v3.log 2>&1 || true
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/build-v3.py')
          s=p.read_text()
          s=s.replace('Open the sandbox special-tower page."}))\'','Open the sandbox special-tower page."})\'')
          p.write_text(s)
          PY
          python3 tools/build-v3.py patch /tmp/v3scripts/scripts /tmp/import
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/import/scripts/TowerHolder.as')
          s=p.read_text(encoding='utf-8')
          a=s.find('if(param1 == "qol_specials")')
          b=s.find('if(param1 == "qol_dwarf")',a)
          if a < 0 or b < 0:
              raise SystemExit('generated special tower block not found')
          block=s[a:b]
          block=block.replace('))));', ')));')
          s=s[:a]+block+s[b:]
          p.write_text(s,encoding='utf-8',newline='')
          PY

      - name: Rebuild v3 SWF
        run: |
          set -euo pipefail
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror abort -importScript assets/kingdom-rush-frontiers-qol-v2.swf /tmp/out/kingdom-rush-frontiers-v3.swf /tmp/import > /tmp/import-v3.log 2>&1
          test -s /tmp/out/kingdom-rush-frontiers-v3.swf
          head -c 3 /tmp/out/kingdom-rush-frontiers-v3.swf | grep -Eq 'FWS|CWS|ZWS'

      - name: Re-export and verify v3
        run: |
          set -euo pipefail
          mkdir -p /tmp/verify
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 60 -selectclass 'Level,§_-2i§,§_-BQ§,TowerHolder,§_-LZ§' -export script /tmp/verify /tmp/out/kingdom-rush-frontiers-v3.swf > /tmp/verify-v3.log 2>&1 || true
          python3 tools/build-v3.py verify /tmp/verify/scripts

      - name: Publish verified v3 build
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          cp /tmp/out/kingdom-rush-frontiers-v3.swf assets/kingdom-rush-frontiers-v3.swf
          cat > assets/V3-BUILD.txt <<'EOF'
          Kingdom Rush Frontiers — V3 Mobile + Sandbox
          Includes QoL v2 and Unlock-All v1.
          Moves speed controls into the in-level pause tools and adds +100 cash.
          Adds configurable 0-7 heroes and exact remaining hero skill currency.
          Gives exactly the remaining stars required for the 65-star upgrade tree.
          Adds custom enemy-round tools, send-all-waves, and a special-tower build page.
          Built and re-export verified with FFDec 26.2.1.
          EOF
          sha256sum assets/kingdom-rush-frontiers-qol-v2.swf assets/kingdom-rush-frontiers-v3.swf > assets/V3-SHA256SUMS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/kingdom-rush-frontiers-v3.swf assets/V3-BUILD.txt assets/V3-SHA256SUMS.txt
          git commit -m 'Add verified Frontiers v3 build [skip ci]' || exit 0
          git checkout -- tools/build-v3.py || true
          git pull --rebase origin "${TARGET_BRANCH}"
          git push origin HEAD:"${TARGET_BRANCH}"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v3-build-logs
          path: |
            /tmp/export-v3.log
            /tmp/import-v3.log
            /tmp/verify-v3.log
          if-no-files-found: ignore
          retention-days: 1
