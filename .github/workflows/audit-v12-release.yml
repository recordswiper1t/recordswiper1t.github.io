# Final release gate for the generated V12.1 binary and every published launcher path.
name: Audit KRF V12.1 release surface

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/kingdom-rush-frontiers-v12-1.swf'
      - 'assets/V12-1-BUILD.txt'
      - 'assets/V12-1-SHA256SUMS.txt'
      - 'assets/kingdom-rush-frontiers-v12.swf'
      - 'assets/V12-SHA256SUMS.txt'
      - 'tools/v12_1/**'
      - 'desktop/**'
      - 'index.html'
      - 'mod/fast.html'
      - 'mod/index.html'
      - 'iphone/krf.html'
      - 'README.md'
      - '.github/workflows/build-v12-1-audio-popups.yml'
      - '.github/workflows/audit-v12-release.yml'
  push:
    branches: [main]
    paths:
      - 'assets/kingdom-rush-frontiers-v12-1.swf'
      - 'assets/V12-1-BUILD.txt'
      - 'assets/V12-1-SHA256SUMS.txt'
      - 'assets/kingdom-rush-frontiers-v12.swf'
      - 'assets/V12-SHA256SUMS.txt'
      - 'tools/v12_1/**'
      - 'desktop/**'
      - 'index.html'
      - 'mod/fast.html'
      - 'mod/index.html'
      - 'iphone/krf.html'
      - 'README.md'
      - '.github/workflows/build-v12-1-audio-popups.yml'
      - '.github/workflows/audit-v12-release.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify V12.1 binary, checksum and provenance
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/kingdom-rush-frontiers-v12-1.swf
          sha256sum -c assets/V12-1-SHA256SUMS.txt
          head -c 3 assets/kingdom-rush-frontiers-v12-1.swf | grep -Eq 'FWS|CWS|ZWS'
          grep -F 'V12.1 Audio + Pop-up Polish' assets/V12-1-BUILD.txt
          grep -F 'POP-UP HINTS / Tooltips preference persists across fresh Ruffle sessions' assets/V12-1-BUILD.txt
          test -s assets/kingdom-rush-frontiers-v12.swf
          sha256sum -c assets/V12-SHA256SUMS.txt

      - name: Verify V12.1 patch/build pipeline
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/v12_1/audio_popups.py tools/v12_1/persisted_popup_state.py
          grep -F 'python3 tools/v12_1/persisted_popup_state.py' .github/workflows/build-v12-1-audio-popups.yml
          grep -F 'sha256sum -c assets/V12-SHA256SUMS.txt' .github/workflows/build-v12-1-audio-popups.yml
          grep -F 'qolLoadPopupPreference' tools/v12_1/persisted_popup_state.py
          grep -F 'qolSetPopupPreference' tools/v12_1/persisted_popup_state.py
          grep -F 'SharedObject.getLocal("krf_qol_settings")' tools/v12_1/persisted_popup_state.py
          grep -F 'save.flush()' tools/v12_1/persisted_popup_state.py
          grep -F 'this.cRoot.qolSetPopupPreference' tools/v12_1/persisted_popup_state.py

      - name: Verify Python native launcher prefers V12.1
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile desktop/run_native.py
          python3 desktop/run_native.py --help >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          text = Path('desktop/run_native.py').read_text(encoding='utf-8')
          v121 = text.index('kingdom-rush-frontiers-v12-1.swf')
          v12 = text.index('kingdom-rush-frontiers-v12.swf')
          assert v121 < v12, 'Python launcher does not prefer V12.1 before V12'
          assert 'kingdom-rush-frontiers-v5.swf' in text
          assert '"dx12"' in text and '"gl"' in text
          PY

      - name: Verify PowerShell native launcher prefers V12.1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('desktop/run-native.ps1').read_text(encoding='utf-8')
          v121 = text.index('kingdom-rush-frontiers-v12-1.swf')
          v12 = text.index('kingdom-rush-frontiers-v12.swf')
          assert v121 < v12, 'PowerShell launcher does not prefer V12.1 before V12'
          assert 'kingdom-rush-frontiers-v5.swf' in text
          assert "'dx12'" in text and "'gl'" in text
          PY
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("desktop/run-native.ps1",[ref]$tokens,[ref]$errors) | Out-Null; if($errors.Count -gt 0){$errors | ForEach-Object { Write-Error $_ }; exit 1}'
          fi

      - name: Verify browser, iPhone and docs target V12.1
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'https://unpkg.com/@ruffle-rs/ruffle@0.5.0' mod/fast.html
          if grep -Fq 'preloader:false' mod/fast.html iphone/krf.html; then
            echo 'Deprecated Ruffle preloader option returned' >&2
            exit 1
          fi
          grep -F '/mod/fast.html?v=12-1-audio-popups-r3' mod/index.html
          grep -F '/assets/kingdom-rush-frontiers-v12-1.swf?v=12-1-audio-popups-r3' mod/fast.html
          grep -F '/assets/kingdom-rush-frontiers-v12-1.swf?v=iphone-v121-r3' iphone/krf.html
          grep -F '/mod/' index.html
          grep -F '/iphone/krf.html' index.html
          grep -F 'V12.1' mod/index.html
          grep -F 'persists across fresh Ruffle sessions' mod/index.html
          grep -F 'V12.1' README.md
          grep -F 'V12.1' desktop/README.md
          grep -F 'V12.1 → V12 → V11 → V10 → V9 → V8 → V5 fallback' desktop/README.md
          grep -F 'DX12' desktop/README.md
          grep -F 'OpenGL' desktop/README.md

      - name: Smoke-test the GitHub Pages loading path locally
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/krf-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..20}; do
            if curl -fsS http://127.0.0.1:8765/mod/ >/tmp/krf-mod.html; then break; fi
            sleep 0.25
          done
          grep -F '/mod/fast.html?v=12-1-audio-popups-r3' /tmp/krf-mod.html
          curl -fsS 'http://127.0.0.1:8765/mod/fast.html?v=12-1-audio-popups-r3' -o /tmp/krf-fast.html
          grep -F '/assets/kingdom-rush-frontiers-v12-1.swf?v=12-1-audio-popups-r3' /tmp/krf-fast.html
          curl -fsS http://127.0.0.1:8765/assets/kingdom-rush-frontiers-v12-1.swf -o /tmp/krf-v121.swf
          test -s /tmp/krf-v121.swf
          head -c 3 /tmp/krf-v121.swf | grep -Eq 'FWS|CWS|ZWS'
          local_hash=$(sha256sum /tmp/krf-v121.swf | cut -d' ' -f1)
          manifest_hash=$(cut -d' ' -f1 assets/V12-1-SHA256SUMS.txt)
          test "$local_hash" = "$manifest_hash"
