name: Verify Epic War 5 Expansion V3.3

on:
  push:
    branches:
      - epicwar5-expansion-v33-polish
    paths:
      - '.github/workflows/verify-epicwar5-expansion-v33.yml'
      - 'tools/epicwar5/expansion/**'
      - 'epicwar5-expansion/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/verify-epicwar5-expansion-v33.yml'
      - 'tools/epicwar5/expansion/**'
      - 'epicwar5-expansion/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: epicwar5-expansion-v33-polish
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download exact game and FFDec
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/ew5 /tmp/ffdec
          curl -fL --retry 3 --connect-timeout 20 'https://cache.armorgames.com/files/games/epic-war-5-12518.swf' -o /tmp/ew5/original.swf
          test "$(sha256sum /tmp/ew5/original.swf | cut -d' ' -f1)" = '848d173b5cba7ebc321ba6dc374389e038924e32cb4a42b0d1b31f51c0b71bb8'
          curl -fL --retry 3 'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          unzip -q /tmp/ffdec.zip -d /tmp/ffdec
      - name: Rebuild exact V3.2 baseline
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/ew5/base /tmp/ew5/v32src /tmp/ew5/v33src /tmp/ew5/out /tmp/ew5/verify
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 -export script /tmp/ew5/base /tmp/ew5/original.swf > /tmp/ew5/export-base.log 2>&1 || true
          python3 tools/epicwar5/expansion/build_expansion_storage_v3.py /tmp/ew5/base
          python3 tools/epicwar5/expansion/patch_progression_curve_v3.py /tmp/ew5/base
          python3 tools/epicwar5/expansion/patch_formation_army_pages_v3.py /tmp/ew5/base
          python3 tools/epicwar5/expansion/patch_equipment_slots_v3.py /tmp/ew5/base
          python3 tools/epicwar5/expansion/patch_catalog_compat_v3.py /tmp/ew5/base
          python3 tools/epicwar5/expansion/patch_expansion_equipment_catalog_v3.py /tmp/ew5/base
          python3 tools/epicwar5/expansion/patch_advanced_upgrades_v3.py /tmp/ew5/base
          python3 tools/epicwar5/expansion/patch_battle_rewards_v3.py /tmp/ew5/base
          python3 tools/epicwar5/expansion/patch_battle_12_units_v3.py /tmp/ew5/base
          python3 tools/epicwar5/expansion/patch_progression_enforcement_v3.py /tmp/ew5/base
          python3 tools/epicwar5/expansion/patch_expansion_campaign_v3.py /tmp/ew5/base
          python3 tools/epicwar5/expansion/patch_campaign_newline_compat_v3.py /tmp/ew5/base
          python3 tools/epicwar5/expansion/patch_polish_compat_v31.py /tmp/ew5/base
          python3 tools/epicwar5/expansion/patch_polish_v31.py /tmp/ew5/base
          python3 tools/epicwar5/expansion/patch_polish_compat_v32.py /tmp/ew5/base
          python3 tools/epicwar5/expansion/patch_polish_v32.py /tmp/ew5/base
          python3 tools/epicwar5/expansion/patch_polish_cleanup_v32.py /tmp/ew5/base
          python3 tools/epicwar5/expansion/patch_advanced_identity_v32.py /tmp/ew5/base
          if ! java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror abort -importScript /tmp/ew5/original.swf /tmp/ew5/out/v32.swf /tmp/ew5/base > /tmp/ew5/import-v32.log 2>&1; then
            cat /tmp/ew5/import-v32.log
            exit 1
          fi
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 -export script /tmp/ew5/v32src /tmp/ew5/out/v32.swf > /tmp/ew5/export-v32.log 2>&1 || true
          test -f /tmp/ew5/v32src/scripts/Game/System/GameObject/Character/CharacterBase.as
      - name: Apply V3.3 to exact compiled V3.2 source
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/epicwar5/expansion/patch_performance_v33.py /tmp/ew5/v32src
      - name: Rebuild V3.3 SWF
        shell: bash
        run: |
          set -euxo pipefail
          if ! java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror abort -importScript /tmp/ew5/out/v32.swf /tmp/ew5/out/epic-war-5-expansion-v33.swf /tmp/ew5/v32src > /tmp/ew5/import-v33.log 2>&1; then
            echo '===== FFDec V3.3 import diagnostics ====='
            cat /tmp/ew5/import-v33.log
            exit 1
          fi
          test -s /tmp/ew5/out/epic-war-5-expansion-v33.swf
      - name: Re-decompile and verify V3.3
        shell: bash
        run: |
          set -euxo pipefail
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 -export script /tmp/ew5/verify /tmp/ew5/out/epic-war-5-expansion-v33.swf > /tmp/ew5/verify.log 2>&1 || true
          cb=/tmp/ew5/verify/scripts/Game/System/GameObject/Character/CharacterBase.as
          pu=/tmp/ew5/verify/scripts/Game/System/Battle/PlayerUnit.as
          ew=/tmp/ew5/verify/scripts/Game/System/Battle/EnemyWave.as
          be=/tmp/ew5/verify/scripts/Game/System/Battle/BattleControlEnemy.as
          bg=/tmp/ew5/verify/scripts/Game/System/Background/BackgroundMgr.as
          fx=/tmp/ew5/verify/scripts/Game/Manager/EffectManager.as
          bs=/tmp/ew5/verify/scripts/Game/System/Battle/BattleSystem.as
          dm=/tmp/ew5/verify/scripts/Game/Manager/DataManager.as
          br=/tmp/ew5/verify/scripts/Game/Interface/BattleResult.as
          ca=/tmp/ew5/verify/scripts/Game/System/StatDef/CharAbilityStat.as
          ci=/tmp/ew5/verify/scripts/Game/System/StatDef/CharItemStat.as
          acc=/tmp/ew5/verify/scripts/Game/Interface/WorldMapFormationAcc.as
          cts=/tmp/ew5/verify/scripts/Game/System/StatDef/CharTotalStat.as

          grep -F 'Math.abs(myClip.x - child.x) <= 900' "$cb"
          grep -F 'this._healthbar_refresh = 3' "$cb"
          grep -F 'isWorldXVisible(X,220)' "$cb"
          grep -F 'var myDepth:int = this.getZDepth()' "$cb"
          if grep -Fq 'children.sort(this.zSorting)' "$cb"; then echo 'old full depth sort survived' >&2; exit 1; fi

          grep -F 'this._count_refresh = 8' "$pu"
          grep -F 'this._ui_refresh = 3' "$pu"
          grep -F 'countEnemyWave(COMMAND:Boolean = false)' "$ew"
          grep -F 'setMaxUnit(VAL:int = 25)' "$ew"
          grep -F 'this._count_refresh = 8' "$ew"
          grep -F 'var waveCap:int = Math.min(22,16 + int(tier / 4))' "$be"

          grep -F '120 - int(this.mGF.contFILTER.numChildren)' "$bg"
          grep -F 'burst = this.mGF.stageRoot.stage.quality == "low" ? 18 : 36' "$bg"
          grep -F 'isWorldXVisible(X:Number = 0, MARGIN:Number = 250)' "$fx"
          grep -F 'contBLOODSPLAT.numChildren >= 60' "$fx"
          grep -F 'load >= 175' "$bs"
          grep -F 'updateAdaptivePerformance()' "$bs"

          grep -F 'dat_item_inv.length < 57' "$dm"
          grep -F 'itemGetValue(30 + relicStage) == 1' "$dm"
          grep -F 'itemGetValue(57) < 2' "$dm"
          grep -F 'Math.max(this.mGF.datMgr.itemGetValue(itemReward),2)' "$br"
          grep -F 'case 107:' "$ca"
          grep -F 'x_conquerormedal' "$ca"
          grep -F 'i <= 107' "$ca"
          grep -F 'case 57:' "$ci"
          grep -F 'Conqueror Medal' "$ci"
          grep -F 'i <= 57' "$ci"
          grep -F 'if(itemSlot > 57)' "$acc"

          # Core V3.2 behavior must survive the performance pass.
          grep -F 'if(CLEARS >= 45)' "$dm"
          grep -F 'expansionUpgradeCostMultiplier' "$dm"
          grep -F 'return [20,46,52,15,47,39,37,48,35]' "$cts"
          grep -F 'firstClear:Boolean' "$be"
          grep -F 'firstClear ? String(rewardNames[index]) : ""' "$be"
      - name: Upload verified V3.3 build
        uses: actions/upload-artifact@v4
        with:
          name: epicwar5-expansion-v33-verified
          retention-days: 7
          path: |
            /tmp/ew5/out/epic-war-5-expansion-v33.swf
            /tmp/ew5/import-v32.log
            /tmp/ew5/import-v33.log
            /tmp/ew5/verify.log
