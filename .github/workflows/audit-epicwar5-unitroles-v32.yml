name: Audit Epic War 5 V3.2 Unit Roles

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/audit-epicwar5-unitroles-v32.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Export base unit definitions
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/ew5 /tmp/ffdec /tmp/ew5/export
          curl -fL --retry 3 --connect-timeout 20 'https://cache.armorgames.com/files/games/epic-war-5-12518.swf' -o /tmp/ew5/original.swf
          test "$(sha256sum /tmp/ew5/original.swf | cut -d' ' -f1)" = '848d173b5cba7ebc321ba6dc374389e038924e32cb4a42b0d1b31f51c0b71bb8'
          curl -fL --retry 3 'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.2.1/ffdec_26.2.1.zip' -o /tmp/ffdec.zip
          unzip -q /tmp/ffdec.zip -d /tmp/ffdec
          java -Xmx4g -jar /tmp/ffdec/ffdec.jar -onerror ignore -timeout 90 -exportFileTimeout 180 -export script /tmp/ew5/export /tmp/ew5/original.swf > /tmp/ew5/export.log 2>&1 || true
          test -f /tmp/ew5/export/scripts/Game/System/StatDef/CharBaseStat.as
      - name: Upload unit-role source
        uses: actions/upload-artifact@v4
        with:
          name: epicwar5-v32-unit-roles
          retention-days: 7
          path: |
            /tmp/ew5/export/scripts/Game/System/StatDef/CharBaseStat.as
            /tmp/ew5/export.log
