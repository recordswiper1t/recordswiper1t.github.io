<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<title>Kingdom Rush Frontiers — V12.2 Offline Edition</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}
body{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#player{position:absolute;inset:0;display:grid;place-items:center;background:#000;overflow:hidden;contain:strict}
ruffle-player{display:block;width:100%!important;height:100%!important;touch-action:none!important;overscroll-behavior:none!important;-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important}
#loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#000;font-size:14px;text-align:center;padding:24px}
#loading.hidden{display:none}
#menu{position:fixed;z-index:30;right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));width:44px;height:44px;border:1px solid #555;border-radius:12px;background:#151515;color:#fff;font-size:24px;touch-action:manipulation;contain:layout paint style}
#panel{position:fixed;z-index:29;right:max(8px,env(safe-area-inset-right));top:calc(max(8px,env(safe-area-inset-top)) + 50px);display:none;gap:8px;width:min(285px,calc(100vw - 16px));padding:10px;border:1px solid #444;border-radius:14px;background:#101010;contain:layout paint style}
#panel.open{display:grid}
button,a{appearance:none;border:0;border-radius:10px;min-height:42px;padding:10px 12px;background:#d7a94d;color:#1f1708;font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center;text-decoration:none}
.secondary{background:#292929;color:#fff;border:1px solid #494949}
#status{position:fixed;z-index:25;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:94vw;padding:7px 10px;border-radius:9px;background:#111;color:#ddd;font-size:11px;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div id="player"></div>
<div id="loading"><div>Loading V12.2 — Offline Edition…</div></div>
<button id="menu" aria-label="Game controls">⋯</button>
<div id="panel">
<button id="quality">Visual quality: Auto</button>
<button id="full" class="secondary">Full screen</button>
<button id="saves" class="secondary">Saves / backup</button>
<button id="reload" class="secondary">Reload V12.2</button>
<a class="secondary" href="/mod/">V12.2 info / native desktop</a>
<a class="secondary" href="https://github.com/recordswiper1t/recordswiper1t.github.io">Download native version</a>
</div>
<div id="status">V12.2 Offline Edition • browser mode • native desktop recommended for huge swarms</div>
<script src="/vendor/ruffle/0.5.0/ruffle.js"></script>
<script>
(()=>{
'use strict';
const SWF_URL='/assets/kingdom-rush-frontiers-v12-2-offline.swf?v=12-2-offline-clean';
const CANONICAL_SWF_NAME='kingdom-rush-frontiers.swf';
const playerHost=document.getElementById('player'),panel=document.getElementById('panel'),loading=document.getElementById('loading'),status=document.getElementById('status');
const touch=('ontouchstart' in window)||(navigator.maxTouchPoints||0)>0||(matchMedia&&matchMedia('(pointer:coarse)').matches);
const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&(navigator.maxTouchPoints||0)>1);
let player=null;
function defaultQuality(){return ios?'low':touch?'medium':'high'}
function selectedQuality(){return localStorage.getItem('krf-fast-quality')||defaultQuality()}
function updateQualityLabel(){document.getElementById('quality').textContent='Visual quality: '+selectedQuality().toUpperCase()}
function makePlayer(){const api=window.RufflePlayer&&window.RufflePlayer.newest&&window.RufflePlayer.newest();if(!api)throw new Error('Ruffle failed to load.');const p=api.createPlayer();p.tabIndex=0;p.style.touchAction='none';playerHost.replaceChildren(p);player=p;return p}
async function load(){loading.classList.remove('hidden');status.textContent='Loading V12.2 • '+selectedQuality().toUpperCase()+' quality';try{const p=player||makePlayer();await p.ruffle().load({url:SWF_URL,swfFileName:CANONICAL_SWF_NAME,autoplay:'on',unmuteOverlay:'hidden',contextMenu:'on',menu:true,allowFullscreen:true,fullScreenAspectRatio:'landscape',scale:'showAll',quality:selectedQuality(),backgroundColor:'#000000',allowScriptAccess:false,openUrlMode:'confirm',allowNetworking:'all',upgradeToHttps:true,compatibilityRules:true,warnOnUnsupportedContent:false,splashScreen:false,polyfills:false,backgroundExecutionMode:'none',base:location.origin+'/mod/'});try{p.focus({preventScroll:true})}catch(_){try{p.focus()}catch(__){}}status.textContent='V12.2 Offline Edition • '+selectedQuality().toUpperCase()+' • sandbox, loop scoring and post-boss act enabled';}catch(e){status.textContent='V12.2 failed to load: '+(e.message||String(e))+' • try the native desktop launcher';throw e}finally{loading.classList.add('hidden')}}
function saveMenu(){if(!player)return;try{const r=player.getBoundingClientRect();player.dispatchEvent(new MouseEvent('contextmenu',{bubbles:true,cancelable:true,clientX:r.left+Math.min(100,r.width/2),clientY:r.top+Math.min(100,r.height/2),button:2,buttons:2,view:window}));status.textContent='Ruffle menu requested • choose Save Manager';}catch(_){status.textContent='Long-press inside the game for Ruffle save controls'}}
document.getElementById('menu').onclick=()=>panel.classList.toggle('open');
document.getElementById('reload').onclick=()=>location.reload();
document.getElementById('full').onclick=()=>{panel.classList.remove('open');try{if(player&&player.ruffle().fullscreenEnabled)player.ruffle().requestFullscreen();else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen()}catch(_){}};
document.getElementById('saves').onclick=()=>{panel.classList.remove('open');saveMenu()};
document.getElementById('quality').onclick=()=>{const q=selectedQuality(),next=q==='low'?'medium':q==='medium'?'high':'low';localStorage.setItem('krf-fast-quality',next);updateQualityLabel();status.textContent='Quality set to '+next.toUpperCase()+' • reloading';setTimeout(()=>location.reload(),50)};
playerHost.addEventListener('pointerdown',()=>{if(player){try{player.focus({preventScroll:true})}catch(_){}}},{capture:true,passive:true});
playerHost.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
for(const name of ['gesturestart','gesturechange','gestureend'])document.addEventListener(name,e=>e.preventDefault(),{passive:false});
updateQualityLabel();
load().catch(()=>{});
})();
</script>
</body>
</html>
