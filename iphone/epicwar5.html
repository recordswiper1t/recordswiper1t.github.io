<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#000"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0"><title>Epic War 5 Expansion V3.3.1 — iPhone</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}body{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none}#host{position:absolute;inset:0;display:grid;place-items:center;background:#000;overflow:hidden}ruffle-player{display:block!important;width:min(100vw,calc(100dvh * 4 / 3))!important;height:min(100dvh,calc(100vw * 3 / 4))!important;max-width:100vw!important;max-height:100dvh!important;aspect-ratio:4/3!important;touch-action:none!important}#start{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:max(22px,env(safe-area-inset-top)) 18px max(22px,env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 0,#4d2c29 0,#171218 50%,#060507 100%)}.card{width:min(470px,100%);padding:22px;border-radius:20px;border:1px solid #66423f;background:rgba(18,12,15,.97);text-align:center}.card h1{margin:4px 0 8px;font-size:35px;line-height:1}.card p{color:#d0c1c7;line-height:1.45}.start{width:100%;min-height:58px;border:0;border-radius:14px;background:#d9784a;color:#1d0d08;font:900 18px inherit}.small{font-size:12px;color:#aa989f}.hidden{display:none!important}#top{position:fixed;z-index:15;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));display:flex;gap:7px}#top button,#top a{display:grid;place-items:center;width:46px;height:46px;padding:0;border-radius:13px;border:1px solid #555;background:rgba(20,20,20,.9);color:#fff;text-decoration:none;font:800 18px inherit;touch-action:manipulation}#status{position:fixed;z-index:14;left:50%;bottom:calc(8px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:92vw;padding:7px 10px;border-radius:9px;background:rgba(10,10,10,.82);font-size:11px;color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
</style></head><body>
<div id="host"></div><div id="top" class="hidden"><a href="/" aria-label="Games">⌂</a><button id="reload" aria-label="Reload">↻</button></div><div id="status" class="hidden">Ready</div>
<section id="start"><div class="card"><div class="small">IPHONE PLAYER • EXPANSION V3.3.1</div><h1>Epic War 5</h1><p>The game now stays inside its native 4:3 frame in either orientation, so Safari cannot crop the battlefield. Landscape is still recommended.</p><button class="start" id="go">Start game</button><p class="small">Low visual quality is used to leave more headroom for large battles.</p></div></section>
<script src="https://unpkg.com/@ruffle-rs/ruffle@0.5.0"></script><script>
(()=>{'use strict';const SWF='/assets/epic-war-5-expansion-v331.swf?v=iphone-fit-v332';const host=document.getElementById('host'),start=document.getElementById('start'),top=document.getElementById('top'),status=document.getElementById('status');let p=null;async function run(){const go=document.getElementById('go');go.disabled=true;go.textContent='Loading…';try{const api=window.RufflePlayer&&window.RufflePlayer.newest&&window.RufflePlayer.newest();if(!api)throw Error('Ruffle did not load');p=api.createPlayer();p.tabIndex=0;host.replaceChildren(p);await p.ruffle().load({url:SWF,swfFileName:'epic-war-5-expansion-v331.swf',autoplay:'on',unmuteOverlay:'visible',contextMenu:'on',menu:true,allowFullscreen:true,scale:'showAll',quality:'low',backgroundColor:'#000000',allowScriptAccess:false,openUrlMode:'confirm',allowNetworking:'all',upgradeToHttps:true,compatibilityRules:true,warnOnUnsupportedContent:false,backgroundExecutionMode:'none'});start.classList.add('hidden');top.classList.remove('hidden');status.classList.remove('hidden');status.textContent='Epic War 5 • 4:3 fit mode';try{p.focus({preventScroll:true})}catch(_){}}catch(e){go.disabled=false;go.textContent='Try again';document.querySelector('.card p').textContent='Load failed: '+(e.message||String(e))}}document.getElementById('go').onclick=run;document.getElementById('reload').onclick=()=>location.reload();host.addEventListener('pointerdown',()=>{try{p&&p.focus({preventScroll:true})}catch(_){}},{capture:true,passive:true});host.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});for(const n of ['gesturestart','gesturechange','gestureend'])document.addEventListener(n,e=>e.preventDefault(),{passive:false})})();
</script></body></html>
